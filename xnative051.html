  async function loadFromGitHub() {
    if (!githubConfig.accessToken) {
      // トークンがない場合はCSVエクスポートのオプションを提供
      offerCsvExportWhenTokenUnavailable('missing');
      return null;
    }

    try {
      const apiUrl = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.filePath}?ref=main`;
      const metaRes = await fetch(apiUrl, { headers: { 'Authorization': `Bearer ${githubConfig.accessToken}`, 'Accept': 'application/vnd.github.v3+json' } });
      if (!metaRes.ok) { if (metaRes.status === 404) return {}; throw new Error(`HTTP ${metaRes.status}: ${metaRes.statusText}`); }
      const meta = await metaRes.json();
      // 1) download_url があればRawで取得（1MB制限回避）
      const tryRaw = async (url) => {
        const txt = (await fetchRawGithubText(url)).replace(/^\uFEFF/, '').trim();
        return JSON.parse(txt);
      };
      let data = null;
      if (meta && meta.download_url) {
        try { data = await tryRaw(meta.download_url); } catch(_e) { data = null; }
      }
      // 2) フォールバック: content(base64) をデコード
      if (!data) {
        const b64 = (meta.content || '').replace(/\n/g, '');
        if (!b64) throw new Error('Missing content from GitHub API');
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const txt = new TextDecoder('utf-8').decode(bytes).replace(/^\uFEFF/, '').trim();
        data = JSON.parse(txt);
      }
      
      if (data.events) {
        // 新しい形式（events + eraSettings + genres）
        eraSettings = normalizeEraSettingsList(data.eraSettings || []);
        if (data.genres) { 
          setGenresFromRemote(data.genres); 
        } else {
          console.warn('GitHub JSONにジャンルデータが含まれていません。空のジャンル状態で続行します。');
        }
        return data.events;
      } else {
        // 古い形式（eventsのみ）
        return data;
      }
    } catch (error) {
      showError('読み込みエラー', `GitHubからの読み込みに失敗しました: ${error.message}`);
      return null;
    }
  }

function normalizeGASSheetsDatasetKeys(ds, names){
  try{
    if (!ds || typeof ds !== 'object') return ds;
    const lowerMap = {};
    for (const k of Object.keys(ds)) lowerMap[String(k).toLowerCase()] = k;
    const getByCandidates = (candidates) => {
      for (const c of candidates) {
        if (!c) continue;
        if (Object.prototype.hasOwnProperty.call(ds, c)) return ds[c];
        const k = lowerMap[String(c).toLowerCase()];
        if (k != null && Object.prototype.hasOwnProperty.call(ds, k)) return ds[k];
      }
      return undefined;
    };
    const isPlainObject = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
    const preferNonEmpty = (primary, fallback) => {
      if (primary === undefined || primary === null) return fallback;
      // もし primary が空で fallback が非空なら fallback を採用（タブ名キーで返るGAS実装差を吸収）
      if (Array.isArray(primary) && primary.length === 0 && Array.isArray(fallback) && fallback.length > 0) return fallback;
      if (isPlainObject(primary) && Object.keys(primary).length === 0 && isPlainObject(fallback) && Object.keys(fallback).length > 0) return fallback;
      return primary;
    };

    const evName = names && names.events;
    const gnName = names && names.genres;
    const erName = names && names.eraSettings;
    const mdName = names && names.metadata;

    const evVal = getByCandidates(['events','ev', evName]);
    const gnVal = getByCandidates(['genres','gn', gnName]);
    const erVal = getByCandidates(['eraSettings','erasettings','era_settings','er', erName]);
    const mdVal = getByCandidates(['metadata','md','meta', mdName]);

    if (evVal !== undefined) ds.events = preferNonEmpty(ds.events, evVal);
    if (gnVal !== undefined) ds.genres = preferNonEmpty(ds.genres, gnVal);
    if (erVal !== undefined) ds.eraSettings = preferNonEmpty(ds.eraSettings, erVal);
    if (mdVal !== undefined) ds.metadata = preferNonEmpty(ds.metadata, mdVal);

    return ds;
  }catch(_e){
    return ds;
  }
}

// ===== Google Sheets via GAS loader =====
async function loadFromGoogleSheetViaGAS(){
  const cfg = sheetConfig || {};
  const api = (cfg.api||'').trim();
  const sheetId = extractSpreadsheetId(cfg.sheetId||'');
  const names = {
    events: (cfg.tabEvents||'events').trim(),
    genres: (cfg.tabGenres||'genres').trim(),
    eraSettings: (cfg.tabEras||'eraSettings').trim(),
    metadata: (cfg.tabMeta||'metadata').trim()
  };
  if(!api || !sheetId){
    throw new Error('GAS API URL と Spreadsheet ID を設定してください（設定→データソースで指定）。');
  }
  const u = new URL(api);
  u.searchParams.set('sheetId', sheetId);
  if (names.events) u.searchParams.set('ev', names.events);
  if (names.genres) u.searchParams.set('gn', names.genres);
  if (names.eraSettings) u.searchParams.set('er', names.eraSettings);
  if (names.metadata) u.searchParams.set('md', names.metadata);
  const res = await fetch(u.toString(), { cache:'no-store' });
  if(!res.ok) throw new Error(`GAS fetch failed: ${res.status} ${res.statusText}`);
  // expected: {schemaVersion, metadata, events, eraSettings, genres}
  const ds = await res.json();
  return normalizeGASSheetsDatasetKeys(ds, names);
}

function validateSheetsDatasetAndMaybeWarn(ds){
  try{
    if (!ds || !ds.events || typeof ds.events !== 'object') return;
    const errors = [];
    let firstFocus = null;
    // 有効ジャンル集合
    const validGenres = new Set(Array.isArray(GENRES) ? GENRES.map(c=>String(c).toUpperCase()) : []);
    const hasGenreMaster = validGenres.size > 0;
    // 重複検出キー: year|label|label_en|genre-sorted
    const dupSet = new Set();
    const anyGid = (()=>{ 
      try{
        for(const y of Object.keys(ds.events)){ const arr = ds.events[y]||[]; for(const it of arr){ if(it && it._sheetGid!=null) return String(it._sheetGid); } }
      }catch(_e){}
      return null;
    })();
    const tabName = (sheetConfig && sheetConfig.tabEvents) ? sheetConfig.tabEvents : 'events';
    // 走査
    for (const yKey of Object.keys(ds.events)) {
      const yNum = parseInt(yKey, 10);
      const arr = ds.events[yKey] || [];
      for (const it of arr) {
        const row = Number(it && (it._sheetRow || it._row)) || null;
        const gid = (it && it._sheetGid != null) ? String(it._sheetGid) : anyGid;
        // startYear
        if (!(Number.isInteger(yNum) && yNum >= YEAR_MIN && yNum <= YEAR_MAX)) {
          errors.push(`開始年が空または範囲外: row ${row||'?'} (${YEAR_MIN}～${YEAR_MAX})`);
          if (!firstFocus && row) firstFocus = { row, col:'C', gid, tab: (it && it._sheetTab) || tabName, year: yNum||YEAR_MIN };
        }
        // endYear
        if (it && it.endYear !== undefined && it.endYear !== null && String(it.endYear) !== '') {
          const endRaw = String(it.endYear);
          const ev = endRaw.toLowerCase()==='ongoing' ? 'ongoing' : parseYearInput(endRaw)?.year;
          if (!(ev==='ongoing' || (Number.isInteger(ev) && ev>=YEAR_MIN && ev<=YEAR_MAX))) {
            errors.push(`終了年が不正: row ${row||'?'} (${YEAR_MIN}～${YEAR_MAX} または ongoing)`);
            if (!firstFocus && row) firstFocus = { row, col:'D', gid, tab: (it && it._sheetTab) || tabName, year: yNum||YEAR_MIN };
          }
        }
        // importance
        if (it && it.imp !== undefined && it.imp !== null && String(it.imp) !== '') {
          const iv = parseInt(it.imp, 10);
          if (!(iv>=1 && iv<=5)) {
            errors.push(`重要度が不正(1～5): row ${row||'?'} value=${it.imp}`);
            if (!firstFocus && row) firstFocus = { row, col:'F', gid, tab: (it && it._sheetTab) || tabName, year: yNum||YEAR_MIN };
          }
        }
        // genres unknown
        if (it && it.genre) {
          const gs = Array.isArray(it.genre) ? it.genre : [it.genre];
          for (const g of gs) {
            const code = String(g||'').toUpperCase();
            if (!code) continue;
            if (hasGenreMaster && !validGenres.has(code)) {
              errors.push(`未知ジャンルコード: row ${row||'?'} code=${code}`);
              if (!firstFocus && row) firstFocus = { row, col:'E', gid, tab: (it && it._sheetTab) || tabName, year: yNum||YEAR_MIN };
            }
          }
        }
        // duplicate
        const label = (it && it.label) ? String(it.label).trim() : '';
        const labelEn = (it && it.label_en) ? String(it.label_en).trim() : '';
        const gkey = (it && it.genre) ? (Array.isArray(it.genre) ? it.genre.slice().map(x=>String(x).toUpperCase()).sort().join('|') : String(it.genre).toUpperCase()) : '';
        const key = `${yNum}|${label}|${labelEn}|${gkey}`;
        if (dupSet.has(key)) {
          errors.push(`重複の可能性: row ${row||'?'} year=${yNum} label="${label}"`);
          if (!firstFocus && row) firstFocus = { row, col:'A', gid, tab: (it && it._sheetTab) || tabName, year: yNum||YEAR_MIN };
        } else {
          dupSet.add(key);
        }
      }
    }
    if (errors.length > 0) {
      const head = currentLang==='ja' ? 'データ検証エラーが見つかりました。' : 'Validation errors were found.';
      const details = errors.slice(0, 8).map(m=>`- ${m}`).join('\n');
      const tail = errors.length>8 ? `\n…他 ${errors.length-8} 件` : '';
      showError('検証エラー', `${head}\n\n${details}${tail}\n\n${currentLang==='ja'?'「閉じる」を押すとエラー箇所へ移動します。':'Press Close to jump to the first error cell.'}`);
      if (firstFocus && firstFocus.row) {
        setTimeout(()=> {
          try{
            const btn = document.getElementById('modalClose');
            if (!btn) return;
            const handler = ()=> {
              try {
                if (suppressModalCloseSheetJumpOnce) {
                  suppressModalCloseSheetJumpOnce = false;
                  return;
                }
                openGoogleSheetForEvent({ _sheetGid:firstFocus.gid, _sheetTab:firstFocus.tab, _sheetRow:firstFocus.row }, firstFocus.year, firstFocus.col);
              } catch(_e){}
            };
            btn.addEventListener('click', handler, { once:true });
          }catch(_e){}
        }, 0);
      }
    }
  }catch(e){ console.warn('validateSheetsDatasetAndMaybeWarn error:', e); }
}

  function makeGithubRefJsonCacheKey(owner, repo, filePath, branch) {
    return `${owner}/${repo}/${branch || 'main'}/${filePath}`;
  }

  function parseGithubJsonText(txt) {
    const cleaned = String(txt || '').replace(/^\uFEFF/, '').trim();
    if (!cleaned) throw new Error('GitHub JSON is empty');
    try {
      return JSON.parse(cleaned);
    } catch (parseError) {
      throw new Error(`JSON parse error: ${parseError.message}`);
    }
  }

  function decodeGithubApiContent(fileMeta) {
    const b64 = String((fileMeta && fileMeta.content) || '').replace(/\n/g, '');
    if (!b64) throw new Error('GitHub API contents missing content');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  // 参照年表向け raw 取得（キャッシュバスターなし＝ブラウザキャッシュを活用）
  async function fetchRawGithubTextCached(url) {
    const res = await fetch(url, { cache: 'default' });
    if (!res.ok) throw new Error(`GitHub raw file error: ${res.status} ${res.statusText}`);
    return res.text();
  }

  async function fetchGithubJsonViaApi(owner, repo, filePath, branch) {
    const token = (githubConfig && githubConfig.accessToken) ? String(githubConfig.accessToken).trim() : '';
    if (!token) throw new Error('GitHub access token is not configured');
    const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${filePath}?ref=${branch || 'main'}`;
    const apiRes = await fetch(apiUrl, {
      headers: {
        'Authorization': `Bearer ${token}`,
        'Accept': 'application/vnd.github.v3+json'
      },
      cache: 'default'
    });
    if (!apiRes.ok) throw new Error(`GitHub API contents error: ${apiRes.status} ${apiRes.statusText}`);
    const fileMeta = await apiRes.json();
    return parseGithubJsonText(decodeGithubApiContent(fileMeta));
  }

  async function loadGithubJsonFile({ owner, repo, filePath, branch = 'main', bustCache = false }) {
    const key = makeGithubRefJsonCacheKey(owner, repo, filePath, branch);
    if (!bustCache) {
      const hit = githubRefJsonMemoryCache.get(key);
      if (hit && (Date.now() - hit.fetchedAt) < GITHUB_REF_JSON_CACHE_TTL_MS) {
        return hit.data;
      }
    } else {
      githubRefJsonMemoryCache.delete(key);
    }

    const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`;
    const storeAndReturn = (data) => {
      githubRefJsonMemoryCache.set(key, { data, fetchedAt: Date.now() });
      return data;
    };

    try {
      const txt = await fetchRawGithubTextCached(rawUrl);
      return storeAndReturn(parseGithubJsonText(txt));
    } catch (e1) {
      const token = (githubConfig && githubConfig.accessToken) ? String(githubConfig.accessToken).trim() : '';
      if (!token) throw e1;
      console.warn('参照年表: raw 取得失敗。GitHub API へフォールバックします:', key, e1 && e1.message ? e1.message : e1);
      const data = await fetchGithubJsonViaApi(owner, repo, filePath, branch);
      return storeAndReturn(data);
    }
  }

  // raw.githubusercontent.com 向け fetch（カスタムヘッダーなし＝CORS preflight を避ける）
  async function fetchRawGithubText(url) {
    const bust = `${url}${url.includes('?') ? '&' : '?'}t=${Date.now()}`;
    const res = await fetch(bust, { cache: 'no-store' });
    if (!res.ok) throw new Error(`GitHub raw file error: ${res.status} ${res.statusText}`);
    return res.text();
  }

  // GitHubにデータを保存（競合検出・解決機能付き）
  async function saveToGitHub(data, expectedSha = null, retryCount = 0) {
    if (!githubConfig.accessToken) {
      // トークンがない場合はCSVエクスポートのオプションを提供（保存エラーにはしない）
      offerCsvExportWhenTokenUnavailable('missing');
      return false;
    }

    const maxRetries = 3;
    
    try {
      console.log(`saveToGitHub開始 (試行回数: ${retryCount + 1}/${maxRetries + 1})`);
      console.log('保存データサイズ:', JSON.stringify(data).length, 'bytes');
      console.log('期待するSHA:', expectedSha);
      
      // 現在のファイル情報を取得してSHAを確認
      let currentSha = null;
      try {
        console.log('現在のファイルのSHAを取得中...');
        const getResponse = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.filePath}`, {
          headers: {
            'Authorization': `Bearer ${githubConfig.accessToken}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (getResponse.ok) {
          const fileData = await getResponse.json();
          currentSha = fileData.sha;
          console.log('現在のSHA取得成功:', currentSha);
          
          // 期待するSHAと現在のSHAが異なる場合、競合が発生
          if (expectedSha && currentSha !== expectedSha) {
            console.log('競合検出: 期待するSHAと現在のSHAが異なります');
            console.log('期待するSHA:', expectedSha);
            console.log('現在のSHA:', currentSha);
            
            if (retryCount < maxRetries) {
              console.log('競合解決のため再試行します...');
              // 最新データを再取得してマージ処理を再実行
              return await handleConflictAndRetry(data, currentSha, retryCount);
            } else {
              throw new Error('最大再試行回数に達しました。手動で同期してください。');
            }
          }
        } else {
          console.log('SHA取得失敗:', getResponse.status, getResponse.statusText);
        }
      } catch (e) {
        console.log('ファイルが存在しないか、SHAの取得に失敗:', e);
      }

      // UTF-8文字列を正しくBase64エンコード
      console.log('データをBase64エンコード中...');
      
      // metadataを冒頭に配置するためにデータ構造を再構築
      const reorderedData = {
        metadata: data.metadata || {},
        events: data.events || {},
        eraSettings: data.eraSettings || [],
        genres: data.genres || []
      };
      
      const jsonString = JSON.stringify(reorderedData, null, 2);
      
      // 保存されるデータの削除フラグ付き項目をチェック
      let savedDeletedItems = [];
      for (const year of Object.keys(data.events || {})) {
        const items = data.events[year] || [];
        for (const item of items) {
          if (item.deleted === true) {
            savedDeletedItems.push({ year, label: item.label, deleted: item.deleted });
          }
        }
      }
      console.log('保存されるデータの削除フラグ付き項目:', savedDeletedItems);
      
      const bytes = new TextEncoder().encode(jsonString);
      
      // 大きな配列の場合は分割して処理
      let binaryString = '';
      const chunkSize = 8192; // 8KBずつ処理
      for (let i = 0; i < bytes.length; i += chunkSize) {
        const chunk = bytes.slice(i, i + chunkSize);
        binaryString += String.fromCharCode(...chunk);
      }
      
      const content = btoa(binaryString);
      console.log('Base64エンコード完了, サイズ:', content.length, 'bytes');
      
      const body = {
        message: `Update timeline data - ${new Date().toISOString()}`,
        content: content
      };

      // 現在のSHAを追加（競合検出のため）
      if (currentSha) {
        body.sha = currentSha;
        console.log('現在のSHAをリクエストボディに追加');
      }

      console.log('GitHub APIにPUTリクエスト送信中...');
      const response = await fetch(`https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.filePath}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${githubConfig.accessToken}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      console.log('GitHub APIレスポンス:', response.status, response.statusText);

      if (!response.ok) {
        const errorData = await response.json();
        console.error('GitHub APIエラー詳細:', errorData);
        
        // 認証失敗時はCSV導線へ（「保存エラー」にしない）
        if (response.status === 401 || response.status === 403) {
          console.warn('saveToGitHub: GitHub認証失敗', response.status);
          offerCsvExportWhenTokenUnavailable('invalid');
          return false;
        }

        // 409エラー（競合）の場合の特別処理
        if (response.status === 409) {
          console.log('409エラー: ファイルが他のユーザーによって更新されました');
          if (retryCount < maxRetries) {
            console.log('競合解決のため再試行します...');
            return await handleConflictAndRetry(data, null, retryCount);
          } else {
            throw new Error('他のユーザーが同時に編集しています。しばらく待ってから再度同期してください。');
          }
        }
        
        throw new Error(`HTTP ${response.status}: ${response.statusText} - ${errorData.message || ''}`);
      }

      console.log('saveToGitHub完了');
      return true;
    } catch (error) {
      console.error('saveToGitHubエラー詳細:', error);
      if (retryCount < maxRetries && error.message.includes('競合')) {
        console.log('競合エラーのため再試行します...');
        return await handleConflictAndRetry(data, null, retryCount);
      }
      showError('保存エラー', `GitHubへの保存に失敗しました: ${error.message}`);
      return false;
    }
  }
  
  // 競合発生時の再試行処理
  async function handleConflictAndRetry(originalData, newSha, retryCount) {
    console.log('競合解決処理開始');
    
    try {
      // 最新のリモートデータを再取得
      console.log('最新のリモートデータを再取得中...');
      const latestRemoteData = await loadFromGitHub();
      if (latestRemoteData === null) {
        throw new Error('最新データの取得に失敗しました');
      }
      
      // より詳細なマージ処理を実行
      const { merged: mergedAfterResolve, conflicts } = await performDetailedMerge(events, latestRemoteData);
      
      // 再試行（マージ済みデータのみ保存）
      // 正しいルート構造で保存（events 配下に格納）
      const dataToSave = { events: mergedAfterResolve };
      // メタデータを保存（GitHubから読み込んだmetadataを維持）
      if (!dataToSave.metadata) {
        dataToSave.metadata = {};
      }
      
      // GitHubから読み込んだmetadataをベースとして維持
      if (window.currentData && window.currentData.metadata) {
        // 既存のmetadataをコピー
        dataToSave.metadata = { ...window.currentData.metadata };

  // 詳細なマージ処理（真の競合のみ検出）
  async function performDetailedMerge(localData, remoteData) {
    console.log('詳細マージ処理開始');
    console.log('ローカルデータ:', localData);
    console.log('リモートデータ:', remoteData);
    
    const merged = { ...remoteData };
    const conflicts = []; // 真の競合のみを記録
    
    // 削除記録システムは削除（シンプルな同期ロジックに変更）
    
    // genres項目は詳細マージでは処理しない（上位で処理される）
    
    // 各年のデータを詳細にマージ
    const getGenreKey = (g)=> Array.isArray(g) ? g.slice().sort().join('・') : (g || '');
    const getYearVal = (it, fallbackYear) => (it && typeof it.startYear === 'number') ? it.startYear : fallbackYear;
    const makeKey = (it, fallbackYear) => createItemKey(it, fallbackYear);

    for (const [year, localItems] of Object.entries(localData)) {
      if (!merged[year]) {
        merged[year] = [];
      }
      
      const remoteItems = merged[year] || [];
      const localItemMap = new Map();
      const remoteItemMap = new Map();
      
      // ローカルアイテムをマップ化（年もキーに含め、ジャンルは正規化）
      localItems.forEach(item => {
        const key = makeKey(item, parseInt(year,10));
        localItemMap.set(key, item);
      });
      
      // リモートアイテムをマップ化
      remoteItems.forEach(item => {
        const key = makeKey(item, parseInt(year,10));
        remoteItemMap.set(key, item);
      });
      
      const mergedItems = [];
      const processedKeys = new Set();
      
      // ローカルアイテムを処理
      for (const [key, localItem] of localItemMap) {
        const remoteItem = remoteItemMap.get(key);
        
        if (remoteItem) {
          // 両方に存在する場合：ローカルの内容を採用（編集されたデータ）
          mergedItems.push(localItem);
        } else {
          // ローカルのみに存在する場合（新規 or 旧レコードのdeleted）
          mergedItems.push(localItem);
        }
        processedKeys.add(key);
      }
      
      // リモートのみに存在するアイテムを追加
      for (const [key, remoteItem] of remoteItemMap) {
        if (!processedKeys.has(key)) {
          mergedItems.push(remoteItem);
        }
      }
      
      merged[year] = mergedItems;
    }
    
    console.log('詳細マージ処理完了:', merged);
    return { merged, conflicts };
  }
  
  // 真の競合をチェック（他のユーザーによる変更のみ）
  function checkRealConflict(localItem, remoteItem) {
    const fields = ['label', 'label_en', 'genre', 'imp', 'url', 'url_en', 'note', 'note_en', 'timeLabel', 'startYear', 'endYear'];
    const conflictFields = [];
    
    for (const field of fields) {
      const localValue = localItem[field] || '';
      const remoteValue = remoteItem[field] || '';
      
      // 注釈フィールドの特別処理
      if (field === 'note') {
        if (isRealNoteConflict(localValue, remoteValue)) {
          console.log(`真の競合検出: ${field} フィールドが異なります`);
          console.log(`ローカル: "${localValue}"`);
          console.log(`リモート: "${remoteValue}"`);
          conflictFields.push({
            field: field,
            localValue: localValue,
            remoteValue: remoteValue
          });
        }
      } else {
        // その他のフィールドは従来通り
        // ただし、空文字列とundefinedの違いは競合としない
        let localNormalized = localValue === '' ? undefined : localValue;
        let remoteNormalized = remoteValue === '' ? undefined : remoteValue;
        if (field === 'genre') {
          localNormalized = Array.isArray(localValue) ? localValue.slice().sort().join('・') : (localValue || undefined);
          remoteNormalized = Array.isArray(remoteValue) ? remoteValue.slice().sort().join('・') : (remoteValue || undefined);
        }
        
        if (localNormalized !== remoteNormalized) {
          console.log(`真の競合検出: ${field} フィールドが異なります`);
          console.log(`ローカル: "${localValue}"`);
          console.log(`リモート: "${remoteValue}"`);
          conflictFields.push({
            field: field,
            localValue: localValue,
            remoteValue: remoteValue
          });
        }
      }
    }
    
    return {
      hasConflict: conflictFields.length > 0,
      conflictFields: conflictFields
    };
  }
  
  // 真の注釈競合をチェック（追記による変更は競合としない）
  function isRealNoteConflict(localNote, remoteNote) {
    if (!localNote && !remoteNote) return false;
    if (!localNote && remoteNote) return false; // ローカルに注釈がなく、リモートにある場合は競合ではない
    if (localNote && !remoteNote) return false; // ローカルに注釈があり、リモートにない場合は競合ではない
    if (localNote === remoteNote) return false;
    
    // リモートの注釈を解析
    const remoteLines = remoteNote.split('\n');
    const hasAppendMarker = remoteLines.some(line => line.trim().startsWith('[追記]'));
    
    if (hasAppendMarker) {
      // 追記マーカーがある場合、元の内容と追記内容を分離
      const originalContent = remoteLines[0].trim();
      const appendLines = remoteLines.slice(1).map(line => {
        return line.trim().replace(/^\[追記\]\s*/, '');
      }).filter(line => line.length > 0);
      
      const localTrimmed = localNote.trim();
      
      // ローカルの内容が元の内容と同じ場合は競合としない
      if (originalContent === localTrimmed) {
        return false;
      }
      
      // ローカルの内容が追記内容に含まれている場合は競合としない
      const isInAppendLines = appendLines.some(appendLine => {
        return appendLine === localTrimmed;
      });
      
      if (isInAppendLines) {
        return false;
      }
    } else {
      // 追記マーカーがない場合、単純な重複チェック
      const localTrimmed = localNote.trim();
      const remoteTrimmed = remoteNote.trim();
      
      if (localTrimmed === remoteTrimmed) {
        return false;
      }
    }
    
    return true;
  }
  
  // 注釈の競合をチェック（追記済みの場合は競合としない）
  function isNoteConflict(localNote, remoteNote) {
    if (!localNote && !remoteNote) return false;
    if (!localNote || !remoteNote) return true;
    if (localNote === remoteNote) return false;
    
    // ローカルの注釈がリモートの注釈に既に含まれているかチェック
    const localTrimmed = localNote.trim();
    const remoteLines = remoteNote.split('\n');
    
    // リモートの各行から[追記]プレフィックスを除去して比較
    const remoteContentLines = remoteLines.map(line => {
      return line.trim().replace(/^\[追記\]\s*/, '');
    });
    
    // ローカルの内容がリモートに既に含まれている場合は競合としない
    const isAlreadyIncluded = remoteContentLines.some(remoteContent => {
      return remoteContent === localTrimmed;
    });
    
    if (isAlreadyIncluded) {
      console.log('ローカルの注釈は既にリモートに含まれているため競合としない:', localNote);
      return false;
    }
    
    return true;
  }
  
  // 競合を自動解決
  function resolveConflict(localItem, remoteItem, conflictInfo) {
    console.log('競合自動解決開始:', localItem.label);
    
    // 基本構造はリモートをベースにする
    const resolved = { ...remoteItem };
    
    // URLはローカル変更を優先（空 → 値 の上書き含む）
    const urlConflict = conflictInfo.conflictFields.find(cf => cf.field === 'url');
    if (urlConflict) {
      const localUrl = urlConflict.localValue || '';
      const remoteUrl = urlConflict.remoteValue || '';
      if (localUrl && localUrl !== remoteUrl) {
        resolved.url = localUrl;
        console.log('URLをローカル値で上書き:', resolved.url);
      }
    }
    const urlEnConflict = conflictInfo.conflictFields.find(cf => cf.field === 'url_en');
    if (urlEnConflict) {
      const localUrlEn = urlEnConflict.localValue || '';
      const remoteUrlEn = urlEnConflict.remoteValue || '';
      if (localUrlEn && localUrlEn !== remoteUrlEn) {
        resolved.url_en = localUrlEn;
        console.log('URL(English)をローカル値で上書き:', resolved.url_en);
      }
    }
    
    // 注釈は追記マージ（重複を避ける）
    const noteConflict = conflictInfo.conflictFields.find(cf => cf.field === 'note');
    if (noteConflict) {
      const localNote = noteConflict.localValue;
      const remoteNote = noteConflict.remoteValue;
      
      if (localNote && remoteNote && localNote !== remoteNote) {
        // 両方に注釈がある場合：重複チェックして追記
        resolved.note = appendNoteSafely(remoteNote, localNote);
        console.log('注釈を安全に追記:', resolved.note);
      } else if (localNote && !remoteNote) {
        // ローカルのみに注釈がある場合は追加
        resolved.note = localNote;
        console.log('注釈を追加:', resolved.note);
      }
      // リモートのみに注釈がある場合はそのまま保持
    }

    // 注釈(English)の追記マージ（日本語と同様の方針）
    const noteEnConflict = conflictInfo.conflictFields.find(cf => cf.field === 'note_en');
    if (noteEnConflict) {
      const localNoteEn = noteEnConflict.localValue;
      const remoteNoteEn = noteEnConflict.remoteValue;
      if (localNoteEn && remoteNoteEn && localNoteEn !== remoteNoteEn) {
        resolved.note_en = appendNoteSafely(remoteNoteEn, localNoteEn);
        console.log('注釈(English)を安全に追記:', resolved.note_en);
      } else if (localNoteEn && !remoteNoteEn) {
        resolved.note_en = localNoteEn;
        console.log('注釈(English)を追加:', resolved.note_en);
      }
    }
    
    console.log('競合解決完了:', resolved);
    return resolved;
  }
  
  // 注釈を安全に追記（重複を避ける）
  function appendNoteSafely(existingNote, newNote) {
    if (!existingNote) return newNote;
    if (!newNote) return existingNote;
    
    // 既存の注釈を解析
    const existingLines = existingNote.split('\n');
    const hasAppendMarker = existingLines.some(line => line.trim().startsWith('[追記]'));
    
    // 新しい注釈が既に存在するかチェック
    const newNoteTrimmed = newNote.trim();
    
    if (hasAppendMarker) {
      // 追記マーカーがある場合、元の内容と追記内容を分離してチェック
      const originalContent = existingLines[0].trim();
      const appendLines = existingLines.slice(1).map(line => {
        return line.trim().replace(/^\[追記\]\s*/, '');
      }).filter(line => line.length > 0);
      
      // 元の内容と同じかチェック
      if (originalContent === newNoteTrimmed) {
        console.log('新しい注釈が元の内容と同じため追記をスキップ:', newNote);
        return existingNote;
      }
      
      // 追記内容に含まれているかチェック
      const alreadyInAppend = appendLines.some(appendLine => {
        return appendLine === newNoteTrimmed;
      });
      
      if (alreadyInAppend) {
        console.log('新しい注釈が追記内容に既に存在するため追記をスキップ:', newNote);
        return existingNote;
      }
    } else {
      // 追記マーカーがない場合、単純な重複チェック
      const existingTrimmed = existingNote.trim();
      if (existingTrimmed === newNoteTrimmed) {
        console.log('新しい注釈が既存の内容と同じため追記をスキップ:', newNote);
        return existingNote;
      }
    }
    
    // 新しい注釈を追記
    return `${existingNote}\n[追記] ${newNote}`;
  }

      const remoteTimestampMs = timestamp ? new Date(timestamp).getTime() : null;
      const remoteIsNewer = remoteTimestampMs && dataFreshnessTimestamp && remoteTimestampMs > dataFreshnessTimestamp;
      console.log('事前チェックでリモートが新しいか:', precheckRemoteNewer, '実際のリモート新しさ:', remoteIsNewer);
      
      let merged = null;
      let conflicts = [];
      
      if (remoteIsNewer) {
        console.log('リモートが新しいため再読込データをベースにローカル編集のみ上書きします');
        try {
          merged = reconcileRemoteNewerEvents({ ...remoteData });
        } catch (e) {
          console.error('リモート新規データとの競合:', e);
          if (e instanceof ConflictError) {
            showError('同期エラー', '他のユーザーによる編集と競合しました。最新データを読み込んで確認してください。');
            showConflictNotification(e.conflicts || []);
            return;
          }
          showError('同期エラー', e.message || '他のユーザーの更新と競合しました。');
          return;
        }
        conflicts = [];
        // リモート順序を採用しつつローカル編集のみ上書き済みなので orderChanged はリセット
        setOrderChanged(false);
      } else {
        // 3. 要注意モードかどうかを判定
        const cautionMode = isCautionMode(timestamp);
        console.log('同期モード:', cautionMode ? '要注意モード' : '通常モード');

        // 参照年表データを除外してメインデータのみを同期対象とする
        const localData = {};
        for (const [year, items] of Object.entries(events)) {
          if (!Array.isArray(items)) continue;
          const mainItems = items.filter(item => !item || item._source !== 'ref');
          // 空でない配列のみを保持
          if (mainItems.length > 0) {
            localData[year] = mainItems;
          }
        }
        let mergeResult;
        
        if (getOrderChanged()) {
          // 順序変更がある場合は、ローカルの順序を強制反映してフラグをオフ
          console.log('順序変更が検出されたため、ローカルの順序を強制反映');
          setOrderChanged(false); // フラグをオフ
          mergeResult = { merged: localData, conflicts: [] };
        } else if (cautionMode) {
          // 要注意モードでの同期処理
          mergeResult = performCautionModeSync(localData, remoteData);
        } else {
          // 通常モードでの同期処理
          mergeResult = performNormalModeSync(localData, remoteData);
        }
        
        merged = mergeResult.merged;
        conflicts = mergeResult.conflicts;
      }

      // マージ後データの削除フラグ付き項目をチェック
      let mergedDeletedItems = [];
      for (const year of Object.keys(merged)) {
        const items = merged[year] || [];
        for (const item of items) {
          if (item.deleted === true) {
            mergedDeletedItems.push({ year, label: item.label, deleted: item.deleted });
          }
        }
      }
      
      console.log('同期完了 - マージ後データ:', merged);
      console.log('同期完了 - マージ後削除フラグ付き項目:', mergedDeletedItems);
      console.log('同期完了 - 競合情報:', conflicts);
      console.log('マージ後データサイズ:', JSON.stringify(merged).length, 'bytes');

      // 3. eraSettingsのマージ処理（要件準拠）
      console.log('eraSettings同期前:', { 
        local: eraSettings, 
        localLength: eraSettings ? eraSettings.length : 0,
        windowEraSettings: window.eraSettings,
        windowLength: window.eraSettings ? window.eraSettings.length : 0,
        remote: remoteEraSettings, 
        remoteLength: remoteEraSettings.length 
      });
      
      // 仕様:
      // ・ローカルにある時代区分名がリモートにあれば、リモートのその時代区分をローカルで上書き
      // ・ローカルにあるがリモートにない時代区分は何もしない（ローカル保持、リモートに保存しない）
      // ・ローカルにない時代区分でリモートにあるものはローカルへ取り込み
      const localBase = (window.eraSettings && window.eraSettings.length > 0) ? window.eraSettings : (eraSettings || []);
      const remoteBase = remoteEraSettings || [];
      const nameToRemote = new Map(remoteBase.map(e => [String(e.name||''), e]));
      const nameToLocal  = new Map(localBase.map(e => [String(e.name||''), e]));
      const mergedEraSettings = [];
      const toSaveEraSettings = []; // リモートに保存する時代区分（ローカルにないリモート分のみ）
      const seen = new Set();
      // ローカル基準に反映（上書き or そのまま）
      for (const loc of localBase){
        const key = String(loc.name||'');
        if (!key){ continue; }
        if (nameToRemote.has(key)){
          // 同名があれば、リモートの項目をローカルの値で上書き（ローカル優先）
          const remoteEra = nameToRemote.get(key);
          const mergedEra = { ...remoteEra, ...loc };
          mergedEraSettings.push(mergedEra);
          toSaveEraSettings.push(mergedEra); // リモートに保存
        } else {
          // リモートに無い時代区分はそのまま保持
          mergedEraSettings.push(loc);
          // リモートに保存しない（ローカルのみ保持）
        }
        seen.add(key);
      }
      // ローカルにないがリモートにある分を追加
      for (const rem of remoteBase){
        const key = String(rem.name||'');
        if (!key || seen.has(key)) continue;
        mergedEraSettings.push(rem);
        toSaveEraSettings.push(rem); // リモートに保存
      }
      console.log('eraSettings同期後:', { 
        merged: mergedEraSettings, 
        mergedLength: mergedEraSettings.length 
      });

      // 4. マージしたデータを保存（期待するSHAを指定）
      console.log('GitHubにデータを保存中...');
      const dataToSave = {
        events: merged,
        eraSettings: toSaveEraSettings // リモートに保存するのは同名上書き分と新規取り込み分のみ
      };
      // メタデータを保存（GitHubから読み込んだmetadataを維持）
      if (!dataToSave.metadata) {
        dataToSave.metadata = {};
      }
      
      // GitHubから読み込んだmetadataをベースとして維持
      if (window.currentData && window.currentData.metadata) {
        // 既存のmetadataをコピー
        dataToSave.metadata = { ...window.currentData.metadata };
        console.log('GitHubから読み込んだmetadataを維持:', dataToSave.metadata);
      }
      
      // タイトル情報（変更があった場合のみ更新）
      if (appTitle && appTitle !== 'Xnative timeline') {
        if (!dataToSave.metadata.title) {
          dataToSave.metadata.title = {};
        }
        // 既存のタイトルと異なる場合のみ更新
        if (dataToSave.metadata.title.ja !== appTitle) {
          dataToSave.metadata.title.ja = appTitle;
          console.log('タイトルを更新:', appTitle);
        }
      }
      if (appTitleEn) {
        if (!dataToSave.metadata.title) {
          dataToSave.metadata.title = {};
        }
        // 既存の英語タイトルと異なる場合のみ更新
        if (dataToSave.metadata.title.en !== appTitleEn) {
          dataToSave.metadata.title.en = appTitleEn;
          console.log('英語タイトルを更新:', appTitleEn);
        }
      }
      // genres を必ず保存（GitHub上のジャンル情報をクリアしてローカルのジャンル情報を反映）
      // ロードしたジャンル情報がある場合はそれを優先
      let genresToSave = null;
      if (window.loadedGenres && window.loadedGenres.length > 0) {
        genresToSave = window.loadedGenres;
        console.log('ロードしたジャンル情報を反映します:', genresToSave);
      } else {
        const currentGenres = getCurrentGenresDefinition();
        if (currentGenres && currentGenres.length>0) {
          genresToSave = currentGenres;
          console.log('ジャンル情報をローカル定義で上書き保存します');
        } else {
          // ローカルにジャンル情報がない場合は空配列でクリア
          genresToSave = [];
          console.log('ローカルにジャンル情報がないため、GitHub上のジャンル情報をクリアします');
        }
      }
      
      // 削除されたジャンルを除外
      if (window.deletedGenres && window.deletedGenres.size > 0) {
        const deletedCodes = Array.from(window.deletedGenres);
        genresToSave = genresToSave.filter(g => !deletedCodes.includes(g.code));
        console.log('削除されたジャンルを除外します:', deletedCodes);
        console.log('削除後のジャンル情報:', genresToSave);
      }
      
      dataToSave.genres = genresToSave;
      console.log('保存するデータ構造:', {
        hasEvents: !!dataToSave.events,
        eventsKeys: Object.keys(dataToSave.events || {}),
        hasEraSettings: !!dataToSave.eraSettings,
        eraSettingsLength: dataToSave.eraSettings.length,
        eraSettingsContent: dataToSave.eraSettings,
        hasGenres: !!dataToSave.genres,
        genresContent: dataToSave.genres
      });
      const success = await saveToGitHub(dataToSave, remoteSha);
      if (success) {
        events = merged;
        
        // eraSettingsを確実にローカルに反映
        eraSettings = mergedEraSettings;
        window.eraSettings = mergedEraSettings;
        
        console.log('同期完了後のeraSettings:', eraSettings);
        console.log('同期完了後のwindow.eraSettings:', window.eraSettings);
        
        saveEvents();
        console.log('saveEvents後のeraSettings確認:', eraSettings);
        
        // 参照年表データを再読み込み
        try {
          await loadReferenceTimelinesAndMerge();
        } catch (e) {
          console.warn('同期後の参照年表再読み込みに失敗:', e);
        }
        
        renderEvents();
        renderEraBackgrounds();
        
        // ジャンルが更新された可能性があるためフィルタ選択をリセット（conjunction: trueは除外）
        if (window.selectedGenres) { selectedGenres = new Set(GENRES.filter(genre => !GENRE_CONJUNCTIONS[genre])); }
        if (typeof updateGenreFilterButtonText === 'function') { updateGenreFilterButtonText(); }
        
        // 同期完了時刻を記録
        const syncTime = new Date().toISOString();
        lsSetScoped(STORAGE_KEYS.lastSync, syncTime);
        lsRemoveScoped(STORAGE_KEYS.lastEdit); // 同期完了後はlastEditをクリア
        
        // 自動保存の基準を更新（メインデータのみ）
        const mainEvents = {};
        for (const [year, items] of Object.entries(events)) {
          if (!Array.isArray(items)) continue;
          const mainItems = items.filter(item => !item || item._source !== 'ref');
          if (mainItems.length > 0) {
            mainEvents[year] = mainItems;
          }
        }
        lastSavedEventsData = JSON.stringify(mainEvents);
        // 同期ベースラインも更新
        lastSyncedEventsData = lastSavedEventsData;
        try { lsSetScoped(STORAGE_KEYS.lastSyncedEventsData, lastSyncedEventsData); } catch(_e){}
        updateSyncStatus();
        
        // 削除記録は永続的に保持（tombstoneとして機能）
        
        // データ鮮度時刻を更新（保存後のコミット時刻を再取得して反映）
        try {
          const freshTs = await getGitHubFileTimestamp();
          if (freshTs) {
            setDataFreshnessTimestamp(freshTs);
          }
        } catch (e) {
          console.warn('保存後のdataFreshnessTimestamp更新に失敗:', e);
          // 取得に失敗した場合は直前のtimestampを使用（後方互換）
          if (timestamp) {
            setDataFreshnessTimestamp(new Date(timestamp).getTime());
          }
        }

        // 保存直後のリモート差分検証（他ユーザーの直後更新を検知）
        try {
          const verify = await loadFromGitHubWithSha({ offerCsvFallback: false });
          if (verify && verify.remoteData) {
            const savedPayload = {
              events: dataToSave.events || {},
              eraSettings: dataToSave.eraSettings || [],
              genres: dataToSave.genres || []
            };
            const remotePayload = {
              events: verify.remoteData || {},
              eraSettings: verify.remoteEraSettings || [],
              genres: verify.remoteGenres || []
            };
            const sameAfterSave = deepEqualNormalized(savedPayload, remotePayload);
            if (!sameAfterSave) {
              // 最新リモートをローカルに反映し直し、再同期を促す
              try {
                if (verify.remoteData) {
                  events = verify.remoteData;
                  saveEvents();
                  // 基準も更新
                  const mainEventsAfter = {};
                  for (const [year, items] of Object.entries(events)) {
                    if (!Array.isArray(items)) continue;
                    const mainItems = items.filter(it => !it || it._source !== 'ref');
                    if (mainItems.length > 0) mainEventsAfter[year] = mainItems;
                  }
                  lastSavedEventsData = JSON.stringify(mainEventsAfter);
                  lastSyncedEventsData = lastSavedEventsData;
                  try { lsSetScoped(STORAGE_KEYS.lastSyncedEventsData, lastSyncedEventsData); } catch(_e){}
                }
                if (verify.remoteEraSettings) {
                  eraSettings = verify.remoteEraSettings;
                  window.eraSettings = verify.remoteEraSettings;
                }
                if (verify.remoteGenres) {
                  setGenresFromRemote(verify.remoteGenres);
                }
                if (typeof renderEvents === 'function') { renderEvents(); }
                if (typeof renderEraBackgrounds === 'function') { renderEraBackgrounds(); }
                if (typeof updateGenreFilterButtonText === 'function') { updateGenreFilterButtonText(); }
                if (verify.timestamp) {
                  setDataFreshnessTimestamp(new Date(verify.timestamp).getTime());
                }
              } catch(_e){}
              showError(
                '検証警告',
                '保存直後にリモートが更新された可能性があります。最新データを読み込みましたので、必要に応じて再度編集・同期してください。'
              );
            }
          }
        } catch (e) {
          console.warn('保存直後検証でエラー:', e);
        }
        
        // ラベルバックアップは保持（編集された項目の古いバージョンを除外するために必要）
        // clearLabelBackups();
        
        // 同期完了後はlastEditをクリア（競合の有無に関係なく）
        lsRemoveScoped(STORAGE_KEYS.lastEdit);
        
          // 競合があった場合は競合通知を表示、なければ通常の完了メッセージを表示
          if (conflicts.length > 0) {
            showConflictNotification(conflicts);
          } else {
            showSyncCompleteOnce();
          }
        console.log('同期処理完了');
      } else {
        console.log('GitHubへの保存に失敗');
      }
    } catch (error) {
      console.error('同期エラーの詳細:', error);
      
      // 競合エラーの場合は詳細な競合情報を表示
      if (error instanceof ConflictError) {
        showConflictNotification(error.conflicts);
        return;
      }
      
      showError('同期エラー', `同期処理でエラーが発生しました: ${error.message}`);
    }
  }

  // ローカルデータモード: JSONとして保存（ダウンロード）
  async function syncToLocal() {
    try {
      // 保存データ構造をGitHub保存時と同等に整形
      const mainEvents = {};
      for (const [year, items] of Object.entries(events)) {
        if (!Array.isArray(items)) continue;
        const mainItems = items.filter(item => !item || item._source !== 'ref');
        if (mainItems.length > 0) { mainEvents[year] = mainItems; }
      }

      const dataToSave = {
        events: mainEvents,
        eraSettings: Array.isArray(eraSettings) ? eraSettings : [],
        genres: getCurrentGenresDefinition() || [],
        metadata: (window.currentData && window.currentData.metadata) ? { ...window.currentData.metadata } : {}
      };
      if (appTitle) {
        if (!dataToSave.metadata.title) dataToSave.metadata.title = {};
        dataToSave.metadata.title.ja = appTitle;
      }
      if (appTitleEn) {
        if (!dataToSave.metadata.title) dataToSave.metadata.title = {};
        dataToSave.metadata.title.en = appTitleEn;
      }

      const jsonText = JSON.stringify(dataToSave, null, 2);
      const fname = githubConfig.localFileName || 'timeline_local.json';
      const canUseFsApi =
        typeof window !== 'undefined' &&
        typeof window.showSaveFilePicker === 'function' &&
        typeof window.FileSystemFileHandle !== 'undefined';

      if (canUseFsApi) {
        let handle = localJsonFileHandle;
        if (handle) {
          try {
            const perm = await handle.queryPermission({ mode: 'readwrite' });
            if (perm !== 'granted') {
              const req = await handle.requestPermission({ mode: 'readwrite' });
              if (req !== 'granted') handle = null;
            }
          } catch (_e) {
            handle = null;
          }
        }
        if (!handle) {
          handle = await window.showSaveFilePicker({
            suggestedName: fname,
            types: [{
              description: 'JSON Files',
              accept: { 'application/json': ['.json'] }
            }]
          });
        }
        const writable = await handle.createWritable();
        await writable.write(jsonText);
        await writable.close();
        localJsonFileHandle = handle;
        if (handle && handle.name) setActiveLocalFileName(handle.name);
      } else {
        // File System Access API が使えない環境は従来どおりダウンロード保存
        const blob = new Blob([jsonText], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fname;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        setActiveLocalFileName(fname);
      }

      // 同期状態更新
      lsSetScoped(STORAGE_KEYS.lastSync, new Date().toISOString());
      lsRemoveScoped(STORAGE_KEYS.lastEdit);
      updateSyncStatus();
      showInfo('保存完了', 'ローカルJSONとして保存しました。');
      return true;
    } catch (error) {
      if (error && error.name === 'AbortError') {
        showInfo('保存キャンセル', currentLang === 'ja' ? 'ローカルJSONの保存をキャンセルしました。' : 'Local JSON save was cancelled.');
        return false;
      }
      showError('保存エラー', `ローカルJSONの保存に失敗しました: ${error.message}`);
      return false;
    }
  }
  
  // トークン未設定/不正時の空結果（呼び出し側で「保存エラー」にしないためのフラグ付き）

    return {
      remoteData: null,
      remoteSha: null,
      remoteEraSettings: [],
      remoteGenres: null,
      remoteMetadata: {},

  // トークン未設定・不正時にCSVエクスポートを案内する（キャンセル時は何もしない）
  function offerCsvExportWhenTokenUnavailable(reason = 'missing') {
    const hasData = Object.keys(events).length > 0;
    const isInvalid = reason === 'invalid';
    if (!hasData) {
      showError(
        '設定エラー',
        isInvalid
          ? (currentLang === 'ja'
            ? 'GitHubアクセストークンが無効か、権限がありません。設定を確認してください。'
            : 'GitHub access token is invalid or lacks permission. Please check settings.')
          : (currentLang === 'ja'
            ? 'GitHubアクセストークンが設定されていません。GitHubでログインしてください。'
            : 'GitHub access token is not configured. Please sign in with GitHub.')
      );
      return { handled: true, exported: false, cancelled: false };
    }
    const message = isInvalid
      ? (currentLang === 'ja'
        ? 'GitHubアクセストークンが無効か、権限がありません。\n\n変更された項目のみをCSVファイルとしてエクスポートして、管理者に送信しますか？\n\n「OK」: CSVファイルをダウンロード\n「キャンセル」: 何もしない'
        : 'GitHub access token is invalid or lacks permission.\n\nExport only changed items as CSV and send to the administrator?\n\n"OK": Download CSV\n"Cancel": Do nothing')
      : (currentLang === 'ja'
        ? 'GitHubアクセストークンが設定されていません。\n\n変更された項目のみをCSVファイルとしてエクスポートして、管理者に送信しますか？\n\n「OK」: CSVファイルをダウンロード\n「キャンセル」: 何もしない'
        : 'GitHub access token is not configured.\n\nExport only changed items as CSV and send to the administrator?\n\n"OK": Download CSV\n"Cancel": Do nothing');
    const result = confirm(message);
    if (result) {
      exportToCSV();
      try {
        lsSetScoped(STORAGE_KEYS.lastSync, new Date().toISOString());
        lsRemoveScoped(STORAGE_KEYS.lastEdit);
        updateSyncStatus();
      } catch (_e) {}
      return { handled: true, exported: true, cancelled: false };
    }
    return { handled: true, exported: false, cancelled: true };
  }

  // GitHubからデータとSHAハッシュを同時に取得
  // offerCsvFallback: トークン未設定/不正時にCSV案内を出すか（再読込・検証時は false）
  async function loadFromGitHubWithSha({ offerCsvFallback = true } = {}) {
    if (!githubConfig.accessToken) {
      // トークンがない場合はCSVエクスポートのオプションを提供（保存エラーにはしない）
      console.log('アクセストークンなし: CSVエクスポート案内');
      if (offerCsvFallback) {
        const action = offerCsvExportWhenTokenUnavailable('missing');
        return createEmptyGitHubLoadResult({
          skipped: true,
          skipReason: 'no_token',
          csvExported: action.exported,
          cancelled: action.cancelled
        });
      }
      return createEmptyGitHubLoadResult({ skipped: true, skipReason: 'no_token' });
    }

    try {
      const apiUrl = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.filePath}`;
      console.log('GitHub API URL:', apiUrl);
      console.log('Access token length:', githubConfig.accessToken ? githubConfig.accessToken.length : 0);
      
      const response = await fetch(apiUrl, {
        headers: {
          'Authorization': `Bearer ${githubConfig.accessToken}`,
          'Accept': 'application/vnd.github.v3+json'
        }
      });

      console.log('GitHub API response status:', response.status);
      console.log('GitHub API response ok:', response.ok);

      if (!response.ok) {
        if (response.status === 404) {
          console.log('ファイルが存在しません (404)');
          // ファイルが存在しない場合は空のデータを返す
          return { remoteData: {}, remoteSha: null, remoteEraSettings: [], remoteGenres: null, remoteMetadata: {}, timestamp: null };
        }
        // 認証失敗時はCSV導線へ（「保存エラー」にしない）
        if (response.status === 401 || response.status === 403) {
          console.warn('GitHub認証失敗:', response.status);
          if (offerCsvFallback) {
            const action = offerCsvExportWhenTokenUnavailable('invalid');
            return createEmptyGitHubLoadResult({
              skipped: true,
              skipReason: 'auth_failed',
              csvExported: action.exported,
              cancelled: action.cancelled
            });
          }
          return createEmptyGitHubLoadResult({ skipped: true, skipReason: 'auth_failed' });
        }
        const errorText = await response.text();
        console.error('GitHub API error response:', errorText);
        throw new Error(`HTTP ${response.status}: ${response.statusText} - ${errorText}`);
      }

      const responseData = await response.json();
      console.log('GitHub API response data keys:', Object.keys(responseData));
      console.log('GitHub API response data content length:', responseData.content ? responseData.content.length : 0);
      
      const sha = responseData.sha;
      
      // GitHub APIのBase64データを正しくデコード
      let content;
      let data;
      
      if (!responseData.content || responseData.content.length === 0) {
        console.log('GitHub API content is empty, trying download_url...');
        if (!responseData.download_url) {
          throw new Error('GitHub API response missing both content and download_url');
        }
        
        // download_urlを使用してファイルを直接ダウンロード
        console.log('Downloading from URL:', responseData.download_url);
        const downloadResponse = await fetch(responseData.download_url);
        if (!downloadResponse.ok) {
          throw new Error(`Download failed: ${downloadResponse.status} ${downloadResponse.statusText}`);
        }
        const dlBytes = new Uint8Array(await downloadResponse.arrayBuffer());
        content = new TextDecoder('utf-8').decode(dlBytes);
        console.log('Downloaded content length:', content.length);
        console.log('Downloaded content preview:', content.substring(0, 200));
      } else {
        const binaryString = atob(responseData.content);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        content = new TextDecoder('utf-8').decode(bytes);
        console.log('Decoded content length:', content.length);
        console.log('Decoded content preview:', content.substring(0, 200));
      }
      
      try {
        data = JSON.parse(content);
      } catch (parseError) {
        console.error('JSON parse error:', parseError);
        console.error('Content that failed to parse:', content.substring(0, 500));
        throw new Error(`JSON parse error: ${parseError.message}`);
      }
      
      // タイムスタンプを取得
      const timestamp = responseData.last_modified || new Date().toISOString();
      
      // ジャンルデータを更新
      if (data.genres) {
        setGenresFromRemote(data.genres);
        console.log('GitHubからジャンルデータを更新:', GENRES, GENRE_LABELS);
      } else {
        console.warn('GitHub JSONにジャンルデータが含まれていません。空のジャンル状態で続行します。');
      }
      
      // メタデータ情報を処理
      if (data.metadata) {
        // タイトル情報を更新
        if (data.metadata.title) {
          if (data.metadata.title.ja) {
            appTitle = data.metadata.title.ja;
            console.log('GitHubからタイトルを読み込み:', appTitle);
          }
          if (data.metadata.title.en) {
            appTitleEn = data.metadata.title.en;
            console.log('GitHubから英語タイトルを読み込み:', appTitleEn);
          }
          if (typeof updateCustomTitleDisplay === 'function') {
            updateCustomTitleDisplay();
          }
        }
        
        // 説明情報を更新（グローバル変数に保存）
        if (data.metadata.description) {
          console.log('GitHubから説明を読み込み:', data.metadata.description);
          // 説明情報をグローバル変数に保存（後でヘルプ画面で表示するため）
          if (!window.appMetadata) window.appMetadata = {};
          window.appMetadata.description = data.metadata.description;
        }
        if (data.metadata.initialCreator) {
          console.log('GitHubから初期作成者を読み込み:', data.metadata.initialCreator);
          if (!window.appMetadata) window.appMetadata = {};
          window.appMetadata.initialCreator = data.metadata.initialCreator;
        }
        if (data.metadata.contributors) {
          console.log('GitHubから貢献者を読み込み:', data.metadata.contributors);
          if (!window.appMetadata) window.appMetadata = {};
          window.appMetadata.contributors = data.metadata.contributors;
        }
        
        // 現在のデータをグローバル変数に保存（メタデータ表示用）
        // 既存のメタデータ情報を保持するためにマージ
        if (window.currentData && window.currentData.metadata) {
          // 既存のメタデータ情報を保持
          const existingMetadata = window.currentData.metadata;
          if (data.metadata) {
            // GitHubから読み込んだメタデータと既存のメタデータをマージ
            data.metadata = { ...data.metadata, ...existingMetadata };
          } else {
            data.metadata = existingMetadata;
          }
          console.log('メタデータ情報をマージ:', data.metadata);
        }
        window.currentData = data;
        scheduleEmbedBlockCacheRefresh(data, (githubConfig && githubConfig.filePath) || null);
      }
      
      if (data.events) {
        // 新しい形式（events + eraSettings + genres）
        console.log('loadFromGitHubWithSha: 完全なデータ構造を返します');
        console.log('loadFromGitHubWithSha: data.genres =', data.genres);
        console.log('loadFromGitHubWithSha: data.eraSettings =', data.eraSettings);
        return { 
          remoteData: data.events, 
          remoteSha: sha, 
          remoteEraSettings: data.eraSettings || [],
          remoteGenres: data.genres || null, // genres項目を追加
          remoteMetadata: data.metadata || {},
          timestamp: timestamp
        };
      } else {
        // 古い形式（eventsのみ）
        console.warn('GitHub JSONが古い形式です。空のevents状態で続行します。');
        return { remoteData: null, remoteSha: null, remoteEraSettings: [], remoteGenres: null, remoteMetadata: {}, timestamp: null };
      }
    } catch (error) {
      showError('読み込みエラー', `GitHubからの読み込みに失敗しました: ${error.message}`);

  function removeRefTimelineInput(button) {

    if (item) { item.remove(); }

  // 参照年表行の種類切り替え（GitHub / Sheets）
  function toggleRefTimelineType(sel){
    const item = sel.closest('.ref-timeline-item');
    if (!item) return;
    const gh = item.querySelector('.rt-gh');
    const sh = item.querySelector('.rt-sheet');
    const val = sel.value;
    if (gh) gh.style.display = (val === 'github') ? 'grid' : 'none';
    if (sh) sh.style.display = (val === 'sheet')  ? 'grid' : 'none';
    // 入力可否を切り替え
    const setDisabled = (root, disabled) => {
      if (!root) return;
      const nodes = root.querySelectorAll('input, select, textarea, button');
      nodes.forEach(n => {
        if (n.classList.contains('rt-type') || n.classList.contains('rt-imp')) return;
        if (disabled) {
          n.disabled = true;
          n.setAttribute('disabled', '');
        } else {
          n.disabled = false;
          n.removeAttribute('disabled');
        }
      });
    };
    setDisabled(gh, val !== 'github');
    setDisabled(sh, val !== 'sheet');
  }

    const item = radio.closest('.ref-timeline-item');

    // ダミーselect風オブジェクトを作って既存関数を流用
    toggleRefTimelineType({ value, closest: () => item });
  }

          document.querySelectorAll('.urlPreviewPanel').forEach(function(panel) {
            // urlPreviewElとurlPreviewHoverPanelsに含まれていない固定パネルを探す
            if (panel !== urlPreviewEl && !urlPreviewHoverPanels.has(panel) && panel.panelData) {
              panels.push({
                isMain: false,

                }

          });
          return panels;
        })()
      };
      
      const jsonString = JSON.stringify(snapshot, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      const filePathRaw = String((githubConfig && githubConfig.filePath) || 'timeline').trim();
      const fileNameOnly = filePathRaw.split('/').pop().split('\\').pop();
      const timelineBase = (fileNameOnly || 'timeline').replace(/\.[^.]+$/, '') || 'timeline';
      const safeTimelineBase = timelineBase.replace(/[^A-Za-z0-9._-]/g, '_');
      const filename = `snapshot-${safeTimelineBase}-${timestamp}.json`;
      
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      
      showInfo('スナップショット保存完了', 'スナップショットを保存しました。');
    } catch (error) {
      console.error('スナップショット作成エラー:', error);
      showError('エラー', 'スナップショットの作成に失敗しました。');

  // スナップショットから復元
  window.restoreFromSnapshot = function() {
    console.log('restoreFromSnapshot関数が呼ばれました');
    console.log('復元関数が正しく呼び出されました');
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      try {
        const text = await file.text();
        const snapshot = JSON.parse(text);
        
        // バージョンチェック（metadata構造に対応）
        const version = snapshot.metadata?.version || snapshot.version;
        const timestamp = snapshot.metadata?.timestamp || snapshot.timestamp;
        const appTitle = snapshot.metadata?.appTitle || snapshot.appTitle;
        const currentLang = snapshot.metadata?.currentLang || snapshot.currentLang;
        
        if (!version || version !== '1.0') {
          showError('エラー', 'サポートされていないスナップショット形式です。');
          return;
        }
        
        // 確認ダイアログ
        const confirmMessage = `スナップショットを復元しますか？<br><br>
          <strong>保存日時:</strong> ${new Date(timestamp).toLocaleString()}<br>
          <strong>タイトル:</strong> ${appTitle || '未設定'}<br>
          <strong>言語:</strong> ${currentLang === 'ja' ? '日本語' : 'English'}<br><br>
          現在の状態は失われます。`;
        
        if (!confirm(confirmMessage.replace(/<br>/g, '\n').replace(/<[^>]*>/g, ''))) {
          return;
        }
        
        // 復元処理
        await restoreSnapshotData(snapshot);
        
        showInfo('復元完了', 'スナップショットから復元しました。');
        
      } catch (error) {
        console.error('スナップショット復元エラー:', error);
        showError('エラー', 'スナップショットの復元に失敗しました。ファイルが正しい形式か確認してください。');
      }
    };
    input.click();
  };
  
  // スナップショットデータを復元
  async function restoreSnapshotData(snapshot) {
    try {
      // 各状態を復元（metadata構造に対応）
      const metadata = snapshot.metadata || {};
      // 既存のlocalDataModeを保持しつつ復元（ユーザー操作以外で変更しない）
      const prevLocalDataMode = githubConfig && typeof githubConfig.localDataMode === 'boolean' ? githubConfig.localDataMode : false;
      githubConfig = { ...metadata.githubConfig || snapshot.githubConfig };
      if (typeof prevLocalDataMode === 'boolean') { githubConfig.localDataMode = prevLocalDataMode; }
      appTitle = metadata.appTitle || snapshot.appTitle;
      appTitleEn = metadata.appTitleEn || snapshot.appTitleEn;
      currentLang = metadata.currentLang || snapshot.currentLang;
      
      // GitHubから読み込んだmetadataを復元
      if (metadata.title || metadata.description || metadata.initialCreator || metadata.contributors) {
        window.currentData = { metadata: metadata };
        console.log('スナップショットからmetadataを復元:', metadata);
      }
      events = { ...snapshot.events };
      eraSettings = [...snapshot.eraSettings];
      // メイン年表ジャンル定義の復元（存在する場合）
      if (snapshot.mainGenres) {
        const mg = snapshot.mainGenres;
        try {
          if (mg && (Array.isArray(mg.list) || Array.isArray(mg))) {
            // setGenresFromRemote が受け付ける互換形式へ整形
            if (Array.isArray(mg.list)) {
              const list = mg.list;
              const labels = mg.labels || {};
              const labelsEn = mg.labelsEn || mg.labels_en || {};
              const conjunctions = mg.conjunctions || {};
              const normalized = list.map(code => ({
                code,
                label: labels[code] || code,
                label_en: labelsEn[code],
                conjunction: !!conjunctions[code]
              }));
              setGenresFromRemote(normalized);
            } else if (Array.isArray(mg)) {
              setGenresFromRemote(mg);
            }
          }
        } catch (e) {
          console.warn('スナップショットのジャンル定義復元に失敗:', e);
        }
      }

      selectedGenres = new Set(snapshot.selectedGenres || []);
      // tombstone復元
      try{
        if (Array.isArray(snapshot.deletedKeys)){
          deletedKeys = new Set(snapshot.deletedKeys);
          saveDeletedKeys();
        }
      }catch(_e){}
      
      // 起動/復元時は参照年表の選択状態をスナップショットから復元
      REF_GROUPS = {};
      if (snapshot.refGroups && typeof snapshot.refGroups === 'object') {
        try {
          Object.keys(snapshot.refGroups).forEach(groupId => {
            const g = snapshot.refGroups[groupId] || {};
            const codeSetArray = Array.isArray(g.codeSet) ? g.codeSet : Object.keys(g.labels || {});
            const selectedArray = Array.isArray(g.selected) ? g.selected : [];
            REF_GROUPS[groupId] = {
              id: g.id || groupId,
              title: g.title || groupId,
              labels: { ...(g.labels || {}) },
              labelsEn: { ...(g.labelsEn || {}) },
              codeSet: new Set(codeSetArray),
              selected: new Set(selectedArray)
            };
          });
        } catch(_e) { /* 復元失敗時は空のまま継続 */ }
      }
      
      // 重要度フィルタを復元
      filterImp = snapshot.filterImp || '';
      
      // プローブの状態を復元
      if (snapshot.probeStates) {
        if (snapshot.probeStates.blue) {
          probeBlue.eventYear = snapshot.probeStates.blue.eventYear;
          probeBlue.birthYear = snapshot.probeStates.blue.birthYear;
          probeBlue.redraw();

      // ビューポート状態は後段（DOM再描画後）で適用する
      const restoredViewportState = snapshot.viewportState || null;
      
      editFlags = { ...snapshot.editFlags };
      labelBackups = { ...snapshot.labelBackups };
      // deletionRecords = 削除記録システムは削除
      dataFreshnessTimestamp = snapshot.dataFreshnessTimestamp;
      orderChanged = snapshot.orderChanged;
      probeSyncData = { ...snapshot.probeSyncData };
      
      // フキダシデータを復元

  // データ鮮度チェック（同期前の整合性確認）
  async function checkDataFreshnessBeforeSync() {
    try {

      console.log('現在のdataFreshnessTimestamp:', dataFreshnessTimestamp);

      const currentTimestamp = await getGitHubFileTimestamp();

  // GitHubファイルのタイムスタンプを取得
  async function getGitHubFileTimestamp() {
    try {
      const url = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/contents/${githubConfig.filePath}`;
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`GitHub API エラー: ${response.status}`);
      }
      const data = await response.json();
      // GitHub APIのcommits情報から最新のコミット時刻を取得
      if (data.sha) {
        const commitsUrl = `https://api.github.com/repos/${githubConfig.owner}/${githubConfig.repo}/commits?path=${encodeURIComponent(githubConfig.filePath)}&per_page=1`;
        const commitsResponse = await fetch(commitsUrl);
        if (commitsResponse.ok) {
          const commitsData = await commitsResponse.json();
          if (commitsData.length > 0 && commitsData[0].commit && commitsData[0].commit.committer && commitsData[0].commit.committer.date) {
            return new Date(commitsData[0].commit.committer.date).getTime();
          }
        }
      }
      // フォールバック: 現在時刻を返す
      return Date.now();
    } catch (error) {
      console.error('GitHubタイムスタンプ取得エラー:', error);
      // エラーの場合は現在時刻を返してチェックをスキップ
      return Date.now();
    }
  }

  // 参照年表（読み取り専用）をGitHubから読み込み、現在のeventsにマージ
  async function loadReferenceTimelinesAndMerge(options) {
    const bustCache = !!(options && options.bustCache);
    try {
      // 参照年表読み込み時は自動選択を抑止し、読込後は常に「すべてクリア」へ
      const prevSkip = SKIP_REF_GENRE_AUTO_SELECT;
      SKIP_REF_GENRE_AUTO_SELECT = true;
      // 既存の参照年表データをクリア
      if (events && typeof events === 'object') {
        for (const y of Object.keys(events)) {
          const arr = events[y];
          if (Array.isArray(arr)) {
            events[y] = arr.filter(item => !item || item._source !== 'ref');
          }
        }
      }
      // 参照ジャンルグループの処理
      if (SKIP_REF_GENRE_AUTO_SELECT) {
        console.log('SKIP_REF_GENRE_AUTO_SELECT = true: 既存の参照年表グループの選択状態をクリア');
        // フラグが設定されている場合は、既存のグループの選択状態のみをクリア
        Object.keys(REF_GROUPS).forEach(groupId => {
          if (REF_GROUPS[groupId] && REF_GROUPS[groupId].selected) {
            console.log(`参照年表グループ ${groupId} の選択状態をクリア (選択数: ${REF_GROUPS[groupId].selected.size})`);
            REF_GROUPS[groupId].selected.clear();
          }
        });
      } else {
        console.log('SKIP_REF_GENRE_AUTO_SELECT = false: 参照年表グループ全体をクリア');
        // フラグが設定されていない場合は、グループ全体をクリア
        REF_GROUPS = {};
      }
      
      // 新しい設定形式（refTimelines）を優先、フォールバックで旧形式（refFilePaths）
      let refTimelines = [];
      if (githubConfig && githubConfig.refTimelines && Array.isArray(githubConfig.refTimelines)) {
        refTimelines = githubConfig.refTimelines;
      } else if (githubConfig && githubConfig.refFilePaths) {
        // 旧形式の場合は、メインのowner/repoを使用
        const paths = githubConfig.refFilePaths.split(',').map(s=>s.trim()).filter(Boolean);
        refTimelines = paths.map(path => ({
          owner: githubConfig.owner || '',
          repo: githubConfig.repo || '',
          filePath: path
        }));
      }
      
      if (!refTimelines.length) {
        // 参照年表が設定されていない場合は、再描画して終了（常にクリア状態を維持）
        renderEvents();
        updateGenreFilterButtonText();
        return { failures: [], successCount: 0 };
      }
      
      const failures = [];
      let successCount = 0;
      for (const ref of refTimelines) {
        // ループ先頭で参照情報を決定しておく（catchでも使うため）
        const type = (ref && (ref.sourceType || ref.type)) || (ref.owner ? 'github' : (ref.sheetId || ref.api || ref.gasApi ? 'sheet' : 'github'));
        const owner = (ref && ref.owner || '').trim();
        const repo = (ref && ref.repo || '').trim();
        const filePath = (ref && ref.filePath || '').trim();
        const api = (ref && (ref.gasApi || ref.api) || '').trim();
        const sheetId = extractSpreadsheetId((ref && ref.sheetId) ? String(ref.sheetId) : '');
        const ev = (ref && (ref.ev || ref.events)) ? String(ref.ev || ref.events).trim() : 'events';
        const gn = (ref && (ref.gn || ref.genres)) ? String(ref.gn || ref.genres).trim() : 'genres';
        const md = (ref && (ref.md || ref.metadata)) ? String(ref.md || ref.metadata).trim() : 'metadata';
        const minImportance = Math.max(1, Math.min(5, parseInt(ref && ref.minImportance || 1, 10) || 1));
        try {
          let groupId = '';
          if (type === 'github') {
            if (!owner || !repo || !filePath) {
              throw new Error('設定が不足しています（owner/repo/filePath を確認）');
            }
            const data = await loadOneReferenceFromGitHubWithoutToken(owner, repo, filePath, { bustCache });
            if (!data) continue;
            // 参照側にジャンル定義があれば表示用に取り込む
            if (data.genres) {
              try {
                const titles = getRefTimelineTitlesFromDataset(data, filePath);
                setRefGenresFromRemote(data.genres, filePath, titles.titleJa || filePath, titles.titleEn);
              } catch(_e) {}
            }
            // data.events 形式（推奨） or ルートが年→配列 形式
            const rawData = data.events ? data.events : data;
            const normalized = normalizeAll(rawData);
            groupId = filePath;
            const refMeta = (data && data.metadata) ? data.metadata : {};
            const refXHashtag = String(refMeta.xHashtag || refMeta.x_hashtag || '').trim();
            const refXLinkId = String(refMeta.xLinkId || refMeta.x_link_id || '').trim();
            const refShareBaseUrl = String(refMeta.shareBaseUrl || refMeta.share_url || '').trim();
            const refWebLinkBehavior = normalizeWebLinkBehavior(
              refMeta.webLinkBehavior || refMeta.web_link_behavior || refMeta.webPreviewMode || refMeta.web_preview_mode || ''
            );
            for (const y of Object.keys(normalized)) {
              const yi = parseInt(y,10);
              if (!events[yi]) events[yi] = [];
              for (const item of normalized[y]) {
                const itemImportance = item.imp || 0;
                if (itemImportance >= minImportance) {
                  const cloned = {
                    ...item,
                    _source: 'ref',
                    _refGroupId: groupId,
                    _refSourceType: 'github',
                    _refOwner: owner,
                    _refRepo: repo,
                    _refFilePath: filePath,
                    _refXHashtag: refXHashtag,
                    _refXLinkId: refXLinkId,
                    _refShareBaseUrl: refShareBaseUrl,
                    _refWebLinkBehavior: refWebLinkBehavior
                  };
                  events[yi].push(cloned);
                }
              }
            }
          } else {
            if (!api || !sheetId) {
              throw new Error('設定が不足しています（GAS API / Spreadsheet ID を確認）');
            }
            const data = await loadOneReferenceFromGAS({ api, sheetId, ev, gn, md });
            if (!data) continue;
            if (data.genres) {
              const gid = `${sheetId}/${ev}`;
              try {
                const titles = getRefTimelineTitlesFromDataset(data, gid);
                setRefGenresFromRemote(data.genres, gid, titles.titleJa || gid, titles.titleEn);
              } catch(_e) {}
            }
            const rawData = data.events ? data.events : data;
            const normalized = normalizeAll(rawData);
            groupId = `${sheetId}/${ev}`;
            for (const y of Object.keys(normalized)) {
              const yi = parseInt(y,10);
              if (!events[yi]) events[yi] = [];
              for (const item of normalized[y]) {
                const itemImportance = item.imp || 0;
                if (itemImportance >= minImportance) {
                  const cloned = { ...item, _source: 'ref', _refGroupId: groupId, _refSourceType: 'sheet' };
                  events[yi].push(cloned);
                }
              }
            }
          }
          successCount++;
        } catch (e) {
          console.warn('参照年表の1件読み込み失敗:', ref, e);
          const idForMsg = filePath || (sheetId ? `${sheetId}/${ev}` : '(id未設定)');
          failures.push(`${idForMsg}: ${e && e.message ? e.message : e}`);
        }
      }
      // 参照年表データ読み込み後、全グループの選択状態をクリア
      try {
        Object.keys(REF_GROUPS).forEach(groupId => {
          if (REF_GROUPS[groupId]) {
            REF_GROUPS[groupId].selected = new Set();
          }
        });
      } catch(_e) {}

      // 再描画（lastSavedEventsDataは更新しない）
      renderEvents();
      updateGenreFilterButtonText();
      
      // デバッグ: 参照年表グループの選択状態を確認
      console.log('参照年表データ読み込み完了後の状態:');
      Object.keys(REF_GROUPS).forEach(groupId => {
        const group = REF_GROUPS[groupId];
        console.log(`参照年表グループ ${groupId}: 選択数=${group.selected.size}, 総ジャンル数=${group.codeSet.size}`);
      });

      // エラー通知
      if (failures.length > 0) {
        const head = '参照年表の読み込みに失敗した項目があります。設定を確認してください。';
        const details = failures.slice(0, 5).map(m=>`- ${m}`).join('\n');
        const tail = failures.length > 5 ? `\n…他 ${failures.length - 5} 件` : '';
        // showErrorはモーダル表示。設定保存モーダルと重ならないよう直後のタスクで表示
        setTimeout(() => showError('参照年表エラー', `${head}\n\n${details}${tail}`), 0);
      } else if (successCount === 0) {
        setTimeout(() => showError('参照年表エラー', '参照年表の読み込みに失敗しました。owner/repo/filePath とネットワークを確認してください。'), 0);
      }
      // フラグを元に戻す
      SKIP_REF_GENRE_AUTO_SELECT = prevSkip;
      return { failures, successCount };
    } catch (e) {
      console.warn('参照年表の読み込み処理エラー:', e);
      SKIP_REF_GENRE_AUTO_SELECT = prevSkip;
      showError('参照年表エラー', `参照年表の読み込み処理でエラーが発生しました: ${e && e.message ? e.message : e}`);
      return { failures: [e && e.message ? e.message : String(e)], successCount: 0 };
    }
  }

  // 参照年表設定の妥当性チェック（読み込みは行うがeventsへはマージしない）
  async function validateReferenceTimelines() {
    try {
      let refTimelines = [];
      if (githubConfig && Array.isArray(githubConfig.refTimelines)) {
        refTimelines = githubConfig.refTimelines;
      } else if (githubConfig && githubConfig.refFilePaths) {
        const paths = githubConfig.refFilePaths.split(',').map(s=>s.trim()).filter(Boolean);
        refTimelines = paths.map(path => ({ owner: githubConfig.owner||'', repo: githubConfig.repo||'', filePath: path }));
      }
      const failures = [];
      let successCount = 0;
      if (!refTimelines.length) return { failures, successCount };
      for (const ref of refTimelines) {
        try {
          const type = (ref && (ref.sourceType || ref.type)) || (ref.owner ? 'github' : (ref.sheetId || ref.api || ref.gasApi ? 'sheet' : 'github'));
          if (type === 'github') {
            const owner = (ref && ref.owner || '').trim();
            const repo = (ref && ref.repo || '').trim();
            const filePath = (ref && ref.filePath || '').trim();
            if (!owner || !repo || !filePath) throw new Error('設定が不足しています（owner/repo/filePath を確認）');
            await loadOneReferenceFromGitHubWithoutToken(owner, repo, filePath);
          } else {
            const api = (ref.gasApi || ref.api || '').trim();
            const sheetId = extractSpreadsheetId(ref.sheetId || '');
            const ev = (ref.ev || ref.events || 'events');
            const gn = (ref.gn || ref.genres || 'genres');
            const md = (ref.md || ref.metadata || 'metadata');
            if (!api || !sheetId) throw new Error('設定が不足しています（GAS API URL / Spreadsheet ID を確認）');
            await loadOneReferenceFromGAS({ api, sheetId, ev, gn, md });
          }
          successCount++;
        } catch(e) {
          const idForMsg = (ref && ref.filePath) ? ref.filePath
                            : ((ref && ref.sheetId) ? `${ref.sheetId}/${ref.ev||ref.events||'events'}` : '(id未設定)');
          failures.push(`${idForMsg}: ${e && e.message ? e.message : e}`);
        }
      }
      return { failures, successCount };
    } catch (e) {
      return { failures: [e && e.message ? e.message : String(e)], successCount: 0 };
    }
  }

  // 1件の参照年表を取得（raw → トークン付き API フォールバック、メモリ/ブラウザキャッシュ対応）
  async function loadOneReferenceFromGitHubWithoutToken(owner, repo, filePath, options) {
    const bustCache = !!(options && options.bustCache);
    // 引数が1つの場合は旧形式（後方互換性）
    if (arguments.length === 1) {
      const path = arguments[0];
      return loadGithubJsonFile({
        owner: githubConfig.owner,
        repo: githubConfig.repo,
        filePath: path,
        bustCache
      });
    }
    return loadGithubJsonFile({ owner, repo, filePath, bustCache });
  }

  // GASから1件の参照年表を取得
  async function loadOneReferenceFromGAS({ api, sheetId, ev='events', gn='genres', er, md='metadata' }) {
    const u = new URL(api);
    u.searchParams.set('sheetId', sheetId);
    if (ev) u.searchParams.set('ev', ev);
    if (gn) u.searchParams.set('gn', gn);
    if (er) u.searchParams.set('er', er);
    if (md) u.searchParams.set('md', md);
    const res = await fetch(u.toString(), { cache: 'no-store' });
    if (!res.ok) throw new Error(`GAS fetch failed: ${res.status} ${res.statusText}`);
    return await res.json(); // expected: {schemaVersion, metadata, events, eraSettings, genres}
  }

    if (!ensureEditable(currentLang === 'ja' ? 'CSV/TSVロード' : 'CSV/TSV load')) return;

    // 設定画面で選択中のラジオを優先（未保存の「ローカル」選択も尊重）
    let uiSource = dataSource;
    try {
      const checked = document.querySelector('input[name="dataSource"]:checked');
      if (checked && checked.value) uiSource = checked.value;
    } catch (_e) {}

    // ローカル選択時はデータソースを local に固定し、GitHub filePath 再読込は行わない
    if (uiSource === 'local' || isLocalDataMode()) {
      if (dataSource !== 'local' || !(githubConfig && githubConfig.localDataMode)) {
        saveDataSource('local');
      }
      try {
        const params = new URLSearchParams(window.location.search);
        params.set('datasrc', 'local');
        params.delete('owner');
        params.delete('repo');
        params.delete('filePath');
        window.history.replaceState(null, '', `${window.location.pathname}?${params.toString()}`);
      } catch (_e) {}
      try { updateSyncButtonUi(); } catch (_e) {}
    } else {
      const pathInput = document.getElementById('filePath');
      const newPath = (pathInput && pathInput.value ? pathInput.value.trim() : '') || 'timeline_initial_00.json';
      const prevFilePath = githubConfig.filePath || 'timeline_initial_00.json';
      const filePathChanged = newPath !== prevFilePath;
      if (filePathChanged) {
        githubConfig.filePath = newPath;
        saveGitHubConfig();
        try { await clearAllDataAndReload(); } catch (e) { console.error(e); }
      }
    }

    // 既存のロード処理（CSV/TSV選択）
    const fileInputEl = document.getElementById('fileInput');
    if (fileInputEl) fileInputEl.click();
  }
