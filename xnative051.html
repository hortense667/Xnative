  // ファイル選択（ローカルJSON）
  async function chooseLocalJsonFile(returnFile=false){
    const canUseFsApi =
      typeof window !== 'undefined' &&
      typeof window.showOpenFilePicker === 'function' &&
      typeof window.FileSystemFileHandle !== 'undefined';
    if (canUseFsApi) {
      try {
        const handles = await window.showOpenFilePicker({
          multiple: false,
          types: [{
            description: 'JSON Files',
            accept: { 'application/json': ['.json'] }
          }]
        });
        const handle = Array.isArray(handles) ? handles[0] : null;
        if (!handle) return null;
        const f = await handle.getFile();
        localJsonFileHandle = handle;
        if (f && f.name) setActiveLocalFileName(f.name);
        return returnFile ? f : (f ? f.name : null);
      } catch (e) {
        if (e && e.name === 'AbortError') return null;
        // API失敗時のみ従来input方式へフォールバック
      }
    }
    return new Promise((resolve)=>{
      if (!localJsonInput) { resolve(null); return; }
      const handler = (e)=>{
        const f = e.target.files && e.target.files[0];
        localJsonInput.removeEventListener('change', handler);
        localJsonFileHandle = null;
        if (f){
          setActiveLocalFileName(f.name);
        }
        resolve(returnFile ? f : (f ? f.name : null));
      };
      localJsonInput.value = '';
      localJsonInput.addEventListener('change', handler);
      localJsonInput.click();
    });
  }

  function detectDelim(sample){ const cntTab=(sample.match(/\t/g)||[]).length; const cntSemi=(sample.match(/;/g)||[]).length; const cntComma=(sample.match(/,/g)||[]).length; const arr=[["\t",cntTab],[";",cntSemi],[",",cntComma]].sort((a,b)=>b[1]-a[1]); return arr[0][1]>0 ? arr[0][0] : ';'; }

  function importSeparatedText(text){
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
    let firstNonEmpty = lines.find(l=>l.trim().length>0) || '';
    const delim = detectDelim(firstNonEmpty);
    let addedCount=0; const errors=[];
    const seen=buildLabelGenreSet();

    // 先にジャンル行を収集して適用（形式: genre;CODE;LABEL;[label_en];[conjunction];[DELETE]）
    const genreDefs=[];
    const deletedGenreCodes = new Set(); // 削除対象のジャンルコード
    for (let i=0;i<lines.length;i++){
      const raw=lines[i].trim();
      if(!raw || raw.startsWith('#')) continue;
      const cols=raw.split(delim);
      const head=(cols[0]||'').trim().toLowerCase();
      if(head==='genre'){
        const code=(cols[1]||'').trim().toUpperCase();
        const label=(cols[2]||'').trim();
        const labelEn=(cols[3]||'').trim();
        const conjRaw=(cols[4]||'').trim().toLowerCase();
        const deleteFlag=(cols[5]||'').trim().toUpperCase();
        
        if(!code){ errors.push(`${i+1}行目: ジャンル行にコードがありません`); continue; }
        
        // 6列目（インデックス5）が「DELETE」の場合は削除対象として記録
        if(deleteFlag === 'DELETE'){
          deletedGenreCodes.add(code);
          console.log(`ジャンル削除: ${i+1}行目でジャンル「${code}」を削除対象として記録しました`);
          continue;
        }
        
        const genreDef = { code, label: label||code, conjunction: (conjRaw==='true' || conjRaw==='ture') };
        if(labelEn) genreDef.label_en = labelEn;
        genreDefs.push(genreDef);
      }
    }
    
    // 削除対象のジャンルをローカルから削除
    if(deletedGenreCodes.size > 0){
      // 現在のジャンル定義から削除対象を除外
      const currentGenres = getCurrentGenresDefinition() || [];
      const filteredGenres = currentGenres.filter(g => !deletedGenreCodes.has(g.code));
      
      // 削除されたジャンルコードを記録（同期時にJSONからも削除するため）
      if(!window.deletedGenres) window.deletedGenres = new Set();
      deletedGenreCodes.forEach(code => window.deletedGenres.add(code));
      
      // ジャンル定義を更新
      if(filteredGenres.length > 0){
        try{ setGenresFromRemote(filteredGenres); }catch(e){ /* 上位でエラー表示済み */ }
      } else {
        // すべてのジャンルが削除された場合
        GENRES = [];
        GENRE_LABELS = {};
        GENRE_LABELS_EN = {};
        GENRE_CONJUNCTIONS = {};
        GENRE_SET = new Set();
        GENRE_LABEL_TO_CODE_JA = {};
        GENRE_LABEL_TO_CODE_EN = {};
      }
      console.log(`削除されたジャンル:`, Array.from(deletedGenreCodes));
    }
    
    // 新規追加・更新のジャンルを適用
    if(genreDefs.length){
      try{ setGenresFromRemote(genreDefs); }catch(e){ /* 上位でエラー表示済み */ }
      // ロードしたジャンル情報を保持（同期時に反映するため）
      window.loadedGenres = genreDefs;
      // 非conjunctionのみ初期選択に設定し、ボタン表示を更新
      if (window.selectedGenres) { selectedGenres = new Set(GENRES.filter(genre => !GENRE_CONJUNCTIONS[genre])); }
      if (typeof updateGenreFilterButtonText === 'function') { updateGenreFilterButtonText(); }
    }

    // 時代区分（era）を一括収集し、最後に反映
    const eraDefs=[]; // {name,startYear,endYear,color,opacity,enabled,fillEnabled}
    // メタデータ情報を収集
    let pendingTitleJa=null, pendingTitleEn=null;
    let pendingDescJa=null, pendingDescEn=null;
    let pendingInitialCreator=null;
    let pendingContributors=null;

    for(let i=0;i<lines.length;i++){
      const raw=lines[i].trim(); 
      // 改行のみの行と「#」で始まる行を無視
      if(!raw || raw.startsWith('#')) continue;
      const cols=raw.split(delim);
      const head=(cols[0]||'').trim().toLowerCase();
      // ジャンル行は読み飛ばす（上の前処理で処理済み）
      if(head==='genre') continue;
      // タイトル行: title;JA;EN
      if(head==='title'){
        pendingTitleJa = (cols[1]||'').trim();
        pendingTitleEn = (cols[2]||'').trim();
        // 値がどちらかあれば追加カウント
        if(pendingTitleJa || pendingTitleEn) addedCount++;
        continue;
      }
      // 説明行: description;JA;EN
      if(head==='description'){
        pendingDescJa = (cols[1]||'').trim();
        pendingDescEn = (cols[2]||'').trim();
        // 値がどちらかあれば追加カウント
        if(pendingDescJa || pendingDescEn) addedCount++;
        continue;
      }
      // 初期作成者行: initialCreator;NAME
      if(head==='initialcreator'){
        pendingInitialCreator = (cols[1]||'').trim();
        if(pendingInitialCreator) addedCount++;
        continue;
      }
      // 貢献者行: contributors;NAME1,NAME2,NAME3
      if(head==='contributors'){
        const contributorsStr = (cols[1]||'').trim();
        if(contributorsStr){
          pendingContributors = contributorsStr.split(',').map(name => name.trim()).filter(name => name.length > 0);
          if(pendingContributors.length > 0) addedCount++;
        }
        continue;
      }
      // 時代区分行: era;name;startYear;endYear;color;opacity;enabled;fillEnabled
      if(head==='era'){
        const name=(cols[1]||'').trim();
        const startYearStr=(cols[2]||'').trim();
        const endYearStr=(cols[3]||'').trim();
        const color=(cols[4]||'').trim() || '#4169E1';
        const opacity=(cols[5]||'').trim() || '0.3';
        const enabledStr=(cols[6]||'').trim().toLowerCase();
        const fillStr=(cols[7]||'').trim().toLowerCase();
        if(!name){ errors.push(`${i+1}行目: era行に名称がありません`); continue; }
        let startYear='';
        if(startYearStr){
          const pStart = parseYearInput(startYearStr);
          if(!(pStart && Number.isInteger(pStart.year) && pStart.year>=YEAR_MIN && pStart.year<=YEAR_MAX)){
            errors.push(`${i+1}行目: era開始年が不正（${startYearStr}）`); continue;
          }
          startYear = pStart.year;
        }
        let endYear='';
        if(endYearStr){
          if(endYearStr.toLowerCase()==='ongoing') endYear='ongoing';
          else {
            const pEnd = parseYearInput(endYearStr);
            if(pEnd && Number.isInteger(pEnd.year) && pEnd.year>=YEAR_MIN && pEnd.year<=YEAR_MAX) endYear=pEnd.year;
            else { errors.push(`${i+1}行目: era終了年が不正（${endYearStr}）`); continue; }
          }
        }
        const enabled = (enabledStr==='true' || enabledStr==='1' || enabledStr==='yes');
        const fillEnabled = (fillStr==='' ? true : (fillStr==='true' || fillStr==='1' || fillStr==='yes'));
        eraDefs.push({ name, startYear, endYear, color, opacity, enabled, fillEnabled });
        addedCount++;
        continue;
      }
      if(i===0 && /年/.test(cols[0])) continue;
      // 取込フォーマット（推奨）:
      // 開始年;終了年;ラベル;label_en;ジャンル;重要度;URL;url_en;注釈;note_en;deleted;timeLabel
      // 互換: 10列（旧形式）/ 11列（deleted または timeLabel）も受け付ける
      
      if(cols.length<10){ errors.push(`${i+1}行目: 列数不足（開始年${delim}終了年${delim}ラベル${delim}label_en${delim}ジャンル${delim}重要度${delim}URL${delim}url_en${delim}注釈${delim}note_en）`); continue; }
      
      const startYearStr=(cols[0]||'').trim();
      const endYearStr=(cols[1]||'').trim();
      const label=(cols[2]||'').trim();
      
      let labelEn, genreStr, impStr, url, urlEn, note, noteEn, deleted, timeLabel;
      
      labelEn=(cols[3]||'').trim();
      genreStr=(cols[4]||'').trim();
      impStr=(cols[5]||'').trim();
      url=(cols[6]||'').trim();
      urlEn=(cols[7]||'').trim();
      note=(cols[8]||'').trim();
      noteEn=(cols[9]||'').trim();
      const col11 = (cols[10]||'').trim();
      const col12 = (cols[11]||'').trim();
      const boolLike = /^(|true|false|1|0|yes|no)$/i;
      if (cols.length >= 12) {
        deleted = col11;
        timeLabel = col12;
      } else if (cols.length === 11) {
        if (boolLike.test(col11)) {
          deleted = col11;
          timeLabel = '';
        } else {
          deleted = '';
          timeLabel = col11;
        }
      } else {
        deleted = '';
        timeLabel = '';
      }
      
      // 6個目のカラム（インデックス5: 重要度）が「DELETE」かどうかをチェック
      const col6Value = (cols[5]||'').trim().toUpperCase();
      const isDeleteColumn = col6Value === 'DELETE';
      
      // 6個目のカラムが「DELETE」の場合は削除処理を実行
      if (isDeleteColumn) {
        console.log(`行${i+1}: DELETE処理を開始します`);
        // 削除対象を特定するために、開始年、終了年、ラベル、ジャンルを使用
        if (!startYearStr && !endYearStr) {
          errors.push(`${i+1}行目: 削除対象を特定するために開始年または終了年が必要です`); continue;
        }
        if (!label && !labelEn) {
          errors.push(`${i+1}行目: 削除対象を特定するためにラベル（日本語または英語）が必要です`); continue;
        }
        
        // アイテムの年を決定
        let itemYear;
        if(startYearStr) {
          itemYear = parseYearInput(startYearStr)?.year;
        } else if(endYearStr && endYearStr.toLowerCase() !== 'ongoing') {
          itemYear = parseYearInput(endYearStr)?.year;
        } else {
          errors.push(`${i+1}行目: 削除対象を特定するために開始年が必要です`); continue;
        }
        if (!Number.isInteger(itemYear) || itemYear < YEAR_MIN || itemYear > YEAR_MAX) {
          errors.push(`${i+1}行目: 削除対象の年が不正（${startYearStr || endYearStr}）`); continue;
        }
        
        // ジャンルを取得（削除対象の特定に使用）
        const genres = genreStr ? genreStr.split(/[・|]/).map(g => g.trim().toUpperCase()).filter(g => g.length > 0) : [];
        const genreKey = genres.length > 0 ? genres.map(g=>String(g).toUpperCase()).sort().join('・') : '';
        
        if(!events[itemYear]) events[itemYear]=[];
        
        // createItemKeyと同じ方法でキーを生成して削除対象を特定
        // createItemKey: labelPrimary|startYear|genreKey
        // labelPrimary: label_enがあればそれ、なければlabel
        const labelPrimary = labelEn ? labelEn.trim() : (label ? label.trim() : '');
        const startYearForKey = startYearStr ? (parseYearInput(startYearStr)?.year ?? itemYear) : itemYear;
        const targetKey = `${labelPrimary}|${startYearForKey}|${genreKey}`;
        
        // 既存のアイテムを検索して削除（createItemKeyと同じ方法で比較）
        const arr = events[itemYear];
        let deleted = false;
        for (let j = arr.length - 1; j >= 0; j--) {
          const it = arr[j];
          const itLabelPrimary = (it.label_en && String(it.label_en).trim()) ? String(it.label_en).trim() : String(it.label || '');
          const itGenreKey = Array.isArray(it.genre) ? it.genre.slice().map(g=>String(g).toUpperCase()).sort().join('・') : String(it.genre || '').toUpperCase();
          const itStartYear = getYearValue(it.startYear, itemYear);
          const itKey = `${itLabelPrimary}|${itStartYear}|${itGenreKey}`;
          
          if (itKey === targetKey) {
            arr.splice(j, 1);
            deleted = true;
            addedCount++; // 削除もカウントに含める
            console.log(`削除処理: ${i+1}行目で項目を削除しました:`, { label, labelEn, itemYear, genreKey });
            break; // 1つ削除したら終了
          }
        }
        if (!deleted) {
          console.warn(`削除処理: ${i+1}行目で削除対象が見つかりませんでした:`, { label, labelEn, itemYear, genreKey, targetKey });
        }
        continue; // 削除処理後は次の行へ
      }
      
      // 開始年の検証
      if(startYearStr){
        const pStart = parseYearInput(startYearStr);
        if(!(pStart && Number.isInteger(pStart.year) && pStart.year>=YEAR_MIN && pStart.year<=YEAR_MAX)){
        errors.push(`${i+1}行目: 開始年が不正または範囲外（${startYearStr}）`); continue;
        }
      }
      
      // 終了年の検証（「ongoing」も許可）
      if(endYearStr && endYearStr.toLowerCase() !== 'ongoing'){
        const pEnd = parseYearInput(endYearStr);
        if(!(pEnd && Number.isInteger(pEnd.year) && pEnd.year>=YEAR_MIN && pEnd.year<=YEAR_MAX)){
          errors.push(`${i+1}行目: 終了年が不正または範囲外（${endYearStr}）`); continue;
        }
      }
      
      // 開始年と終了年の関係性検証（「ongoing」の場合はスキップ）
      if(startYearStr && endYearStr && endYearStr.toLowerCase() !== 'ongoing'){
        const pStart = parseYearInput(startYearStr);
        const pEnd = parseYearInput(endYearStr);
        if(pStart && pEnd && pStart.year > pEnd.year){
        errors.push(`${i+1}行目: 開始年が終了年より後になっています（${startYearStr} > ${endYearStr}）`); continue;
        }
      }
      
      // ラベルは日本語・英語のどちらか一方があればOK
      if(!label && !labelEn){ errors.push(`${i+1}行目: ラベルが空です（日本語または英語のいずれかが必要）`); continue; }
      // ジャンルは「・」または「|」で区切ることができる
      const genres = genreStr ? genreStr.split(/[・|]/).map(g => g.trim().toUpperCase()).filter(g => g.length > 0) : [];
      const genreKey = genres.length > 0 ? genres.map(g=>String(g).toUpperCase()).sort().join('・') : '';
      // 重複判定はラベル（日本語・英語）、開始年、ジャンルの組み合わせで行う
      const startYearKey = startYearStr ? (parseYearInput(startYearStr)?.year ?? '') : '';
      const key = `${label}|${labelEn}|${startYearKey}|${genreKey}`;
      // 動的ジャンル: 不正チェックは行わず、そのまま受け入れ
      if(impStr){ const n=parseInt(impStr,10); if(!(n>=1 && n<=5)){ errors.push(`${i+1}行目: 不正な重要度（${impStr}）`); continue; } }
      
      // アイテムの年を決定（開始年があれば開始年、なければ終了年、どちらもなければエラー）
      let itemYear;
      if(startYearStr) {
        itemYear = parseYearInput(startYearStr)?.year;
      } else if(endYearStr && endYearStr.toLowerCase() !== 'ongoing') {
        itemYear = parseYearInput(endYearStr)?.year;
      } else if(endYearStr && endYearStr.toLowerCase() === 'ongoing') {
        // ongoingの場合は開始年が必要
        if(!startYearStr) {
          errors.push(`${i+1}行目: 終了年が「ongoing」の場合は開始年が必要です`); continue;
        }
        itemYear = parseYearInput(startYearStr)?.year;
      } else {
        errors.push(`${i+1}行目: 開始年または終了年のいずれかが必要です`); continue;
      }
      
      const item={ label }; 
      if(labelEn) item.label_en=labelEn;
      if(startYearStr) item.startYear=startYearStr; 
      if(endYearStr) {
        if(endYearStr.toLowerCase() === 'ongoing') {
          item.endYear = 'ongoing';
        } else {
          item.endYear = endYearStr;
        }
      } 
      if(genres.length > 0) item.genre=genres; 
      if(impStr) item.imp=parseInt(impStr,10); 
      if(url) item.url=url; 
      if(urlEn) item.url_en=urlEn;
      if(note) item.note=note;
      if(noteEn) item.note_en=noteEn;
      if(normalizeTimeLabelValue(timeLabel)) item.timeLabel=normalizeTimeLabelValue(timeLabel);
      
      const isDeleted = deleted.toLowerCase() === 'true';

      if(!events[itemYear]) events[itemYear]=[]; 

      // 既存の同一キー（開始年・ラベル・ジャンル一致）を検索
      const sameKey = (it)=>{
        const gA = Array.isArray(it.genre) ? it.genre.slice().map(g=>String(g).toUpperCase()).sort().join('・') : (it.genre||'');
        return (it.label||'')===label && gA===genreKey && Number(getYearValue(it.startYear, itemYear))===Number(itemYear);
      };
      const arr = events[itemYear];
      const idx = arr.findIndex(sameKey);
      if(isDeleted){
        // (2) deleted=true の場合は該当項目を削除
        if(idx!==-1){ arr.splice(idx,1); }
        // 削除記録システムは削除（シンプルな同期ロジックに変更）
      } else {
        // (1) 同一キーがあれば上書き、なければ追加
        if(idx!==-1){
          arr[idx] = item;
        } else {
          arr.push(item);
        }
        // seen は重複検出用。ここでは上書き対象も既存扱いにする
        seen.add(key);
        addedCount++;
      }
    }
    // メタデータ情報を反映
    if(pendingTitleJa!=null || pendingTitleEn!=null || pendingDescJa!=null || pendingDescEn!=null || pendingInitialCreator!=null || pendingContributors!=null){
      try{
        // 現在のデータを取得または初期化
        let currentData = window.currentData || { events: events, metadata: {} };
        if(!currentData.metadata) currentData.metadata = {};
        // eventsデータが存在しない場合は現在のeventsを設定
        if(!currentData.events) currentData.events = events;
        
        // タイトルを反映
        if(pendingTitleJa!=null || pendingTitleEn!=null){
          if(!currentData.metadata.title) currentData.metadata.title = {};
          if(pendingTitleJa!=null) {
            currentData.metadata.title.ja = pendingTitleJa;
            if(typeof appTitle!=='undefined') appTitle = pendingTitleJa;
          }
          if(pendingTitleEn!=null) {
            currentData.metadata.title.en = pendingTitleEn;
            if(typeof appTitleEn!=='undefined') appTitleEn = pendingTitleEn;
          }
          if(typeof updateCustomTitleDisplay==='function') updateCustomTitleDisplay();
        }
        
        // 説明を反映
        if(pendingDescJa!=null || pendingDescEn!=null){
          if(!currentData.metadata.description) currentData.metadata.description = {};
          if(pendingDescJa!=null) currentData.metadata.description.ja = pendingDescJa;
          if(pendingDescEn!=null) currentData.metadata.description.en = pendingDescEn;
          // グローバル変数にも保存
          if (!window.appMetadata) window.appMetadata = {};
          window.appMetadata.description = currentData.metadata.description;
        }
        
        // 初期作成者を反映
        if(pendingInitialCreator!=null){
          currentData.metadata.initialCreator = pendingInitialCreator;
          // グローバル変数にも保存
          if (!window.appMetadata) window.appMetadata = {};
          window.appMetadata.initialCreator = pendingInitialCreator;
        }
        
        // 貢献者を反映
        if(pendingContributors!=null){
          currentData.metadata.contributors = pendingContributors;
          // グローバル変数にも保存
          if (!window.appMetadata) window.appMetadata = {};
          window.appMetadata.contributors = pendingContributors;
        }
        
        // グローバル変数に保存
        window.currentData = currentData;
        console.log('ロードデータ機能: window.currentDataを更新:', window.currentData);
        console.log('ロードデータ機能: metadata情報:', window.currentData.metadata);
      }catch(_e){
        console.warn('メタデータの反映に失敗:', _e);
      }
    }
    // 時代区分を反映
    if(eraDefs.length){
      eraSettings = eraDefs;
      try{ if(typeof drawEraBackgrounds==='function') drawEraBackgrounds(); }catch(_e){}
    }
    return {addedCount, errors};
  }

  // 設定画面内のセーブ処理（ジャンル→ラベルの順でCSV風に保存）
  function settingsSaveCsv(){
    try{
      // 認証が必要な場合はパスワードを要求
      if (downloadAuthentication === 'required'){
        const pwd = prompt('ダウンロードにはパスワードが必要です。パスワードを入力してください:');
        if (pwd !== 'admin2025'){
          showError('認証エラー', 'パスワードが一致しないためダウンロードできません。');
          return;
        }
      }

      const lines=[];
      // タイトルを先頭に出力: title;JA;EN
      if (typeof appTitle!=='undefined' || typeof appTitleEn!=='undefined'){
        const tJa = (typeof appTitle!=='undefined' && appTitle) ? appTitle : '';
        const tEn = (typeof appTitleEn!=='undefined' && appTitleEn) ? appTitleEn : '';
        lines.push(['title', tJa, tEn].join(';'));
      }
      // 時代区分を出力: era;name;startYear;endYear;color;opacity;enabled;fillEnabled
      if (Array.isArray(eraSettings)){
        for(const era of eraSettings){
          if(!era) continue;
          const name = era.name || '';
          const sy = era.startYear!=null ? String(era.startYear) : '';
          const ey = era.endYear!=null ? String(era.endYear) : '';
          const color = era.color || '#4169E1';
          const opacity = era.opacity || '0.3';
          const enabled = (era.enabled===false) ? 'false' : 'true';
          const fillEnabled = (era.fillEnabled===false) ? 'false' : 'true';
          lines.push(['era', name, sy, ey, color, opacity, enabled, fillEnabled].join(';'));
        }
      }
      // 現在のジャンル定義を genre;CODE;LABEL;label_en;conjunction で出力
      const allGenreCodes = Array.isArray(GENRES) ? GENRES.slice() : Object.keys(GENRE_LABELS||{});
      for(const code of allGenreCodes){
        const label = (GENRE_LABELS && GENRE_LABELS[code]) ? GENRE_LABELS[code] : code;
        const labelEn = (GENRE_LABELS_EN && GENRE_LABELS_EN[code]) ? GENRE_LABELS_EN[code] : '';
        const conj = (GENRE_CONJUNCTIONS && GENRE_CONJUNCTIONS[code]===true) ? 'true' : '';
        lines.push(['genre', code, label, labelEn, conj].join(';'));
      }

      // ラベル行: 開始年;終了年;ラベル;label_en;ジャンル;重要度;URL;url_en;注釈;note_en;timeLabel
      const years = Object.keys(events).map(y=>parseInt(y,10)).sort((a,b)=>a-b);
      for(const y of years){
        const arr = events[y] || [];
        for(const item of arr){
          if (item && item.deleted===true) continue; // tombstoneは出力しない
          if (item && item._source === 'ref') continue; // 参照年表データは出力しない
          const startYear = item.startYear ? String(item.startYear) : '';
          const endYear = item.endYear ? String(item.endYear) : '';
          const label = item.label || '';
          const labelEn = item.label_en || '';
          const genreKey = Array.isArray(item.genre) ? item.genre.join('・') : (item.genre||'');
          const imp = (item.imp!=null) ? String(item.imp) : '';
          const url = item.url || '';
          const urlEn = item.url_en || '';
          const note = item.note || '';
          const noteEn = item.note_en || '';
          const timeLabel = normalizeTimeLabelValue(item.timeLabel);
          lines.push([startYear, endYear, label, labelEn, genreKey, imp, url, urlEn, note, noteEn, timeLabel].join(';'));
        }
      }

      const content = lines.join('\n');
      const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'xnative_backup.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showInfo('セーブ完了', 'ジャンルとラベルのデータを保存しました。');
    }catch(e){
      console.error('settingsSaveCsv error', e);
      showError('セーブエラー', '保存処理でエラーが発生しました。');
    }
  }
  // グローバル公開（設定モーダル内の onclick から呼べるように）
  if (typeof window !== 'undefined') { 
    window.settingsSaveCsv = settingsSaveCsv;
    window.addRefTimelineInput = addRefTimelineInput;
    window.removeRefTimelineInput = removeRefTimelineInput;
    // 新しい参照年表追加ボタン用
    window.addRefTimelineInputGh = addRefTimelineInputGh;
    window.addRefTimelineInputSheet = addRefTimelineInputSheet;
  }

  // ===== 空年クリックで編集を開く =====
  function openEditorForEmptyYearAt(xCSS,yCSS){ 
    const rect=stage.getBoundingClientRect(); 
    const scale=1; 
    const x=(xCSS-rect.left)/scale; 
    const y=(yCSS-rect.top)/scale; 
    if(x >= ORIGIN_X - HANDLE_LANE_W) return; 
    const year = YEAR_MIN + Math.round((y-ORIGIN_Y)/PX_PER_YEAR); 
    if(year<YEAR_MIN||year>YEAR_MAX) return; 
    showEditModal(year, -1, { label: '', startYear: year, endYear: '' }); 
  }
  stage.addEventListener('click', (e)=>{ 
    if(e.target && e.target.tagName && e.target.tagName.toLowerCase()==='text') return; 
    if(isProbeDragging) return; // プローブドラッグ中は空年クリック処理を無視
    if (isMobileExperience()) {
      try {
        const coords = getStageCoordsFromClient(e.clientX, e.clientY);
        if (coords.x < ORIGIN_X - HANDLE_LANE_W) {
          let year = YEAR_MIN + Math.round((coords.y - ORIGIN_Y) / PX_PER_YEAR);
          if (year >= YEAR_MIN && year <= YEAR_MAX && !isEditMode) {
            showDetailList(year, null, false);
          }
        }
      } catch (_e) {}
      return;
    }
    // Ctrl+Shift+左クリックでコの字型マーカーを追加
    if (e.ctrlKey && e.shiftKey && e.button === 0) {
      const rect=stage.getBoundingClientRect();
      const xOnStage = e.clientX - rect.left;
      if (xOnStage >= ORIGIN_X - HANDLE_LANE_W) {
        createKonojiAt(e.clientX, e.clientY);
      }
      return;
    }
    // フキダシ追加モード中、または Shift+Click でフキダシ作成
    if (isFukidashiPlacementMode || e.shiftKey) {
      createFukidashiAt(e.clientX, e.clientY);
      // ワンクリック配置モードでは連続配置を避けるため、モードは維持しつつここで停止
      return;
    }
    // 左カラムのイベント領域クリック時の挙動
    try{
      const rect=stage.getBoundingClientRect();
      const scale=1;
      const x=(e.clientX-rect.left)/scale;
      const y=(e.clientY-rect.top)/scale;
      if(x >= ORIGIN_X - HANDLE_LANE_W) return;
      let year = YEAR_MIN + Math.round((y-ORIGIN_Y)/PX_PER_YEAR);
      if(year<YEAR_MIN||year>YEAR_MAX) return;
      // editmode=ON でない場合は何もしない
      if (!isEditMode) {
        return;
      }
      // 左カラムの空白クリック時は、常にその年に追加（編集モーダル）
      showEditModal(year, -1, { label: '', startYear: year, endYear: '' });
    }catch(_e){}
  });

  // ===== プローブ =====
  function makeProbe(color){
    const g=document.getElementById('probe-'+color);
    const state={eventYear:color==='blue'?1995:1995,birthYear:color==='blue'?1980:1960};
    const stroke=(color==='red'?'#ff3333':'#4da3ff');
    const eventLine=lineEl(ORIGIN_X,0,ORIGIN_X,0); eventLine.style.stroke=stroke; eventLine.style.strokeWidth=3; // 水平（交点まで）
    const vLine=lineEl(0,0,0,ORIGIN_Y);           vLine.style.stroke=stroke; vLine.style.strokeWidth=3; vLine.setAttribute('pointer-events','stroke');
    const diag=lineEl(0,0,0,0);                    diag.style.stroke=stroke;  diag.style.strokeWidth=3; // 左上斜め
    const eh=circleEl(HANDLE_X,0,8,'handle');      eh.setAttribute('stroke',stroke); eh.setAttribute('fill','#fff');
    const bh=circleEl(HANDLE_X,0,8,'handle');      bh.setAttribute('stroke',stroke); bh.setAttribute('fill','#fff');
    // 年齢表示を固定位置のHTML要素として作成
    const ageTextElement = document.createElement('div');
    ageTextElement.style.cssText = `
      position: fixed;
      top: 78px;
      left: 0;
      font-size: 18px;
      font-weight: 700;
      color: #000;
      pointer-events: none;
      z-index: 101;
      display: none;
    `;
    ageTextElement.id = `age-text-${color}`;
    document.body.appendChild(ageTextElement);
    
    const ageText=textEl('',0,0,'ageTickText'); // SVG要素は非表示にする
    const eventYearText=textEl('', ORIGIN_X+8, 0, 'ageTickText'); eventYearText.style.fontSize='14px'; eventYearText.style.fill=stroke; eventYearText.setAttribute('text-anchor','start');
    const birthYearText=textEl('', ORIGIN_X+8, 0, 'ageTickText'); birthYearText.style.fontSize='14px'; birthYearText.style.fill=stroke; birthYearText.setAttribute('text-anchor','start');

    g.append(eventLine,vLine,diag,eh,bh,ageText,eventYearText,birthYearText);

    function redraw(){
      const yE=yFromBirthYear(state.eventYear);
      const yB=yFromBirthYear(state.birthYear);
      const age=Math.max(0,Math.min(AGE_MAX,state.eventYear-state.birthYear));
      const ix=xFromAge(age);
      eventLine.setAttribute('y1',yE);eventLine.setAttribute('y2',yE); eventLine.setAttribute('x1',ORIGIN_X);eventLine.setAttribute('x2',ix);
      vLine.setAttribute('x1',ix);vLine.setAttribute('x2',ix);vLine.setAttribute('y1',yE);vLine.setAttribute('y2',ORIGIN_Y);
      const tMax=Math.max(0,Math.min((ix-ORIGIN_X)/PX_PER_AGE,(yE-ORIGIN_Y)/PX_PER_YEAR));
      diag.setAttribute('x1',ix);diag.setAttribute('y1',yE); diag.setAttribute('x2',ix-PX_PER_AGE*tMax);diag.setAttribute('y2',yE-PX_PER_YEAR*tMax);
      eh.setAttribute('cx',HANDLE_X);eh.setAttribute('cy',yE);
      bh.setAttribute('cx',HANDLE_X);bh.setAttribute('cy',yB);
      // HTML要素の年齢表示を更新（線の右側に表示）
      ageTextElement.textContent = `${age}歳`;
      ageTextElement.style.left = `${ix + 10}px`;
      ageTextElement.style.display = 'block';
      
      // 年齢表示の位置をヘッダーの高さに応じて調整
      updateAgeDisplayPosition();
      
      // SVG要素は非表示
      ageText.textContent = '';
      eventYearText.textContent = `${state.eventYear}年`;
      eventYearText.setAttribute('x', ORIGIN_X+8);
      eventYearText.setAttribute('y', yE-6);
      const yAtAxis = yE - age*PX_PER_YEAR; const by = Math.round((yAtAxis - ORIGIN_Y)/PX_PER_YEAR) + YEAR_MIN;
      birthYearText.textContent = `${by}年生`;
      birthYearText.style.fill = '#000'; // 生年表示を黒色に
      birthYearText.setAttribute('x', ORIGIN_X+8);
      birthYearText.setAttribute('y', yAtAxis-6);
    }

    function startDrag(){ 
      document.body.classList.add('dragging'); 
      isProbeDragging = true;
    }
    function endDrag(){ 
      document.body.classList.remove('dragging'); 
      // ドラッグ終了後、少し遅延してフラグをリセット（クリックイベントより後に実行されるように）
      setTimeout(() => { isProbeDragging = false; }, 10);
    }
    function dragByYear(el,prop){ let dragging=false, startY=0, startVal=0; el.addEventListener('mousedown',e=>{ dragging=true; startY=e.clientY; startVal=state[prop]; startDrag(); e.preventDefault(); e.stopPropagation(); }); window.addEventListener('mousemove',e=>{ if(!dragging) return; const dy=e.clientY-startY; const dYear=Math.round(dy/PX_PER_YEAR); const newVal = Math.max(YEAR_MIN,Math.min(YEAR_MAX,startVal+dYear)); state[prop] = newVal; 
      
      // プローブ連動処理
      if (probeSyncData.isActive) {
        handleProbeSync(color, prop, newVal);
      }
      
      redraw(); }); window.addEventListener('mouseup',()=>{ if(dragging){ dragging=false; endDrag(); } }); }
    dragByYear(eh,'eventYear'); dragByYear(bh,'birthYear'); dragByYear(vLine,'birthYear');

    state.redraw=redraw; redraw(); return state;
  }

  const probeBlue=makeProbe('blue');
  const probeRed=makeProbe('red');
  
  // ===== プローブ連動機能 =====
  function saveProbeSyncData() {
    if (!probeSyncData.isActive) return;
    
    // 現在のプローブ位置を記憶
    probeSyncData.redBottomYear = probeRed.eventYear;
    probeSyncData.blueBottomYear = probeBlue.eventYear;
    probeSyncData.redTopYear = probeRed.birthYear;
    probeSyncData.blueTopYear = probeBlue.birthYear;
    
    // 年差を計算
    probeSyncData.redAgeDiff = probeRed.eventYear - probeRed.birthYear;
    probeSyncData.blueAgeDiff = probeBlue.eventYear - probeBlue.birthYear;
    
    console.log('プローブ連動データを保存:', probeSyncData);
  }
  
  function handleProbeSync(draggedColor, draggedProp, newValue) {
    if (!probeSyncData.isActive) return;
    
    if (draggedProp === 'eventYear') {
      // 下の丸（eventYear）をドラッグした場合
      // ドラッグされたプローブの下の丸を新しい位置に設定
      if (draggedColor === 'red') {
        probeRed.eventYear = newValue;
        // 上の丸を年差を維持して移動
        probeRed.birthYear = newValue - probeSyncData.redAgeDiff;
      } else {
        probeBlue.eventYear = newValue;
        // 上の丸を年差を維持して移動
        probeBlue.birthYear = newValue - probeSyncData.blueAgeDiff;
      }
      
      // もう一方のプローブも同じ年差で移動
      const yearDiff = newValue - probeSyncData[draggedColor + 'BottomYear'];
      
      if (draggedColor === 'red') {
        // 赤をドラッグした場合、水色も同じ年差で移動
        probeBlue.eventYear = probeSyncData.blueBottomYear + yearDiff;
        probeBlue.birthYear = probeSyncData.blueTopYear + yearDiff;
      } else {
        // 水色をドラッグした場合、赤も同じ年差で移動
        probeRed.eventYear = probeSyncData.redBottomYear + yearDiff;
        probeRed.birthYear = probeSyncData.redTopYear + yearDiff;
      }
      
    } else if (draggedProp === 'birthYear') {
      // 上の丸（birthYear）をドラッグした場合
      // ドラッグされたプローブの上の丸を新しい位置に設定
      if (draggedColor === 'red') {
        probeRed.birthYear = newValue;
        // 下の丸を年差を維持して移動
        probeRed.eventYear = newValue + probeSyncData.redAgeDiff;
      } else {
        probeBlue.birthYear = newValue;
        // 下の丸を年差を維持して移動
        probeBlue.eventYear = newValue + probeSyncData.blueAgeDiff;
      }
      
      // もう一方のプローブも同じ年差で移動
      const ageDiff = newValue - probeSyncData[draggedColor + 'TopYear'];
      
      if (draggedColor === 'red') {
        // 赤をドラッグした場合、水色も同じ年差で移動
        probeBlue.birthYear = probeSyncData.blueTopYear + ageDiff;
        probeBlue.eventYear = probeSyncData.blueBottomYear + ageDiff;
      } else {
        // 水色をドラッグした場合、赤も同じ年差で移動
        probeRed.birthYear = probeSyncData.redTopYear + ageDiff;
        probeRed.eventYear = probeSyncData.redBottomYear + ageDiff;
      }
    }
    
    // 両方のプローブを再描画
    probeRed.redraw();
    probeBlue.redraw();
  }

  // ジャンルごとの登録件数を計算する関数
  function getGenreCounts() {
    const counts = {};
    const genreLabels = GENRE_LABELS;
    
    // 各ジャンルの件数を初期化
    for (const code of GENRES) counts[code] = 0;
    
    // 実際のデータから件数を計算（配列ジャンル対応）
    for (const items of Object.values(events)) {
      for (const item of (items || [])) {
        const g = item.genre;
        if (Array.isArray(g)) {
          for (const codeRaw of g) {
            const code = String(codeRaw || 'UNC').toUpperCase();
            if (!(code in counts)) counts[code] = 0; // 未知ジャンルも計上
            counts[code]++;
          }
        } else {
          const code = String(g || 'UNC').toUpperCase();
          if (!(code in counts)) counts[code] = 0;
          counts[code]++;
        }
      }
    }
    
    return counts;
  }
  
  // 総登録件数を取得する関数
  function getTotalItemCount() {
    let total = 0;
    for (const [year, items] of Object.entries(events)) {
      total += items.length;
    }
    return total;
  }

  // メイン年表（参照年表を除く）の総登録件数を取得する関数
  // 項目（ラベル）の数をカウントする。ジャンルが複数指定されていても1項目としてカウント
  function getMainItemCount() {
    let total = 0;
    for (const [year, items] of Object.entries(events)) {
      if (!Array.isArray(items)) continue;
      for (const item of items) {
        if (!item || item._source === 'ref') continue; // 参照年表は除外
        total++; // 各項目（ラベル）を1つとしてカウント
      }
    }
    return total;
  }
  
  // ジャンル一覧を件数付きで生成する関数
  function generateGenreListWithCounts() {
    const counts = getGenreCounts();
    const genreLabels = GENRE_LABELS;
    
    return GENRES.map(genre => {
      const count = counts[genre] || 0;
      // 現在の言語に応じて適切なジャンルラベルを選択
      const label = (currentLang === 'en' && GENRE_LABELS_EN && GENRE_LABELS_EN[genre]) 
        ? GENRE_LABELS_EN[genre]
        : (GENRE_LABELS && GENRE_LABELS[genre]) ? GENRE_LABELS[genre] : (genreLabels[genre] || genre);
      return `<li><strong>${genre}:</strong> ${label}（${count}）</li>`;
    }).join('');
  }

  // メタデータ情報を取得する関数
  function getMetadataInfo() {
    let metadata = null;
    
    // 現在のデータからメタデータを取得
    try {
      if (window.currentData && window.currentData.metadata) {
        metadata = window.currentData.metadata;
      } else {
        // ローカルストレージから取得を試行
        const localData = localStorage.getItem('xnative_data');
        if (localData) {
          const parsed = JSON.parse(localData);
          if (parsed.metadata) {
            metadata = parsed.metadata;
          }
        }
      }
    } catch (e) {
      console.warn('メタデータの取得に失敗:', e);
    }
    
    // window.appMetadataからも情報を取得（説明、初期作成者、貢献者）
    if (window.appMetadata) {
      if (!metadata) metadata = {};
      if (window.appMetadata.description) {
        metadata.description = window.appMetadata.description;
      }
      if (window.appMetadata.initialCreator) {
        metadata.initialCreator = window.appMetadata.initialCreator;
      }
      if (window.appMetadata.contributors) {
        metadata.contributors = window.appMetadata.contributors;
      }
    }
    
    if (!metadata) {
      return '<p style="color: #666; font-style: italic;">メタデータ情報が利用できません</p>';
    }
    
    const titleJa = metadata.title && metadata.title.ja ? metadata.title.ja : '';
    const titleEn = metadata.title && metadata.title.en ? metadata.title.en : '';
    const descJa = metadata.description && metadata.description.ja ? metadata.description.ja : '';
    const descEn = metadata.description && metadata.description.en ? metadata.description.en : '';
    const creator = metadata.initialCreator || '';
    const contributors = metadata.contributors && Array.isArray(metadata.contributors) ? metadata.contributors : [];
    
    return `
      <div style="background: #f9f9f9; padding: 12px; border-radius: 6px; margin: 8px 0;">
        <p><strong>タイトル (日本語):</strong> ${titleJa || '(未設定)'}</p>
        <p><strong>タイトル (英語):</strong> ${titleEn || '(未設定)'}</p>
        <p><strong>説明 (日本語):</strong> ${descJa || '(未設定)'}</p>
        <p><strong>説明 (英語):</strong> ${descEn || '(未設定)'}</p>
        <p><strong>初期作成者:</strong> ${creator || '(未設定)'}</p>
        <p><strong>貢献者:</strong> ${contributors.length > 0 ? contributors.join(', ') : '(未設定)'}</p>
      </div>
    `;
  }
