  function deepCloneJson(value, fallback) {
    try {
      return JSON.parse(JSON.stringify(value));
    } catch (_e) {
      return fallback;
    }
  }

  function createRevisionStamp() {
    return `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
  }

  function toComparableItem(item) {
    const clone = deepCloneJson(item || {}, {});
    delete clone._source;
    delete clone._refGroupId;
    return clone;
  }

  function summarizeConflictItem(item) {
    if (!item) return '(none)';
    const o = toComparableItem(item);
    const picked = {
      label: o.label || '',
      label_en: o.label_en || '',
      startYear: o.startYear || '',
      endYear: o.endYear || '',
      genre: o.genre || '',
      imp: o.imp != null ? o.imp : '',
      url: o.url || '',
      url_en: o.url_en || '',
      note: o.note || '',
      note_en: o.note_en || '',
      timeLabel: o.timeLabel || '',
      _rev: o._rev || ''
    };
    return JSON.stringify(picked, null, 2);
  }

  function findItemByKey(eventsObj, year, item) {
    if (!eventsObj || !item || year == null) return null;
    const yearKey = String(year);
    const list = Array.isArray(eventsObj[yearKey]) ? eventsObj[yearKey] : [];
    if (list.length === 0) return null;
    const key = createItemKey(item, yearKey);
    return list.find(it => createItemKey(it, yearKey) === key) || null;
  }

  function isItemRevisionConflict(localSnapshotItem, remoteItem) {
    if (!localSnapshotItem || !remoteItem) return true;
    const localRev = localSnapshotItem._rev ? String(localSnapshotItem._rev) : '';
    const remoteRev = remoteItem._rev ? String(remoteItem._rev) : '';
    if (localRev && remoteRev) {
      return localRev !== remoteRev;
    }
    // 後方互換: _rev が無い古いデータは内容差分で判定
    return !deepEqualNormalized(toComparableItem(localSnapshotItem), toComparableItem(remoteItem));
  }

  function hasYearRevisionConflict(localYearItems, remoteYearItems, yearKey) {
    const localArr = Array.isArray(localYearItems) ? localYearItems : [];
    const remoteArr = Array.isArray(remoteYearItems) ? remoteYearItems : [];
    if (localArr.length !== remoteArr.length) return true;

    const remoteMap = new Map();
    for (const it of remoteArr) {
      remoteMap.set(createItemKey(it, yearKey), it);
    }
    for (const it of localArr) {
      const key = createItemKey(it, yearKey);
      const rem = remoteMap.get(key);
      if (!rem) return true;
      if (isItemRevisionConflict(it, rem)) return true;
    }
    return false;
  }

  async function confirmConflictAndMaybeReload(title, message, localItem, remoteItem) {
    const localText = summarizeConflictItem(localItem);
    const remoteText = summarizeConflictItem(remoteItem);
    const ask = [
      `${title}`,
      message,
      '',
      'OK: 自分の変更を優先して保存',
      'キャンセル: 最新を再読み込みして中止',
      '',
      '--- ローカル ---',
      localText.slice(0, 420),
      '',
      '--- リモート ---',
      remoteText.slice(0, 420)
    ].join('\n');
    const forceSave = confirm(ask);
    if (!forceSave) {
      try { await clearAllDataAndReloadWithoutConfirm({ preserveGenreSelection: true }); } catch (_e) {}
      return false;
    }
    return true;
  }

  function removeEventItemByKey(eventsObj, year, item) {
    if (!eventsObj || !item || year == null) return;
    const yearKey = String(year);
    const list = Array.isArray(eventsObj[yearKey]) ? eventsObj[yearKey] : [];
    if (list.length === 0) return;
    const targetKey = createItemKey(item, yearKey);
    const filtered = list.filter(it => createItemKey(it, yearKey) !== targetKey);
    if (filtered.length > 0) {
      eventsObj[yearKey] = filtered;
    } else {
      delete eventsObj[yearKey];
    }
  }

  function upsertEventItemByKey(eventsObj, year, item) {
    if (!eventsObj || !item || year == null) return;
    const yearKey = String(year);
    if (!Array.isArray(eventsObj[yearKey])) eventsObj[yearKey] = [];
    const list = eventsObj[yearKey];
    const targetKey = createItemKey(item, yearKey);
    const idx = list.findIndex(it => createItemKey(it, yearKey) === targetKey);
    if (idx >= 0) {
      list[idx] = deepCloneJson(item, item);
    } else {
      list.push(deepCloneJson(item, item));
    }
  }

  async function saveEditedItemToGitHubAndReload({ originalItem, originalYear, updatedItem, updatedYear, reason = 'edit' } = {}) {
    try {
      if (!ensureEditable(currentLang === 'ja' ? '編集内容の保存' : 'saving edited item')) return false;
      if (!updatedItem || updatedYear == null) {
        showError('保存エラー', '更新対象データが不正です。');
        return false;
      }
      if (dataSource === 'sheet') {
        // Sheets モードではローカルTSV連携のみ行う
        return true;
      }
      if (isLocalDataMode()) {
        // ローカルデータモードでは即時にJSON保存
        return await syncToLocal();
      }

      const latest = await loadFromGitHubWithSha();
      if (!latest || latest.remoteData === null) {
        // トークン未設定/不正時のCSV導線・キャンセル、または読込側で既にエラー表示済み
        if (latest && (latest.skipped || latest.errorShown)) return false;
        showError('保存エラー', '保存直前の最新データ取得に失敗しました。');
        return false;
      }

      const remoteMain = buildMainEventsOnly(latest.remoteData || {}, { includeDeleted: false });
      const mergedEvents = deepCloneJson(remoteMain, {});
      const remoteOriginal = (originalItem && originalYear != null) ? findItemByKey(remoteMain, originalYear, originalItem) : null;

      // 既存項目編集時の rev / 内容衝突チェック
      if (originalItem && originalYear != null) {
        if (!remoteOriginal) {
          const forceMissing = await confirmConflictAndMaybeReload(
            '競合検出（編集）',
            '対象項目が最新データ上で見つかりません。ほかのユーザーが削除または識別情報を変更した可能性があります。',
            originalItem,
            null
          );
          if (!forceMissing) return false;
        } else if (isItemRevisionConflict(originalItem, remoteOriginal)) {
          const forceEdit = await confirmConflictAndMaybeReload(
            '競合検出（編集）',
            '同じ項目が他のユーザーにより更新されています。このまま保存すると相手の変更を上書きする可能性があります。',
            updatedItem,
            remoteOriginal
          );
          if (!forceEdit) return false;
        }
      } else {
        // 新規追加時でも同一キー既存項目がある場合は衝突として確認
        const remoteDuplicate = findItemByKey(remoteMain, updatedYear, updatedItem);
        if (remoteDuplicate && isItemRevisionConflict(updatedItem, remoteDuplicate)) {
          const forceAdd = await confirmConflictAndMaybeReload(
            '競合検出（新規追加）',
            '同じ識別キーの項目がすでに最新データに存在します。上書き保存しますか？',
            updatedItem,
            remoteDuplicate
          );
          if (!forceAdd) return false;
        }
      }

      // 旧キー（編集前）を除去してから、新キー（編集後）を適用する
      if (originalItem && originalYear != null) {
        removeEventItemByKey(mergedEvents, originalYear, originalItem);
      }
      const updatedWithRev = deepCloneJson(updatedItem, {});
      updatedWithRev._rev = createRevisionStamp();
      upsertEventItemByKey(mergedEvents, updatedYear, updatedWithRev);

      const payload = {
        metadata: deepCloneJson(latest.remoteMetadata || {}, {}),
        events: mergedEvents,
        eraSettings: Array.isArray(latest.remoteEraSettings) ? deepCloneJson(latest.remoteEraSettings, []) : [],
        genres: Array.isArray(latest.remoteGenres) ? deepCloneJson(latest.remoteGenres, []) : []
      };

      const ok = await saveToGitHub(payload, latest.remoteSha || null);
      if (!ok) return false;

      // 保存成功後は全体を再読み込み
      await clearAllDataAndReloadWithoutConfirm({ preserveGenreSelection: true });
      return true;
    } catch (e) {
      console.error('saveEditedItemToGitHubAndReload エラー:', e);
      showError('保存エラー', `編集項目の保存に失敗しました: ${e.message}`);
      return false;
    }
  }

  async function saveReorderedYearToGitHubAndReload(targetYear, reason = 'order') {
    try {
      if (!ensureEditable(currentLang === 'ja' ? '並べ替え結果の保存' : 'saving reordered items')) return false;
      if (targetYear == null) {
        showError('保存エラー', '並べ替え対象の年が不正です。');
        return false;
      }
      if (dataSource === 'sheet') {
        return true;
      }
      if (isLocalDataMode()) {
        return await syncToLocal();
      }

      const latest = await loadFromGitHubWithSha();
      if (!latest || latest.remoteData === null) {
        if (latest && (latest.skipped || latest.errorShown)) return false;
        showError('保存エラー', '保存直前の最新データ取得に失敗しました。');
        return false;
      }

      const yearKey = String(targetYear);
      const remoteMain = buildMainEventsOnly(latest.remoteData || {}, { includeDeleted: false });
      const localMain = buildMainEventsOnly(events || {}, { includeDeleted: false });
      const mergedEvents = deepCloneJson(remoteMain, {});
      const reorderedYearItems = Array.isArray(localMain[yearKey]) ? deepCloneJson(localMain[yearKey], []) : [];
      const remoteYearItems = Array.isArray(remoteMain[yearKey]) ? remoteMain[yearKey] : [];

      if (hasYearRevisionConflict(reorderedYearItems, remoteYearItems, yearKey)) {
        const forceOrder = await confirmConflictAndMaybeReload(
          '競合検出（並べ替え）',
          '並べ替え対象の年に他のユーザー更新が含まれます。保存すると相手の変更を上書きする可能性があります。',
          { year: yearKey, items: reorderedYearItems },
          { year: yearKey, items: remoteYearItems }
        );
        if (!forceOrder) return false;
      }

      // 変更年のみローカル順で置換（他年は最新リモートを維持）
      if (reorderedYearItems.length > 0) {
        mergedEvents[yearKey] = reorderedYearItems;
      } else {
        delete mergedEvents[yearKey];
      }

      const payload = {
        metadata: deepCloneJson(latest.remoteMetadata || {}, {}),
        events: mergedEvents,
        eraSettings: Array.isArray(latest.remoteEraSettings) ? deepCloneJson(latest.remoteEraSettings, []) : [],
        genres: Array.isArray(latest.remoteGenres) ? deepCloneJson(latest.remoteGenres, []) : []
      };

      const ok = await saveToGitHub(payload, latest.remoteSha || null);
      if (!ok) return false;

      try { setOrderChanged(false); } catch (_e) {}
      await clearAllDataAndReloadWithoutConfirm({ preserveGenreSelection: true });
      return true;
    } catch (e) {
      console.error('saveReorderedYearToGitHubAndReload エラー:', e);
      showError('保存エラー', `並べ替え結果の保存に失敗しました: ${e.message}`);
      return false;
    }
  }

function extractSpreadsheetId(input) {
  if (!input) return '';
  const trimmed = input.trim();

  const urlMatch = trimmed.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);

  async function fetchJsonFromSources(sources) {
    let lastErr = null;
    for (let si = 0; si < sources.length; si++) {
      try {
        const resp = await fetch(sources[si], { cache: 'no-cache' });
        if (!resp.ok) throw new Error(String(resp.status));
        return await resp.json();
      } catch (e) {
        lastErr = e;
      }
    }
    if (lastErr) throw lastErr;
    throw new Error('xnative_link_map.json unavailable');
  }

  async function fetchAuthorXnativeLinkMap(gh) {
    const owner = normalizeGithubLogin(gh);
    if (!owner) throw new Error('missing GitHub id');
    const cacheKey = 'gh:' + owner.toLowerCase();
    if (linkMapCacheByKey[cacheKey]) return linkMapCacheByKey[cacheKey];
    if (linkMapFetchPromiseByKey[cacheKey]) return linkMapFetchPromiseByKey[cacheKey];
    linkMapFetchPromiseByKey[cacheKey] = (async () => {
      const map = await fetchJsonFromSources([authorLinkMapRawUrl(owner)]);
      linkMapCacheByKey[cacheKey] = map;
      return map;
    })();
    try {
      return await linkMapFetchPromiseByKey[cacheKey];
    } finally {
      linkMapFetchPromiseByKey[cacheKey] = null;
    }
  }

  function lookupLinkMapParams(map, id) {
    if (!map || !id) return '';
    const key = String(id).trim().toLowerCase();
    if (map.entries && map.entries[key]) {
      const entry = map.entries[key];
      if (typeof entry === 'string') return entry;
      return String(entry.params || entry.query || entry.q || '');
    }
    // entries のキーは大文字小文字を無視して再検索
    if (map.entries) {
      const keys = Object.keys(map.entries);
      for (let i = 0; i < keys.length; i++) {
        if (String(keys[i]).toLowerCase() === key) {
          const entry = map.entries[keys[i]];
          if (typeof entry === 'string') return entry;
          return String(entry.params || entry.query || entry.q || '');
        }
      }
    }
    if (map[key] && typeof map[key] === 'string') return map[key];
    return '';
  }

  function composeLinkQueryString(baseParams, defaults) {

    if (defaults) {

      });
    }
    if (baseParams) {
      new URLSearchParams(String(baseParams).replace(/^\?/, '')).forEach((v, k) => {

      });
    }
    return params.toString();
  }

    if (!m) return '';
    const baseParams = lookupLinkMapParams(map, m[1]);
    if (!baseParams) return '';
    return composeLinkQueryString(baseParams, Object.assign({}, defaults || {}, { y: m[2] }));

  // URLパラメーターからスナップショットを読み込む機能
  async function loadSnapshotFromUrlParam() {
    const urlParams = getUrlParams();
    const snapshotFileParam = urlParams.snapshot || urlParams.snapshotPath;
    if (!snapshotFileParam) {
      return; // 対象パラメータがない場合は何もしない
    }

    try {
      // snapshotURL は廃止。snapshot/snapshotpath + (snapshotowner/snapshotrepo) で取得する
      const targetOwner = (urlParams.snapshotOwner || githubConfig.owner || '').trim();
      const targetRepo = (urlParams.snapshotRepo || githubConfig.repo || '').trim();
      if (!targetOwner || !targetRepo) {
        throw new Error('snapshotowner/snapshotrepo もしくは年表の owner/repo が未設定です。');
      }

      // snapshot は data フォルダ配下の相対パスとして扱う
      let safeName = String(snapshotFileParam || '')
        .replace(/\\/g, '/')
        .replace(/^\/+/, '')
        .replace(/\.\./g, '');
      if (safeName.toLowerCase().startsWith('data/')) {
        safeName = safeName.slice(5);
      }
      const encodedName = safeName
        .split('/')
        .filter(Boolean)
        .map(seg => encodeURIComponent(seg))
        .join('/');
      const fetchTarget = `https://raw.githubusercontent.com/${encodeURIComponent(targetOwner)}/${encodeURIComponent(targetRepo)}/main/data/${encodedName}`;
      const sourceLabel = `${targetOwner}/${targetRepo}:data/${safeName}`;

      const response = await fetch(fetchTarget, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);

  function normalizeEraSettingsList(list){
    if (!Array.isArray(list)) return [];
    return list.map(era => {
      if (!era || typeof era !== 'object') return era;
      const out = { ...era };
      const keyMap = {};
      const keyMapNorm = {};
      const normalizeKey = (k) => String(k).toLowerCase().replace(/[\s_\-]/g, '');
      try {
        Object.keys(era).forEach(k => {
          const lower = String(k).toLowerCase();
          keyMap[lower] = k;
          keyMapNorm[normalizeKey(k)] = k;
        });
      } catch(_e) {}
      const getField = (candidates) => {
        for (const c of candidates) {
          const lower = String(c).toLowerCase();
          const k = keyMap[lower];
          if (k != null && Object.prototype.hasOwnProperty.call(era, k)) return era[k];
          const kn = keyMapNorm[normalizeKey(c)];
          if (kn != null && Object.prototype.hasOwnProperty.call(era, kn)) return era[kn];
        }
        return undefined;
      };
      const startVal = getField(['startYear','start_year','start','beginYear','begin','from']);
      const endVal = getField(['endYear','end_year','end','finishYear','finish','to']);
      const startRaw = (startVal !== undefined && startVal !== null) ? String(startVal).trim()
        : ((era.startYear !== undefined && era.startYear !== null) ? String(era.startYear).trim() : '');
      if (startRaw) {
        const n = parseInt(startRaw, 10);
        out.startYear = Number.isFinite(n) ? n : '';
      } else {
        out.startYear = '';
      }
      const endRaw = (endVal !== undefined && endVal !== null) ? String(endVal).trim()
        : ((era.endYear !== undefined && era.endYear !== null) ? String(era.endYear).trim() : '');
      if (endRaw) {
        if (endRaw.toLowerCase() === 'ongoing') {
          out.endYear = 'ongoing';
        } else {
          const n = parseInt(endRaw, 10);
          out.endYear = Number.isFinite(n) ? n : '';
        }
      } else {
        out.endYear = '';
      }
      return out;
    });
  }

  // すべての時代区分を登録（メイン年表のジャンルが「時代区分」の項目を対象、参照年表は除外）
  function registerAllEraFromMain() {
    try {
      // いま開いている入力値を取り込み（未入力も保持）
      try { eraSettings = collectEraSettingsFromDOM(true); } catch (_e) {}

      // 利用可能な色パレット（個別登録と整合）
      const availableColors = [
        '#4169E1', '#32CD32', '#DC143C', '#FF8C00', 
        '#8A2BE2', '#00CED1', '#FFD700', '#696969',
        '#FF69B4', '#00FF7F', '#FF4500', '#9370DB',
        '#20B2AA', '#FFA500', '#FF1493', '#32CD32'
      ];
      const usedColors = eraSettings.map(era => era.color).filter(Boolean);
      const nameToColor = new Map();

      const pickColorFor = (name) => {
        if (nameToColor.has(name)) return nameToColor.get(name);
        // 未使用の色を優先採用
        let c = availableColors.find(col => !usedColors.includes(col));
        if (!c) {
          // すべて使用済みの場合は名前のハッシュで安定選択
          let h = 0; for (let i=0;i<name.length;i++){ h = ((h<<5)-h) + name.charCodeAt(i); h|=0; }
          const idx = Math.abs(h) % availableColors.length;
          c = availableColors[idx];
        }
        usedColors.push(c);
        nameToColor.set(name, c);
        return c;
      };

      const ERA_GENRE_CODES = (function resolveEraCodes(){
        const out = new Set();
        if (window.GENRE_ERA_FLAGS) {
          for (const code of Object.keys(window.GENRE_ERA_FLAGS)) {
            if (window.GENRE_ERA_FLAGS[code] === true) out.add(String(code).toUpperCase());
          }
        }
        return out;
      })();

      if (!ERA_GENRE_CODES || ERA_GENRE_CODES.size === 0) {
        showError('登録不可', 'genre_era=true のジャンルが見つかりません。ジャンル定義をご確認ください。');
        return;
      }

      // 既存の重複回避用キー（name+start+end）
      const existKeys = new Set(
        (eraSettings||[]).map(e=>`${e.name}|${e.startYear}|${e.endYear}`)
      );

      let added = 0;
      for (const [yearStr, items] of Object.entries(events)) {
        const y = parseInt(yearStr,10);
        if (!Array.isArray(items)) continue;
        for (const it of items) {
          if (!it || it._source === 'ref') continue; // 参照年表は対象外
          const g = it.genre;
          const hasEra = Array.isArray(g)
            ? g.map(x=>String(x).toUpperCase()).some(c => ERA_GENRE_CODES.has(c))
            : ERA_GENRE_CODES.has(String(g||'').toUpperCase());
          if (!hasEra) continue;

          const startYear = it.startYear ? it.startYear : y;
          const endYear = (it.endYear=== 'ongoing') ? 'ongoing' : (it.endYear ? it.endYear : y);
          const name = it.label + (it.genre ? ` [${Array.isArray(it.genre)? it.genre.join('・') : it.genre}]` : '');
          const key = `${name}|${startYear}|${endYear}`;
          if (existKeys.has(key)) continue;

          const newEra = {
            name,
            startYear,
            endYear,
            color: pickColorFor(name),
            opacity: '0.3',
            enabled: true,      // 表示ON
            fillEnabled: true   // 塗りON
          };
          eraSettings.unshift(newEra);
          existKeys.add(key);
          added++;
        }
      }

      saveEvents();
      renderEraBackgrounds();
      showEraSettingsModal();
      showInfo('登録完了', `${added}件の時代区分を登録しました。（表示・塗りをON）`);
    } catch (e) {
      console.error('registerAllEraFromMain エラー:', e);
      showError('エラー', `一括登録でエラーが発生しました: ${e && e.message ? e.message : e}`);
    }
  }

  function collectEraSettingsFromDOM(keepEmpty = false) {
    const collected = [];
    const nameInputs = document.querySelectorAll('[id^="eraName"]');
    nameInputs.forEach(nameInput => {
      const nameRaw = nameInput.value;
      const name = (nameRaw || '').trim();
      const index = nameInput.id.replace('eraName', '');
      const enabled = document.getElementById(`eraEnabled${index}`)?.checked ?? true;
      const fillEnabled = document.getElementById(`eraFill${index}`)?.checked ?? true;
      const startYearStr = document.getElementById(`eraStart${index}`)?.value?.trim();
      const endYearStr = document.getElementById(`eraEnd${index}`)?.value?.trim();
      const endOngoing = document.getElementById(`eraEndOngoing${index}`)?.checked ?? false;
      const color = document.getElementById(`eraColor${index}`)?.value || '#4169E1';
      const opacity = document.getElementById(`eraOpacity${index}`)?.value || '0.3';

      const startYear = startYearStr ? parseInt(startYearStr, 10) : '';
      let endYear = endYearStr ? parseInt(endYearStr, 10) : '';
      if (endOngoing) endYear = 'ongoing';

      if (keepEmpty || name) {
        collected.push({ name, startYear, endYear, color, opacity, enabled, fillEnabled });
      }
    });

      if (yearElements.length === 0) continue; // DOM要素が存在しない場合はスキップ
      
      for (const res of byYear[year]) {
        const label = currentLang === 'en'
          ? (res.labelEn || res.labelJa || '')
          : (res.labelJa || res.labelEn || '');
        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        const t = document.createElementNS('http://www.w3.org/2000/svg','text');
        t.textContent = label;
        t.setAttribute('x', x + 8);
        t.setAttribute('y', yCenter);
        t.setAttribute('dominant-baseline','middle');
        t.setAttribute('fill', '#111');
        t.setAttribute('font-size', '12');
        const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
        r.setAttribute('x', x);
        r.setAttribute('y', yCenter - 12);
        r.setAttribute('rx', 6);
        r.setAttribute('ry', 6);
        r.setAttribute('height', 24);
        r.setAttribute('fill', '#e8f4fd');
        r.setAttribute('stroke', '#007bff');
        r.setAttribute('stroke-width', '2');
        g.appendChild(r);
        g.appendChild(t);
        searchResultsG.appendChild(g);
        const bbox = t.getBBox();
        const w = Math.min(300, Math.max(24, bbox.width + 16));
        r.setAttribute('width', w);
        
        const openTabMode = !!(res.item && isOpenTabBehavior(res.item));
        // マウスオーバーでウェブ画面を開く（詳細一覧の「地球」マークと同じ挙動）
        if (!openTabMode && res.item && (res.item.url || res.item.url_en)) {
          // マウスオーバーイベント
          const handleMouseEnter = (e) => {
            startDelayedHoverPreview(res.item, g);
          };
          
          const handleMouseLeave = (e) => {
            handlePreviewHoverLeaveCommon();
          };
          
          // SVG要素にイベントリスナーを追加（gのみ。子要素ごとの重複発火を避ける）
          g.addEventListener('mouseenter', handleMouseEnter);
          g.addEventListener('mouseleave', handleMouseLeave);
          
          // カーソルをポインターに変更
          g.style.cursor = 'pointer';
          r.style.cursor = 'pointer';
          t.style.cursor = 'pointer';
        } else if (openTabMode && res.item && (res.item.url || res.item.url_en)) {
          g.style.cursor = 'pointer';
          r.style.cursor = 'pointer';
          t.style.cursor = 'pointer';
        }
        
        // ダブルクリックで編集モーダル（検索結果の注釈有無に依存しない）
        if (res.item && !openTabMode) {
          const handleDblClick = (e) => {
            e.stopPropagation();
            if (typeof isEditMode !== 'undefined' && !isEditMode) return;
            if (res.item && res.item._source === 'ref') return;
            try {
              if (typeof showEditModal === 'function') {
                showEditModal(res.year, res.index ?? -1, res.item);
              }
            } catch(_e){}
          };
          g.addEventListener('dblclick', handleDblClick);
          r.addEventListener('dblclick', handleDblClick);
          t.addEventListener('dblclick', handleDblClick);
        }

        // open_tab モードではクリックで常に新しいタブを開く
        if (openTabMode && res.item && (res.item.url || res.item.url_en)) {
          const handleClickOpen = (e) => {
            e.stopPropagation();
            openUrl(res.item);
          };
          g.addEventListener('click', handleClickOpen);
          r.addEventListener('click', handleClickOpen);
          t.addEventListener('click', handleClickOpen);
        // 通常モードはクリックで注釈をポップアップ表示
        } else if (res.item && (res.item.note || res.item.note_en)) {
          const handleClick = (e) => {
            e.stopPropagation();
            showNotePopup(res.item, g);
          };
          
          const handleMouseLeaveForNote = (e) => {
            // マウスが外れたら注釈ポップアップを閉じる
            if (currentNotePopupElement === g) {
              searchResultNotePopup.style.display = 'none';
              currentNotePopupElement = null;
            }
          };
          
          // クリックイベントを追加
          g.addEventListener('click', handleClick);
          r.addEventListener('click', handleClick);
          t.addEventListener('click', handleClick);
          
          // マウスが外れたときに注釈ポップアップを閉じる
          g.addEventListener('mouseleave', handleMouseLeaveForNote);
          r.addEventListener('mouseleave', handleMouseLeaveForNote);
          t.addEventListener('mouseleave', handleMouseLeaveForNote);
        }
        
        x += w + 8;
      }
    }
  }

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/'/g, '&#39;');
  }
  function eventDomTarget(e) {
    const t = e && e.target;
    if (!t) return null;
    return t.nodeType === 1 ? t : t.parentElement;
  }

  function shouldSuppressEditorOutsideClose(editorEl) {
    if (!editorEl) return false;
    try {
      const active = document.activeElement;
      if (active && editorEl.contains(active) && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
        const start = active.selectionStart;
        const end = active.selectionEnd;
        if (start != null && end != null && start !== end) return true;
      }
    } catch (_e) {}
    try {
      const sel = window.getSelection && window.getSelection();
      if (sel && !sel.isCollapsed && String(sel).length > 0) {
        const anchor = sel.anchorNode;
        if (anchor) {
          const el = anchor.nodeType === 3 ? anchor.parentElement : anchor;
          if (el && editorEl.contains(el)) return true;
        }
      }
    } catch (_e) {}
    return false;
  }

  function attachEditorOutsideCloseSelectionGuard(editorEl) {
    let gestureActive = false;
    const onMouseDown = (e) => {
      e.stopPropagation();
      gestureActive = true;
    };
    const onMouseUp = () => {
      setTimeout(function(){ gestureActive = false; }, 0);
    };
    editorEl.addEventListener('mousedown', onMouseDown);
    document.addEventListener('mouseup', onMouseUp);
    return {
      shouldSuppress: function() {
        return gestureActive || shouldSuppressEditorOutsideClose(editorEl);
      },
      detach: function() {
        editorEl.removeEventListener('mousedown', onMouseDown);
        document.removeEventListener('mouseup', onMouseUp);
        gestureActive = false;
      }
    };
  }

  // ===== 詳細一覧表示 =====
  function eventGenresEqual(a, b) {
    const norm = (g) => Array.isArray(g)
      ? g.map(x => String(x).toUpperCase()).sort().join('・')
      : String(g || '').toUpperCase();
    return norm(a) === norm(b);
  }
  function eventItemsEquivalent(a, b) {
    if (!a || !b) return false;
    if ((a.label || '') !== (b.label || '')) return false;
    if ((a.label_en || '') !== (b.label_en || '')) return false;
    if (String(a.startYear ?? '') !== String(b.startYear ?? '')) return false;
    return eventGenresEqual(a.genre, b.genre);
  }
  function resolveEventsYearKey(year) {
    if (events[year] != null) return year;
    const s = String(year);
    if (events[s] != null) return s;
    const n = Number(year);
    if (Number.isFinite(n) && events[n] != null) return n;
    return year;
  }
  function findEventItemIndex(yearKey, item) {
    const allItems = events[yearKey] || [];
    const byRef = allItems.indexOf(item);
    if (byRef >= 0) return byRef;
    return allItems.findIndex(orig => eventItemsEquivalent(orig, item));
  }

  function getDetailListItemFromElement(el) {
    const container = el && el.closest ? el.closest('.detail-item') : null;
    if (!container) return null;
    const yearKey = resolveEventsYearKey(container.getAttribute('data-year'));
    const index = Number(container.getAttribute('data-index'));
    if (!Number.isInteger(index) || index < 0) return null;
    const items = events[yearKey] || [];
    const item = items[index];
    if (!item) return null;
    return { yearKey, index, item };
  }

  function getDetailListItemFromButton(btn) {
    return getDetailListItemFromElement(btn);
  }

  // ===== X コメント連動（Phase 2: 共有パネル + 投稿 intent + 検索リンク） =====
  const X_COMMENT_BASE_HASHTAG = 'XnativeTimeline';

  function normalizeWebLinkBehavior(raw) {
    const v = String(raw || '').trim().toLowerCase().replace(/[\s-]+/g, '_');
    if (!v) return 'hover';
    const openTabValues = new Set([
      'open_tab',
      'opentab',
      'open_in_new_tab',
      'new_tab',
      'external',
      'external_only',
      'click_open',
      'no_preview',
      'no_hover'
    ]);
    return openTabValues.has(v) ? 'open_tab' : 'hover';
  }

  function getMainTimelineWebLinkBehavior() {
    const meta = (window.currentData && window.currentData.metadata) || {};
    const raw = meta.webLinkBehavior || meta.web_link_behavior || meta.webPreviewMode || meta.web_preview_mode || '';
    return normalizeWebLinkBehavior(raw);
  }

  function getItemWebLinkBehavior(item) {
    if (item && item._source === 'ref') {
      return normalizeWebLinkBehavior(item._refWebLinkBehavior || '');
    }
    return getMainTimelineWebLinkBehavior();
  }

  function isOpenTabBehavior(item) {
    return getItemWebLinkBehavior(item) === 'open_tab';
  }

  function getItemShareSourceContext(item) {
    const isRef = !!(item && item._source === 'ref');
    // 参照年表（GitHub）の項目は、メインがローカルJSONでもX共有を許可する
    if (isRef) {
      const sourceType = String(item._refSourceType || '').toLowerCase();
      const owner = String(item._refOwner || '').trim();
      const repo = String(item._refRepo || '').trim();
      const filePath = String(item._refFilePath || '').trim();
      return {
        supported: (sourceType === 'github' && !!owner && !!repo && !!filePath),
        reason: (sourceType === 'github') ? '' : 'unsupported_ref_source',
        isRef: true,
        sourceType: sourceType || 'unknown',
        owner,
        repo,
        filePath,
        xHashtag: String(item._refXHashtag || '').trim(),
        xLinkId: String(item._refXLinkId || '').trim(),
        shareBaseUrl: String(item._refShareBaseUrl || '').trim(),
        webLinkBehavior: normalizeWebLinkBehavior(item._refWebLinkBehavior || '')
      };
    }
    if (isLocalDataMode()) {
      return {
        supported: false,
        reason: 'local',
        isRef: false
      };
    }
    const owner = String((githubConfig && githubConfig.owner) || '').trim();
    const repo = String((githubConfig && githubConfig.repo) || '').trim();
    const filePath = String((githubConfig && githubConfig.filePath) || '').trim();
    return {
      supported: !isLocalDataMode() && !!owner && !!repo && !!filePath,
      reason: (!owner || !repo || !filePath) ? 'missing_main_source' : '',
      isRef: false,
      sourceType: 'github',
      owner,
      repo,
      filePath,
      xHashtag: '',
      xLinkId: '',
      shareBaseUrl: '',
      webLinkBehavior: getMainTimelineWebLinkBehavior()
    };
  }

  function getTimelineXContext(item) {
    const ctxSrc = getItemShareSourceContext(item);
    const meta = (window.currentData && window.currentData.metadata) || {};
    const refTagRaw = ctxSrc && ctxSrc.xHashtag ? ctxSrc.xHashtag : '';
    let timelineTag = String(refTagRaw || meta.xHashtag || meta.x_hashtag || '').trim().replace(/^#/, '');
    const fp = (ctxSrc && ctxSrc.filePath) ? ctxSrc.filePath : (githubConfig && githubConfig.filePath);
    if (!timelineTag && fp) {
      const m = String(fp).match(/timeline_([a-z0-9_]+)\.json/i);
      if (m && m[1]) timelineTag = m[1].replace(/_/g, '');
    }
    return { baseTag: X_COMMENT_BASE_HASHTAG, timelineTag: timelineTag };
  }

  function buildXItemRefTag(yearKey, index) {
    return 'y' + String(yearKey).replace(/[^\d]/g, '') + 'i' + String(index);
  }

  function buildXItemTagLine(yearKey, index, item) {
    const ctx = getTimelineXContext(item);
    return '#' + ctx.baseTag;
  }

  function buildXItemSearchQuery(yearKey, index, item) {
    const parts = [buildXItemTagLine(yearKey, index, item)];
    const label = getItemShareLabel(item);
    if (label) parts.push(label);
    return parts.join(' ');
  }

  function getTimelineLinkId(item) {
    const ctxSrc = getItemShareSourceContext(item);
    const meta = (window.currentData && window.currentData.metadata) || {};
    let id = String((ctxSrc && ctxSrc.xLinkId) || meta.xLinkId || meta.x_link_id || '').trim();
    if (!id && meta.xHashtag) id = String(meta.xHashtag).replace(/^#/, '');
    const fp = (ctxSrc && ctxSrc.filePath) ? ctxSrc.filePath : (githubConfig && githubConfig.filePath);
    if (!id && fp) {
      const m = String(fp).match(/timeline_([a-z0-9_]+)\.json/i);
      if (m && m[1]) id = m[1].replace(/_/g, '');
    }
    return id ? id.toLowerCase() : 'timeline';
  }

  function normalizeShareLabel(text) {
    return String(text || '').trim().normalize('NFC');
  }

  function getItemLinkLabel(item) {
    const ja = normalizeShareLabel(item && item.label);
    if (ja) return ja;
    return normalizeShareLabel(item && item.label_en);
  }

  function labelLookupKey(label) {
    const s = normalizeShareLabel(label);
    if (!s) return '';
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(16).padStart(8, '0');
  }

  function findEventItemIndexByLabelKey(yearKey, lk) {
    const key = String(lk || '').trim().toLowerCase();
    if (!key) return -1;
    const items = events[yearKey];
    if (!Array.isArray(items)) return -1;
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item) continue;
      if (labelLookupKey(item.label) === key) return i;
      if (item.label_en && labelLookupKey(item.label_en) === key) return i;
    }
    return -1;
  }

  function findEventItemIndexByLabel(yearKey, labelText) {
    const items = events[yearKey];
    const target = normalizeShareLabel(labelText);
    if (!Array.isArray(items) || !target) return -1;
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (!item) continue;
      if (normalizeShareLabel(item.label) === target) return i;
      if (normalizeShareLabel(item.label_en) === target) return i;
    }
    return -1;
  }

  function buildXItemLinkId(yearKey, item) {
    return getTimelineLinkId(item) + '-y' + String(yearKey);
  }

  function getXnativeShareAppBase(item) {
    const ctxSrc = getItemShareSourceContext(item);
    const meta = (window.currentData && window.currentData.metadata) || {};
    const configured = String((ctxSrc && ctxSrc.shareBaseUrl) || meta.shareBaseUrl || meta.share_url || '').trim();
    if (configured && /^https?:\/\//i.test(configured)) {
      try {
        const u = new URL(configured);
        return u.origin + u.pathname;
      } catch (_e) {}
    }
    try {
      const here = new URL(window.location.href);
      if (/^https?:$/i.test(here.protocol)) return here.origin + here.pathname;
    } catch (_e) {}
    return 'https://xnative.pages.dev';
  }

  function buildXDeepLink(yearKey, index, item) {
    const src = getItemShareSourceContext(item);
    if (!src.supported) return '';
    const base = getXnativeShareAppBase(item);
    const params = new URLSearchParams();
    const baseId = getTimelineLinkId(item);
    const owner = normalizeGithubLogin(src.owner);
    if (owner && baseId) {
      // 主経路: GitHub ID + 短い年表キー（作者の xnative-timeline リポの link map で解決）
      params.set('gh', owner);
      params.set('t', buildXItemLinkId(yearKey, item));
    } else {
      params.set('owner', src.owner);
      params.set('repo', src.repo);
      params.set('filePath', src.filePath);
      params.set('y', String(yearKey));
    }
    const lk = labelLookupKey(getItemLinkLabel(item));
    if (lk) params.set('lk', lk);
    return base + '?' + params.toString();
  }

  function buildXSearchUrl(yearKey, index, item) {
    const q = buildXItemSearchQuery(yearKey, index, item);
    const host = (typeof isMobileExperience === 'function' && isMobileExperience())
      ? 'https://twitter.com'
      : 'https://x.com';
    return host + '/search?q=' + encodeURIComponent(q) + '&src=typed_query&f=live';
  }

  function getItemShareLabel(item) {
    return (currentLang === 'en' && item && item.label_en) ? item.label_en : (item && item.label) || '';
  }

  function buildSharePostText(yearKey, index, item) {
    const label = getItemShareLabel(item);
    const tagLine = buildXItemTagLine(yearKey, index, item);
    const textParts = [];
    if (label) textParts.push(label);
    textParts.push('');
    textParts.push(tagLine);
    return textParts.join('\n');
  }

  function buildShareCopyText(yearKey, index, item) {
    const label = getItemShareLabel(item);
    const link = buildXDeepLink(yearKey, index, item);
    if (label && link) return label + '\n\n' + link;
    if (label) return label;
    return link || '';
  }

  function buildXPostIntentUrl(yearKey, index, item) {
    const link = buildXDeepLink(yearKey, index, item);
    const params = new URLSearchParams();
    params.set('text', buildSharePostText(yearKey, index, item));
    if (link) params.set('url', link);
    return 'https://twitter.com/intent/tweet?' + params.toString();
  }

  let xDeepLinkHandled = false;
  function tryOpenXDeepLinkFromUrl() {
    if (xDeepLinkHandled) return;
    try {
      const params = new URLSearchParams(window.location.search);
      const yearRaw = params.get('y') || params.get('xYear');
      const lk = params.get('lk') || '';
      const itemLabel = params.get('itemLabel') || params.get('xl') || '';
      if (yearRaw == null) return;
      if (!lk && !String(itemLabel).trim()) return;
      const yearKey = resolveEventsYearKey(yearRaw);
      let idx = -1;
      if (lk) idx = findEventItemIndexByLabelKey(yearKey, lk);
      if (idx < 0 && itemLabel) idx = findEventItemIndexByLabel(yearKey, itemLabel);
      xDeepLinkHandled = true;
      setTimeout(function() {
        if (typeof showDetailList === 'function') showDetailList(yearKey, null, false);
        if (idx < 0) return;
        const items = events[yearKey];
        if (!Array.isArray(items) || !items[idx]) return;
        if (typeof openItemDetailPanel === 'function') openItemDetailPanel(yearKey, idx, items[idx]);
      }, 400);

  function ensureItemDetailPanel() {
    if (itemDetailPanelEl) return itemDetailPanelEl;

  function positionItemDetailPanelNearEditor() {
    const panel = itemDetailPanelEl;
    if (!panel) return;
    if (typeof isMobileExperience === 'function' && isMobileExperience()) {
      applyItemDetailPanelMobileLayout(panel);
      return;
    }
    const margin = 12;
    const panelW = panel.offsetWidth || 420;
    const panelH = panel.offsetHeight || 320;
    let left = Math.round((window.innerWidth - panelW) / 2);
    let top = Math.round((window.innerHeight - panelH) / 2);
    if (editor && editor.style.display === 'block') {
      const er = editor.getBoundingClientRect();
      left = er.right + margin;
      top = er.top;
      if (left + panelW > window.innerWidth - margin) {
        left = Math.max(margin, er.left - panelW - margin);
      }
      if (top + panelH > window.innerHeight - margin) {
        top = Math.max(margin, window.innerHeight - panelH - margin);
      }
    }
    panel.style.left = Math.max(margin, left) + 'px';
    panel.style.top = Math.max(margin, top) + 'px';
    panel.style.transform = 'none';

  function openItemDetailPanel(yearKey, index, item) {
    if (!item) return;
    closeItemSharePanel();
    const panel = ensureItemDetailPanel();
    const label = (currentLang === 'en' && item.label_en) ? item.label_en : (item.label || '');
    const note = (currentLang === 'en' && item.note_en) ? item.note_en : (item.note || '');
    const urlInfo = getItemDisplayUrlLists(item);
    const noteHeading = currentLang === 'en' ? 'Note' : '注釈';
    const urlHeading = currentLang === 'en' ? 'URLs' : 'URL';

  function copyTextToClipboard(text) {
    return new Promise(function(resolve) {
      if (!text) { resolve(false); return; }
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        navigator.clipboard.writeText(text).then(function() { resolve(true); }).catch(function() {
          resolve(copyTextToClipboardFallback(text));
        });
        return;
      }
      resolve(copyTextToClipboardFallback(text));
    });
  }

  function copyTextToClipboardFallback(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return !!ok;
    } catch (_e) {
      return false;
    }
  }

  function buildPopupWindowFeatures(width, height) {
    const vw = (window.screen && window.screen.availWidth) ? window.screen.availWidth : 1280;
    const vh = (window.screen && window.screen.availHeight) ? window.screen.availHeight : 800;
    const w = Math.min(width, Math.max(320, vw - 24));
    const h = Math.min(height, Math.max(240, vh - 48));
    const left = Math.max(0, Math.round((vw - w) / 2));
    const top = Math.max(0, Math.round((vh - h) / 2));
    return 'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',scrollbars=yes,resizable=yes';
  }

  function openExternalUrlInNamedWindow(url, windowName, width, height) {
    if (!url || !/^https?:\/\//i.test(String(url))) return null;
    const features = buildPopupWindowFeatures(width, height);
    try {
      const w = window.open(url, windowName, features);
      if (w) {
        try { if (typeof w.focus === 'function') w.focus(); } catch (_e) {}
        return w;
      }
    } catch (_e) {}
    return null;
  }

  function openExternalUrl(url) {
    if (!url || !/^https?:\/\//i.test(String(url))) return;
    function viaAnchor() {
      try {
        const a = document.createElement('a');
        a.href = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(function() { try { a.remove(); } catch (_e2) {} }, 0);
      } catch (_e3) {
        window.location.href = url;
      }
    }
    if (typeof isMobileExperience === 'function' && isMobileExperience()) {
      viaAnchor();
      return;
    }
    try {
      const w = window.open(url, '_blank', 'noopener,noreferrer');
      if (w) return;
    } catch (_e) {}
    viaAnchor();
  }

  function computeDetailListAge(eventYear, birthYear) {
    const ey = Number(eventYear);
    const by = Number(birthYear);
    if (!Number.isFinite(ey) || !Number.isFinite(by)) return null;
    return Math.max(0, Math.min(AGE_MAX, ey - by));
  }

    const age = computeDetailListAge(eventYear, birthYear);

    const by = Number(birthYear);
    if (currentLang === 'en') return age + ' yrs';
    return age + '歳';

      saveEvents();

    birthInput.value = detailListBirthYear != null ? String(detailListBirthYear) : '';
    function refreshDetailListAgeDisplay() {
      const raw = String(birthInput.value || '').trim();
      if (raw === '') {
        saveDetailListBirthYear(null);
        ageSummary.textContent = '';
        return;
      }
      const by = parseInt(raw, 10);
      if (!Number.isFinite(by)) {
        ageSummary.textContent = '';
        return;
      }
      saveDetailListBirthYear(by);
      ageSummary.textContent = formatDetailListAgeText(eventYear, by);

    birthInput.addEventListener('change', refreshDetailListAgeDisplay);

  // ===== ドラッグ&ドロップ機能 =====
  // エディタのドラッグ移動
  function enableEditorDrag(){
    const handle = document.getElementById('editorDragHandle');
    if (!handle) return;
    let dragging = false;
    let startX = 0, startY = 0, baseLeft = 0, baseTop = 0;
    const onMouseDown = (e)=>{
      // エディタ閉じる判定へ伝播しない
      e.stopPropagation();
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      baseLeft = parseInt(editor.style.left||'0',10) || 0;
      baseTop = parseInt(editor.style.top||'0',10) || 0;
      document.body.classList.add('dragging');
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    };
    const onMouseMove = (e)=>{
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      editor.style.left = (baseLeft + dx) + 'px';
      editor.style.top = (baseTop + dy) + 'px';
    };
    const onMouseUp = ()=>{
      dragging = false;
      document.body.classList.remove('dragging');
      window.removeEventListener('mousemove', onMouseMove);
      window.removeEventListener('mouseup', onMouseUp);
    };
    handle.addEventListener('mousedown', onMouseDown);
  }
  function setupDragAndDrop(year) {
    const container = document.getElementById('detailListContainer');
    if (!container) return;
    
    let draggedElement = null;
    let draggedIndex = null;
    
    // ドラッグ開始
    container.addEventListener('dragstart', (e) => {
      if (e.target.closest('button')) {
        e.preventDefault();
        return;
      }
      if (e.target.classList.contains('detail-item')) {
        draggedElement = e.target;
        draggedIndex = parseInt(e.target.dataset.index);
        e.target.style.opacity = '0.5';
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/html', e.target.outerHTML);
      }
    });
    
    // ドラッグ終了
    container.addEventListener('dragend', (e) => {
      if (e.target.classList.contains('detail-item')) {
        e.target.style.opacity = '';
        draggedElement = null;
        draggedIndex = null;
      }
    });
    
    // ドラッグオーバー
    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      
      const afterElement = getDragAfterElement(container, e.clientY);
      if (afterElement == null) {
        container.appendChild(draggedElement);
      } else {
        container.insertBefore(draggedElement, afterElement);
      }
    });
    
    // ドロップ
    container.addEventListener('drop', (e) => {
      e.preventDefault();
      
      if (draggedElement && draggedIndex !== null) {
        const newIndex = Array.from(container.children).indexOf(draggedElement);
        
        if (newIndex !== draggedIndex) {
          // 項目の順序を変更
          const items = events[year] || [];
          const item = items.splice(draggedIndex, 1)[0];
          items.splice(newIndex, 0, item);
          
          // 順番変更フラグを設定
          setOrderChanged(true);
          // 直近の順序変更対象を記録（シートジャンプ用）
          try { lastOrderChangeFocus = { year, item }; } catch(_e){}
          
          renderEvents();
          // 順序変更は閉じる時に保存（一覧は更新）
          showDetailList(year, null, true);
        }
      }
    });
  }
  
  // ドラッグ後の要素位置を取得
  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.detail-item:not(.dragging)')];
    
    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }

  let embedBlockedUrlSet = new Set();

  function normalizeEmbedUrlKey(targetUrl) {
    const parsed = parseAmazonUrlWithImage(String(targetUrl || '').trim());
    const raw = parsed.amazonUrl || String(targetUrl || '').trim();
    try {
      const u = new URL(raw);
      u.hash = '';
      let path = u.pathname || '/';
      if (path.length > 1 && path.endsWith('/')) path = path.slice(0, -1);
      return (u.origin + path + u.search).toLowerCase();
    } catch (_e) {
      return raw.toLowerCase();
    }
  }

  function mergeEmbedBlockCache(payload) {
    if (!payload) return;
    const urls = payload.blockedUrls || payload.urls || [];
    urls.forEach(function(u) {
      if (u) embedBlockedUrlSet.add(normalizeEmbedUrlKey(u));
    });
    const patterns = payload.blockedHostPatterns || [];
    patterns.forEach(function(p) {
      try {
        embedBlockedHostRes.push(new RegExp(p, 'i'));
      } catch (_e) {}
    });
  }

  function resetEmbedBlockCache() {
    embedBlockedUrlSet = new Set();
    embedBlockedHostRes = [];
  }

  function getCompanionEmbedBlocklistPath(sourcePath) {
    const raw = String(sourcePath || '').trim();
    if (!raw || !/\.json(\?.*)?$/i.test(raw)) return '';
    return raw.replace(/\.json(\?.*)?$/i, '_embed.json$1');
  }

  async function fetchCompanionEmbedBlocklist(sourcePath) {
    const embedPath = getCompanionEmbedBlocklistPath(sourcePath);
    if (!embedPath || embedPath === sourcePath) return false;
    try {
      const res = await fetch(embedPath, { cache: 'no-store' });
      if (!res.ok) return false;
      const data = await parseJsonUtf8Response(res, 'embed blocklist');
      mergeEmbedBlockCache(data);
      console.log('埋め込み不可URLリストを読み込み:', embedPath, 'blocked=', data.blockedCount || (data.blockedUrls || []).length);
      return true;
    } catch (_e) {
      return false;
    }
  }

  async function refreshEmbedBlockCache(timelineData, sourcePath) {
    resetEmbedBlockCache();
    if (timelineData && timelineData.metadata && timelineData.metadata.embedBlocklist) {
      mergeEmbedBlockCache(timelineData.metadata.embedBlocklist);
    }
    const loaded = await fetchCompanionEmbedBlocklist(sourcePath);
    if (!loaded && sourcePath) {
      const baseName = sourcePath.split('/').pop().split('\\').pop();
      if (baseName && baseName !== sourcePath) {
        await fetchCompanionEmbedBlocklist(baseName);
      }
    }
  }

  function scheduleEmbedBlockCacheRefresh(timelineData, sourcePath) {
    refreshEmbedBlockCache(timelineData, sourcePath).catch(function(err) {
      console.warn('埋め込み不可URLリストの更新に失敗:', err);
    });
  }

  function isLikelyFrameBlocked(targetUrl){
    const parsedAmazon = parseAmazonUrlWithImage(String(targetUrl || '').trim());
    const url = parsedAmazon.amazonUrl || String(targetUrl || '').trim();
    if (embedBlockedUrlSet.has(normalizeEmbedUrlKey(url))) return true;
    try{
      const u = new URL(url);
      const h = u.hostname.toLowerCase();
      if (embedBlockedHostRes.some(function(re){ return re.test(h); })) return true;
      const blocked = [
        /(^|\.)amazon\.(co\.jp|com)$/,
        /(^|\.)smtrc\.jp$/,
        /(^|\.)niigata\.lg\.jp$/,
        /city\.nagaoka\.niigata\.jp$/,
        /(^|\.)twitter\.com$/,
        /(^|\.)x\.com$/,
        /(^|\.)facebook\.com$/,
        /(^|\.)instagram\.com$/,
        /(^|\.)youtube\.com$/,
        /(^|\.)linkedin\.com$/,
        /(^|\.)bookhousecafe\.jp$/,
        /(^|\.)bunshun\.jp$/,
        /(^|\.)current\.ndl\.go\.jp$/,
        /(^|\.)note\.com$/,
        /(^|\.)visit-chiyoda\.tokyo$/,
        /(^|\.)city\.chiyoda\.lg\.jp$/,
        /(^|\.)gotokyo\.org$/,
        /(^|\.)kosho\.or\.jp$/,
        /(^|\.)library\.chiyoda\.tokyo\.jp$/,
        /(^|\.)nippon\.com$/,
        /(^|\.)pendulummag\.com$/,
        /(^|\.)shinbunka\.co\.jp$/,
        /(^|\.)shogakukan\.co\.jp$/,
        /(^|\.)shueisha\.co\.jp$/,
        /(^|\.)tabelog\.com$/,
        /(^|\.)timeout\.jp$/
      ];
      return blocked.some(re => re.test(h));
    }catch(_e){ return true; }

  function updateBlockedPreviewBackgroundLayer(layer, targetUrl, width) {
    if (!layer || !layer.wrap) return;
    const parsed = parseAmazonUrlWithImage(targetUrl || '');
    const url = parsed.amazonUrl || String(targetUrl || '').trim();
    layer.wrap.style.display = 'block';
    let host = '';
    try { host = new URL(url).hostname; } catch (_e) {}
    if (layer.address) {
      layer.address.textContent = host || url;
      layer.address.title = url;
    }
    if (layer.hint) {
      const sub = (currentLang === 'en') ? 'PREVIEW UNAVAILABLE' : 'プレビュー表示不可';
      layer.hint.innerHTML = '<div style="font-size:30px;line-height:1;margin-bottom:5px;opacity:0.28;">🌐</div><div style="font-size:10px;font-weight:600;letter-spacing:0.04em;opacity:0.42;">' + sub + '</div>';
    }
    if (layer.img && /^https?:\/\//i.test(url)) {
      layer.img.style.display = 'none';
      const shotWidth = Math.max(720, Math.min(1280, Math.floor((width || 640) * 1.35)));
      const candidates = getScreenshotUrls(url, shotWidth);
      let idx = 0;
      const tryNext = function(){
        if (!layer.img) return;
        if (idx >= candidates.length) {
          layer.img.style.display = 'none';
          layer.img.removeAttribute('src');
          return;
        }
        const nextSrc = candidates[idx++];
        layer.img.onload = function(){ layer.img.style.display = 'block'; };
        layer.img.onerror = function(){ tryNext(); };
        layer.img.src = nextSrc;
      };
      tryNext();
    } else if (layer.img) {
      layer.img.style.display = 'none';
      layer.img.removeAttribute('src');
    }
  }

  function isAmazonUrl(targetUrl){

  function parseAmazonUrlWithImage(targetUrl){
    const raw = String(targetUrl || '').trim();
    const marker = raw.match(/&(https?:\/\/.+)$/i);
    if (marker && typeof marker.index === 'number') {
      const amazonUrl = raw.slice(0, marker.index).trim();
      const imageUrl = marker[1].trim();
      if (amazonUrl && /^https?:\/\//i.test(amazonUrl)) {
        return { amazonUrl: amazonUrl, imageUrl: imageUrl };
      }
    }
    return { amazonUrl: raw, imageUrl: null };
  }

  function isLikelyIframeLoadFailure(bodyText, docTitle, docUrl){
    const text = String(bodyText || '').toLowerCase();
    const title = String(docTitle || '').toLowerCase();
    const url = String(docUrl || '').toLowerCase();
    if (url.startsWith('chrome-error://') || url.startsWith('edge-error://')) return true;
    const hitWords = [
      '接続が拒否されました',
      'このサイトにアクセスできません',
      'ページを表示できません',
      'refused to connect',
      'x-frame-options',
      'frame-ancestors',
      'can’t be reached',
      "can't be reached",
      'this site can’t be reached',
      "this site can't be reached"
    ];
    return hitWords.some(w => text.includes(w) || title.includes(w));
  }

  // iframe の遷移直後は about:blank のまま一瞬留まることがあるため、
  // 早すぎる埋め込み失敗判定を避ける猶予時間を設ける。
  const IFRAME_BLOCK_DETECT_GRACE_MS = 2500;
  function markIframeSrcAssigned(iframe) {
    if (!iframe) return;
    try { iframe.dataset.srcAssignedAt = String(Date.now()); } catch(_e) {}
  }
  function getIframeSrcAssignedElapsedMs(iframe) {
    if (!iframe) return Number.POSITIVE_INFINITY;
    try {
      const raw = iframe.dataset ? iframe.dataset.srcAssignedAt : '';
      const ts = Number(raw);
      if (!Number.isFinite(ts) || ts <= 0) return Number.POSITIVE_INFINITY;
      return Date.now() - ts;
    } catch(_e) {
      return Number.POSITIVE_INFINITY;
    }
  }

  function detectIframeLoadFailure(iframe){
    if (!iframe) return false;
    const src = String(iframe.src || '');
    let docUrl = '';
    // location は contentDocument と別に取得を試みる（片方だけ取れるケースがある）
    try {
      docUrl = (iframe.contentWindow && iframe.contentWindow.location)
        ? String(iframe.contentWindow.location.href || '')
        : '';
    } catch(_e) {
      docUrl = '';
    }
    if (docUrl) {
      const urlLower = docUrl.toLowerCase();
      if (urlLower.startsWith('chrome-error://') || urlLower.startsWith('edge-error://')) return true;
      if (urlLower === 'about:blank' && /^https?:\/\//i.test(src)) {
        const elapsed = getIframeSrcAssignedElapsedMs(iframe);
        if (elapsed >= IFRAME_BLOCK_DETECT_GRACE_MS) return true;
      }
    }
    try {
      const iframeDoc = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
      const bodyText = iframeDoc && iframeDoc.body ? (iframeDoc.body.innerText || iframeDoc.body.textContent || '') : '';
      const docTitle = iframeDoc ? (iframeDoc.title || '') : '';
      if (isLikelyIframeLoadFailure(bodyText, docTitle, docUrl)) return true;
    } catch(_e) {
      if (isLikelyFrameBlocked(src)) return true;
      try {
        const href = iframe.contentWindow && iframe.contentWindow.location
          ? String(iframe.contentWindow.location.href || '')
          : '';
        if (href && href.toLowerCase() === 'about:blank' && /^https?:\/\//i.test(src)) {
          const elapsed = getIframeSrcAssignedElapsedMs(iframe);
          if (elapsed >= IFRAME_BLOCK_DETECT_GRACE_MS) return true;
        }
      } catch(_e2) {}
    }
    return false;
  }

  function watchIframeFailureWithDelay(iframe, onFailure){
    if (!iframe || typeof onFailure !== 'function') return;
    let done = false;
    const check = function(){
      if (done) return true;
      if (detectIframeLoadFailure(iframe)) {
        done = true;
        onFailure();
        return true;
      }
      return false;
    };
    if (check()) return;
    // エラーページ文言の反映が遅れるブラウザ向けに、しばらく再チェックする
    const probeDelays = [120, 320, 700, 1300, 2200, 3400, 5000, 7000, 9500];
    const timers = [];
    const scheduleProbe = function(delay){
      const id = setTimeout(function(){
        if (done) return;
        if (check()) {
          timers.forEach(function(t){ try{ clearTimeout(t); }catch(_e){} });
        }
      }, delay);
      timers.push(id);
    };
    probeDelays.forEach(scheduleProbe);
    iframe.addEventListener('mouseenter', function(){
      check();
    }, { once: true });
  }

  function extractAmazonAsin(targetUrl){
    try{
      const u = new URL(targetUrl);
      // /dp/ASIN または /gp/product/ASIN の形式からASINを抽出
      const pathMatch = u.pathname.match(/\/(?:dp|gp\/product)\/([A-Z0-9]{10})/);
      if (pathMatch && pathMatch[1]) {
        return pathMatch[1];
      }
      // クエリパラメータから取得
      const asinParam = u.searchParams.get('asin') || u.searchParams.get('ASIN');
      if (asinParam && /^[A-Z0-9]{10}$/.test(asinParam)) {
        return asinParam;
      }
      return null;
    }catch(_e){ return null; }
  }

  function getAmazonImageUrls(asin, domain){
    if (!asin) return [];
    // domainは 'amazon.co.jp' または 'amazon.com'
    const isJapan = domain.includes('co.jp');
    // 複数の画像URL形式を試す（優先順位順）
    const urls = [];
    if (isJapan) {
      // 日本の場合 - より確実な形式を優先
      urls.push(`https://images-fe.ssl-images-amazon.com/images/I/${asin}.jpg`);
      urls.push(`https://images-na.ssl-images-amazon.com/images/I/${asin}.jpg`);
      urls.push(`https://m.media-amazon.com/images/I/${asin}._AC_SL1500_.jpg`);
      urls.push(`https://images-fe.ssl-images-amazon.com/images/I/${asin}._AC_SL1500_.jpg`);
      urls.push(`https://images-na.ssl-images-amazon.com/images/I/${asin}._AC_SL1500_.jpg`);
    } else {
      // その他の場合
      urls.push(`https://images-na.ssl-images-amazon.com/images/I/${asin}.jpg`);
      urls.push(`https://m.media-amazon.com/images/I/${asin}._AC_SL1500_.jpg`);
      urls.push(`https://images-na.ssl-images-amazon.com/images/I/${asin}._AC_SL1500_.jpg`);
    }
    // より小さいサイズも試す
    urls.push(`https://images-na.ssl-images-amazon.com/images/I/${asin}._AC_SX679_.jpg`);
    urls.push(`https://m.media-amazon.com/images/I/${asin}._AC_SX679_.jpg`);
    return urls;
  }

  function loadAmazonImage(imgElement, urls, index, onComplete){
    if (index >= urls.length) {
      // すべて失敗した場合
      imgElement.style.display = 'none';
      imgElement.style.visibility = 'hidden';
      if (onComplete) onComplete(false);
      return;
    }
    const testImg = new Image();
    let timeout = null;
    const cleanup = function(){
      if (timeout) clearTimeout(timeout);
      testImg.onload = null;
      testImg.onerror = null;
    };
    testImg.onload = function(){
      cleanup();
      imgElement.src = urls[index];
      imgElement.style.display = 'block';
      imgElement.style.visibility = 'visible';
      if (onComplete) onComplete(true);
    };
    testImg.onerror = function(){
      cleanup();
      // 次のURLを試す
      loadAmazonImage(imgElement, urls, index + 1, onComplete);
    };
    // タイムアウトを設定（5秒）
    timeout = setTimeout(function(){
      cleanup();
      loadAmazonImage(imgElement, urls, index + 1, onComplete);
    }, 5000);
    testImg.src = urls[index];
  }

  // '|' 区切りのURL文字列またはURL配列を配列へ
  function splitUrlList(str){
 	if (!str) return [];
 	// Google Sheets (GAS) からは配列で来る場合があるので、そのまま正規化する
 	if (Array.isArray(str)) {
 	  return str
 		.map(s => String(s).trim())
 		.filter(u => u && /^https?:/i.test(u));
 	}
 	return String(str)
 	  .split('|')
 	  .map(s => s.trim())
 	  .filter(u => u && /^https?:/i.test(u));
  }

  function resolvePreferredUrl(item) {
    const isEnglishMode = currentLang === 'en';
    const listJa = splitUrlList(item.url || '');
    const listEn = splitUrlList(item.url_en || '');
    if (isEnglishMode) {
      if (listEn.length > 0) return { url: listEn[0], lang: 'en', listJa, listEn, idxJa: 0, idxEn: 0 };
      if (listJa.length > 0) return { url: listJa[0], lang: 'ja', listJa, listEn, idxJa: 0, idxEn: 0 };
      return { url: '', lang: '', listJa, listEn, idxJa: 0, idxEn: 0 };
    } else {
      if (listJa.length > 0) return { url: listJa[0], lang: 'ja', listJa, listEn, idxJa: 0, idxEn: 0 };
      if (listEn.length > 0) return { url: listEn[0], lang: 'en', listJa, listEn, idxJa: 0, idxEn: 0 };
      return { url: '', lang: '', listJa, listEn, idxJa: 0, idxEn: 0 };
    }
  }

  function resolveAlternateUrl(item, currentLangShown) {
    // 旧APIは単一URLの切替のみを想定していたが、互換のため最初の別言語URLへの切替を返す
    const listJa = splitUrlList(item.url || '');
    const listEn = splitUrlList(item.url_en || '');
    if (currentLangShown === 'ja') {
      return listEn.length > 0 ? { url: listEn[0], lang: 'en' } : null;
    }
    if (currentLangShown === 'en') {
      return listJa.length > 0 ? { url: listJa[0], lang: 'ja' } : null;
    }
    const pref = resolvePreferredUrl(item);
    if (pref.lang === 'ja' && listEn.length > 0) return { url: listEn[0], lang: 'en' };
    if (pref.lang === 'en' && listJa.length > 0) return { url: listJa[0], lang: 'ja' };
    return null;
  }

    // 埋め込み不可メッセージ用オーバーレイ

    urlPreviewBlockedBg = createBlockedPreviewBackgroundLayer();
    urlPreviewBlockedBg.wrap.style.top = '36px';
    urlPreviewBlockedBg.wrap.style.height = 'calc(100% - 36px)';

    urlPreviewAmazonWrap = document.createElement('div');
    urlPreviewAmazonWrap.style.position = 'absolute';
    urlPreviewAmazonWrap.style.left = '0';
    urlPreviewAmazonWrap.style.top = '36px';
    urlPreviewAmazonWrap.style.width = '100%';
    urlPreviewAmazonWrap.style.height = 'calc(100% - 36px)';
    urlPreviewAmazonWrap.style.display = 'none';
    urlPreviewAmazonWrap.style.flexDirection = 'column';
    urlPreviewAmazonWrap.style.alignItems = 'center';
    urlPreviewAmazonWrap.style.justifyContent = 'center';
    urlPreviewAmazonWrap.style.padding = '20px';
    urlPreviewAmazonWrap.style.boxSizing = 'border-box';
    urlPreviewAmazonWrap.style.background = '#fff';
    urlPreviewAmazonWrap.style.overflowY = 'auto';
    urlPreviewAmazonWrap.style.overflowX = 'hidden';

    urlPreviewAmazonImg.style.width = 'auto';
    urlPreviewAmazonImg.style.height = 'auto';

    urlPreviewAmazonText = document.createElement('div');

    urlPreviewAmazonUrl.style.wordBreak = 'break-all';

    // パネル ホバー制御
    urlPreviewEl.addEventListener('mouseenter', function(){
      urlPreviewHovered.panel = true;
      if (urlPreviewHoverTimer) { clearTimeout(urlPreviewHoverTimer); urlPreviewHoverTimer = null; }
    });
    urlPreviewEl.addEventListener('mouseleave', function(){
      urlPreviewHovered.panel = false;
      // 固定されている場合は閉じない
      if (!urlPreviewPinned) {
        scheduleUrlPreviewClose();
      }
    });
    // パネルをクリックしたら固定状態にする
    urlPreviewEl.addEventListener('mousedown', function(e){
      // ボタン以外をクリックした場合は固定状態にする（ヘッダーも含む）
      if (!e.target.closest('button')) {
        urlPreviewPinned = true;
      }
    });

    // ドラッグ移動（ヘッダー）
    (function(){
      let dragging = false, startX = 0, startY = 0, baseLeft = 0, baseTop = 0;
      header.addEventListener('mousedown', function(e){
        e.preventDefault();
        dragging = true;
        startX = e.clientX; startY = e.clientY;
        baseLeft = parseInt(urlPreviewEl.style.left||'0',10) || 0;
        baseTop = parseInt(urlPreviewEl.style.top||'0',10) || 0;
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      });
      function onMove(e){
        if (!dragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        urlPreviewEl.style.left = (baseLeft + dx) + 'px';
        urlPreviewEl.style.top = (baseTop + dy) + 'px';
      }
      function onUp(){
        dragging = false;
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      }
    })();
