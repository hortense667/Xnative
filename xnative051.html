  function positionUrlPreview(anchorBtn) {
    const vw = window.innerWidth || document.documentElement.clientWidth;
    const vh = window.innerHeight || document.documentElement.clientHeight;
    const btnRect = anchorBtn.getBoundingClientRect();
    const width = Math.min(640, Math.max(420, vw * 0.38));
    const height = Math.min(832, Math.max(468, vh * 0.715));
    urlPreviewEl.style.width = width + 'px';
    urlPreviewEl.style.height = height + 'px';

    // 横位置: 地球ボタンのすぐ右（入らなければ左）
    let left = btnRect.right + 8;
    if (left + width > vw - 12) left = Math.max(12, btnRect.left - width - 8);

    // 縦位置: 地球ボタンとほぼ同じ高さ（少しだけ上に寄せる）
    let top = Math.max(8, Math.min(vh - height - 12, btnRect.top - 8));

    urlPreviewEl.style.left = left + 'px';
    urlPreviewEl.style.top = top + 'px';
  }

  function updateUrlPreviewHeader(item, lang) {
    const title = getDisplayItemLabel(item);
    urlPreviewHeaderTitle.textContent = title || '';
    urlPreviewLangBadge.textContent = (lang === 'en') ? 'EN' : (lang === 'ja' ? 'JA' : '');
    urlPreviewBtnOpenTab.textContent = currentLang === 'en' ? 'Open in New Tab' : '新しいタブとして開く';
    urlPreviewBtnSwitch.textContent = currentLang === 'en' ? 'Switch to other URL' : '他のURLに切り替える';
    urlPreviewBtnClose.textContent = currentLang === 'en' ? 'Close' : '閉じる';
    // 切替可能か判定（現在言語の残り or 他言語にURLがあるか）
    let canSwitch = false;
    if (lang === 'ja') {
      canSwitch = (urlPreviewCurrent.idxJa + 1 < (urlPreviewCurrent.listJa||[]).length) || ((urlPreviewCurrent.listEn||[]).length > 0);
    } else if (lang === 'en') {
      canSwitch = (urlPreviewCurrent.idxEn + 1 < (urlPreviewCurrent.listEn||[]).length) || ((urlPreviewCurrent.listJa||[]).length > 0);
    }
    urlPreviewBtnSwitch.disabled = !canSwitch;
    urlPreviewBtnOpenTab.disabled = !(urlPreviewCurrent.url && urlPreviewCurrent.url.startsWith('http'));
  }

  function showUrlPreview(item, anchorBtn, pin) {
    ensureUrlPreviewPanel();
    const pref = resolvePreferredUrl(item);
    if (!pref.url) return;
    // year と index を取得
    let year = null, index = null;
    if (anchorBtn) {
      const container = anchorBtn.closest('.detail-item');
      if (container) {
        year = parseInt(container.getAttribute('data-year'), 10);
        index = parseInt(container.getAttribute('data-index'), 10);
      }
    }
    // 固定されたパネルがあり、かつ別のアイテムの場合は、一時的なパネルを作成
    if (urlPreviewPinned && urlPreviewEl && urlPreviewEl.style.display === 'block' && 
        (urlPreviewCurrent.year !== year || urlPreviewCurrent.index !== index)) {
      // 既存の一時的なパネルをすべて閉じる
      urlPreviewHoverPanels.forEach(function(panel){
        try{
          if (panel && panel.parentNode) {
            panel.remove();
          }
        }catch(_e){}
      });
      urlPreviewHoverPanels.clear();
      // 固定されたパネルはそのままにして、一時的なパネルを openPersistentUrlPreview で作成
      const hoverPanel = openPersistentUrlPreview(item, anchorBtn, true); // true = 一時的なパネル
      if (hoverPanel) {
        urlPreviewHoverPanels.add(hoverPanel);
      }
      return;
    }
    urlPreviewCurrent.item = item;
    urlPreviewCurrent.year = year;
    urlPreviewCurrent.index = index;
    urlPreviewCurrent.listJa = pref.listJa || splitUrlList(item.url || '');
    urlPreviewCurrent.listEn = pref.listEn || splitUrlList(item.url_en || '');
    urlPreviewCurrent.idxJa = 0;
    urlPreviewCurrent.idxEn = 0;
    
    // urlPreviewElに情報を保存（スナップショット用）
    if (urlPreviewEl) {
      urlPreviewEl.panelData = {
        year: year,
        index: index,
        isTemporary: false,
        listJa: [...urlPreviewCurrent.listJa],
        listEn: [...urlPreviewCurrent.listEn],
        idxJa: urlPreviewCurrent.idxJa,
        idxEn: urlPreviewCurrent.idxEn,
        currentLangShown: pref.lang,
        currentUrl: pref.url
      };
    }
    
    // ブロックされているサイトかどうかを事前チェック
    const isBlocked = isLikelyFrameBlocked(pref.url);
    const isAmazon = isAmazonUrl(pref.url);
    
    // Amazonの場合は専用表示
    if (isAmazon) {
      hideUrlPreviewBlockedBackground();
      urlPreviewMsg.style.display = 'none';
      urlPreviewIframe.style.display = 'none';
      if (urlPreviewAmazonWrap) {
        urlPreviewAmazonWrap.style.display = 'flex';
        const parsed = parseAmazonUrlWithImage(pref.url);
        const amazonUrl = parsed.amazonUrl;
        const imageUrl = parsed.imageUrl;
        
        // 画像をリセット
        if (imageUrl) {
          urlPreviewAmazonImg.style.display = 'block';
          urlPreviewAmazonImg.style.visibility = 'visible';
          urlPreviewAmazonImg.src = imageUrl;
          urlPreviewAmazonImg.onerror = function(){
            // 画像が読み込めない場合は非表示
            urlPreviewAmazonImg.style.display = 'none';
            urlPreviewAmazonImg.style.visibility = 'hidden';
          };
        } else {
          urlPreviewAmazonImg.style.display = 'none';
          urlPreviewAmazonImg.src = '';
        }
        
        urlPreviewAmazonText.textContent = (currentLang === 'en')
          ? 'Click "Open in New Tab" to open the page.'
          : '「新しいタブとして開く」でページが開きます。';
        urlPreviewAmazonUrl.textContent = amazonUrl;
      }
    } else if (isBlocked) {
      showUrlPreviewBlockedMessage(pref.url);
      promptOpenInNewWindowOnPreviewError(pref.url);
    } else {
      hideUrlPreviewBlockedBackground();
      urlPreviewMsg.style.display = 'none';
      if (urlPreviewAmazonWrap) urlPreviewAmazonWrap.style.display = 'none';
      urlPreviewIframe.style.display = 'block';
      if (urlPreviewCurrent.url !== pref.url) {
        urlPreviewIframe.style.visibility = 'hidden';
        if(urlPreviewLoadTimer){ try{ clearTimeout(urlPreviewLoadTimer); }catch(_e){} }
        urlPreviewLoadTimer = setTimeout(function(){ urlPreviewIframe.style.visibility='visible'; urlPreviewLoadTimer=null; }, 1500);
        markIframeSrcAssigned(urlPreviewIframe);
        urlPreviewIframe.src = pref.url;
      }
    }
    urlPreviewCurrent.url = pref.url;
    urlPreviewCurrent.lang = pref.lang;
    // urlPreviewElのURL情報を更新（スナップショット用）
    if (urlPreviewEl && urlPreviewEl.panelData) {
      urlPreviewEl.panelData.currentUrl = pref.url;
      urlPreviewEl.panelData.currentLangShown = pref.lang;
    }
    updateUrlPreviewHeader(item, pref.lang);
    positionUrlPreview(anchorBtn);
    urlPreviewEl.style.display = 'block';
    urlPreviewPinned = !!pin;
  }

  function toggleUrlPreviewAlternate() {
    if (!urlPreviewEl || !urlPreviewCurrent.item) return;
    // 現在の言語のリスト内で次へ、それが尽きたら他言語の先頭へ
    let nextUrl = '';
    let nextLang = urlPreviewCurrent.lang;
    if (urlPreviewCurrent.lang === 'ja') {
      if (urlPreviewCurrent.idxJa + 1 < urlPreviewCurrent.listJa.length) {
        urlPreviewCurrent.idxJa += 1;
        nextUrl = urlPreviewCurrent.listJa[urlPreviewCurrent.idxJa];
        nextLang = 'ja';
      } else if (urlPreviewCurrent.listEn.length > 0) {
        urlPreviewCurrent.idxEn = 0;
        nextUrl = urlPreviewCurrent.listEn[0];
        nextLang = 'en';
      }
    } else {
      if (urlPreviewCurrent.idxEn + 1 < urlPreviewCurrent.listEn.length) {
        urlPreviewCurrent.idxEn += 1;
        nextUrl = urlPreviewCurrent.listEn[urlPreviewCurrent.idxEn];
        nextLang = 'en';
      } else if (urlPreviewCurrent.listJa.length > 0) {
        urlPreviewCurrent.idxJa = 0;
        nextUrl = urlPreviewCurrent.listJa[0];
        nextLang = 'ja';
      }
    }
    if (!nextUrl) return;
    
    // urlPreviewElのURL情報を更新（スナップショット用）
    if (urlPreviewEl && urlPreviewEl.panelData) {
      urlPreviewEl.panelData.idxJa = urlPreviewCurrent.idxJa;
      urlPreviewEl.panelData.idxEn = urlPreviewCurrent.idxEn;
      urlPreviewEl.panelData.currentLangShown = nextLang;
      urlPreviewEl.panelData.currentUrl = nextUrl;
    }
    
    // ブロックされているサイトかどうかを事前チェック
    const isBlocked = isLikelyFrameBlocked(nextUrl);
    const isAmazon = isAmazonUrl(nextUrl);
    
    // Amazonの場合は専用表示
    if (isAmazon) {
      hideUrlPreviewBlockedBackground();
      urlPreviewMsg.style.display = 'none';
      urlPreviewIframe.style.display = 'none';
      if (urlPreviewAmazonWrap) {
        urlPreviewAmazonWrap.style.display = 'flex';
        const parsed = parseAmazonUrlWithImage(nextUrl);
        const amazonUrl = parsed.amazonUrl;
        const imageUrl = parsed.imageUrl;
        
        // 画像をリセット
        if (imageUrl) {
          urlPreviewAmazonImg.style.display = 'block';
          urlPreviewAmazonImg.style.visibility = 'visible';
          urlPreviewAmazonImg.src = imageUrl;
          urlPreviewAmazonImg.onerror = function(){
            // 画像が読み込めない場合は非表示
            urlPreviewAmazonImg.style.display = 'none';
            urlPreviewAmazonImg.style.visibility = 'hidden';
          };
        } else {
          urlPreviewAmazonImg.style.display = 'none';
          urlPreviewAmazonImg.src = '';
        }
        
        urlPreviewAmazonText.textContent = (currentLang === 'en')
          ? 'Click "Open in New Tab" to open the page.'
          : '「新しいタブとして開く」でページが開きます。';
        urlPreviewAmazonUrl.textContent = amazonUrl;
      }
    } else if (isBlocked) {
      showUrlPreviewBlockedMessage(nextUrl);
      promptOpenInNewWindowOnPreviewError(nextUrl);
    } else {
      hideUrlPreviewBlockedBackground();
      urlPreviewMsg.style.display = 'none';
      if (urlPreviewAmazonWrap) urlPreviewAmazonWrap.style.display = 'none';
      urlPreviewIframe.style.display = 'block';
      if (urlPreviewCurrent.url !== nextUrl) {
        urlPreviewIframe.style.visibility = 'hidden';
        if(urlPreviewLoadTimer){ try{ clearTimeout(urlPreviewLoadTimer); }catch(_e){} }
        urlPreviewLoadTimer = setTimeout(function(){ urlPreviewIframe.style.visibility='visible'; urlPreviewLoadTimer=null; }, 1500);
        markIframeSrcAssigned(urlPreviewIframe);
        urlPreviewIframe.src = nextUrl;
      }
    }
    urlPreviewCurrent.url = nextUrl;
    urlPreviewCurrent.lang = nextLang;
    updateUrlPreviewHeader(urlPreviewCurrent.item, nextLang);
  }

  function getScreenshotUrls(url, width){
    const w = Math.max(480, Math.min(1280, Math.floor(width||720)));
    const encoded = encodeURIComponent(url);
    // 複数サービスを順に試し、取得できたものを背景サムネとして使う
    return [
      // WordPress mshots
      'https://s.wordpress.com/mshots/v1/' + encoded + '?w=' + w,
      // thum.io
      'https://image.thum.io/get/width/' + w + '/noanimate/' + encodeURI(url)
    ];
  }

  function closeUrlPreviewPanel() {
    if (!urlPreviewEl) return;
    urlPreviewEl.style.display = 'none';
    urlPreviewPinned = false;
    urlPreviewCurrent = { item: null, url: '', lang: '', listJa: [], listEn: [], idxJa: 0, idxEn: 0, year: null, index: null };
  }

  function scheduleUrlPreviewClose() {
    if (urlPreviewPinned) return;
    if (urlPreviewHoverTimer) { clearTimeout(urlPreviewHoverTimer); urlPreviewHoverTimer = null; }
    urlPreviewHoverTimer = setTimeout(function(){
      if (!urlPreviewPinned && !urlPreviewHovered.button && !urlPreviewHovered.panel) {
        closeUrlPreviewPanel();
      }
    }, 150);
  }

  function clearDelayedHoverOpen(removePreloadedPanel) {
    if (urlPreviewDelayedOpenTimer) {
      clearTimeout(urlPreviewDelayedOpenTimer);
      urlPreviewDelayedOpenTimer = null;
    }
    urlPreviewHoverToken += 1;
    if (!removePreloadedPanel) return;
    if (urlPreviewPreloadedPanel && urlPreviewPreloadedPanel.parentNode && !urlPreviewPreloadedPanel.panelPinned) {
      try {
        urlPreviewPreloadedPanel.remove();
      } catch (_e) {}
    }
    if (urlPreviewPreloadedPanel) {
      urlPreviewHoverPanels.delete(urlPreviewPreloadedPanel);
    }
    urlPreviewPreloadedPanel = null;
  }

  function startDelayedHoverPreview(item, anchorEl) {
    if (typeof isCoarsePointer === 'function' && isCoarsePointer()) return;
    if (!item || !(item.url || item.url_en)) return;
    if (isOpenTabBehavior(item)) return;
    urlPreviewHovered.button = true;
    if (urlPreviewHoverTimer) { clearTimeout(urlPreviewHoverTimer); urlPreviewHoverTimer = null; }
    clearDelayedHoverOpen(true);

    // 1秒待機中にできるだけ読み込みを進めるため、先に非表示パネルを生成してロードを開始する
    const preloadedPanel = openPersistentUrlPreview(item, anchorEl, true);
    if (preloadedPanel) {
      preloadedPanel.style.visibility = 'hidden';
      preloadedPanel.style.opacity = '0';
      preloadedPanel.style.pointerEvents = 'none';
      urlPreviewHoverPanels.add(preloadedPanel);
      urlPreviewPreloadedPanel = preloadedPanel;
    }

    const hoverToken = ++urlPreviewHoverToken;
    urlPreviewDelayedOpenTimer = setTimeout(function(){
      urlPreviewDelayedOpenTimer = null;
      if (hoverToken !== urlPreviewHoverToken) return;
      if (!urlPreviewHovered.button) {
        clearDelayedHoverOpen(true);
        return;
      }

      const panelToShow = urlPreviewPreloadedPanel;
      if (panelToShow && panelToShow.parentNode) {
        panelToShow.style.visibility = 'visible';
        panelToShow.style.opacity = '1';
        panelToShow.style.pointerEvents = 'auto';
      } else {
        const fallbackPanel = openPersistentUrlPreview(item, anchorEl, true);
        if (fallbackPanel) {
          urlPreviewHoverPanels.add(fallbackPanel);
        }
      }
      urlPreviewPreloadedPanel = null;
    }, URL_PREVIEW_HOVER_OPEN_DELAY_MS);
  }

  function handlePreviewHoverLeaveCommon() {
    urlPreviewHovered.button = false;
    clearDelayedHoverOpen(true);
    scheduleUrlPreviewClose();
    // 一時的なパネルを閉じる（固定ウェブ画面がないときと同じタイムラグ 150ms）
    // 各パネルに「地球」マークから離れたことを通知するタイマーを設定
    // パネルにマウスが入っている場合は、パネルの mouseenter イベントでタイマーがクリアされる
    urlPreviewHoverPanels.forEach(function(panel){
      // パネルの panelButtonLeaveTimer を設定（パネルの mouseenter でクリアされる）
      if (panel.panelButtonLeaveTimer) {
        clearTimeout(panel.panelButtonLeaveTimer);
      }
      panel.panelButtonLeaveTimer = setTimeout(function(){
        // パネルがまだ存在し、固定されていない場合のみ閉じる
        if (panel && panel.parentNode && !panel.panelPinned) {
          try{
            panel.remove();
            urlPreviewHoverPanels.delete(panel);
          }catch(_e){}
        }
      }, 150);
    });
  }

  // ボタンのインラインイベントから呼ぶ
  function previewUrlMouseEnter(btn) {
    if (typeof isCoarsePointer === 'function' && isCoarsePointer()) return;
    const info = getDetailListItemFromButton(btn);
    if (!info || !(info.item.url || info.item.url_en)) return;
    if (isOpenTabBehavior(info.item)) return;
    startDelayedHoverPreview(info.item, btn);
  }
  function previewUrlMouseLeave() {
    handlePreviewHoverLeaveCommon();
  }
  let urlPreviewZCounter = 10000;
  function focusUrlPreview(btn) {
    const info = getDetailListItemFromButton(btn);
    if (!info || !(info.item.url || info.item.url_en)) return;
    if (isOpenTabBehavior(info.item)) {
      openUrl(info.item);
      return;
    }
    const year = info.yearKey;
    const index = info.index;
    const item = info.item;
    // 既に表示されているパネル（urlPreviewEl）があり、同じアイテムの場合は、それを固定状態にする
    if (urlPreviewEl && urlPreviewEl.style.display === 'block' && 
        urlPreviewCurrent.year === year && urlPreviewCurrent.index === index) {
      urlPreviewPinned = true;
      return;
    }
    // それ以外の場合は、新しいパネルを開く（既存の固定されたパネルは閉じない）
    openPersistentUrlPreview(item, btn, false);
  }

  function openPersistentUrlPreview(item, anchorBtn, isTemporary) {
    if (item && isOpenTabBehavior(item)) {
      openUrl(item);
      return null;
    }
    const pref = resolvePreferredUrl(item);
    if (!pref.url) return null;
    
    // year と index を取得
    let year = null, index = null;
    if (anchorBtn) {
      const container = anchorBtn.closest('.detail-item');
      if (container) {
        year = parseInt(container.getAttribute('data-year'), 10);
        index = parseInt(container.getAttribute('data-index'), 10);
      }
    }
    
    const panel = document.createElement('div');
    panel.className = 'urlPreviewPanel';
    panel.style.position = 'absolute';
    panel.style.zIndex = String(++urlPreviewZCounter);
    panel.style.background = '#fff';
    panel.style.border = '1px solid #ccc';
    panel.style.borderRadius = '6px';
    panel.style.boxShadow = '0 6px 18px rgba(0,0,0,0.18)';
    panel.style.width = '560px';
    panel.style.height = '546px';
    panel.style.resize = 'both';
    panel.style.overflow = 'hidden';
    
    // パネルに情報を保存（スナップショット用）
    panel.panelData = {
      year: year,
      index: index,
      isTemporary: isTemporary || false
    };

    const header = document.createElement('div');
    header.style.cursor = 'move';
    header.style.background = '#f5f5f5';
    header.style.padding = '6px 8px';
    header.style.display = 'flex';
    header.style.alignItems = 'center';
    header.style.justifyContent = 'space-between';
    header.style.borderBottom = '1px solid #ddd';

    const titleWrap = document.createElement('div');
    titleWrap.style.display = 'flex';
    titleWrap.style.alignItems = 'center';
    titleWrap.style.gap = '8px';
    const headerTitle = document.createElement('span');

  async function deleteItem(year, index) {
    const items = events[year] || [];
    const item = items[index];
    if (item && item._source === 'ref') {
      showInfo('削除不可', '参照年表の項目は削除できません。');
      return;
    }
    if (!item) return;
    // Sheetsモード時はダイアログ・画面削除を行わず、該当セルへ移動のみ
    if (dataSource === 'sheet') {
      try { openGoogleSheetForEvent(item, year); } catch(_e){}
      return;
    }
    
    if (confirm(`「${item.label}」を削除しますか？`)) {
      const deletedItemSnapshot = deepCloneJson(item, null);
      const deletedYearSnapshot = year;
      // tombstoneを登録
      try{
        const key = createItemKey(item, year);
        if (key) { deletedKeys.add(key); saveDeletedKeys(); }
      }catch(_e){}
      // 物理削除
      items.splice(index, 1);
      if (items.length === 0) delete events[year];
      console.log('項目を物理削除:', { year, index, label: item.label });
      saveEvents();
      renderEvents();
      autoSave();
      const deleteSaved = await deleteItemToGitHubAndReload({
        deletedItem: deletedItemSnapshot,
        deletedYear: deletedYearSnapshot,
        reason: 'delete'
      });
      if (!deleteSaved) return;
      showDetailList(year, null);

  // Google スプレッドシートを開いてイベント行へ移動（既存タブ再利用）
  // colLetter を指定すると、その列のセル（例: 'C12'）へフォーカスします（既定は 'A'）
  function openGoogleSheetForEvent(item, year, colLetter){
    const cfg = sheetConfig || {};
    const sheetId = extractSpreadsheetId(cfg.sheetId || '');
    if (!sheetId) {
      throw new Error('Spreadsheet ID が未設定です（設定→データソースを確認）');
    }
    // タブ名は設定の events タブ名を既定に、アイテム側に _sheetTab があれば優先
    const tabName = (item && item._sheetTab) ? String(item._sheetTab) : (cfg.tabEvents || 'events');
    const gid = (item && item._sheetGid != null) ? String(item._sheetGid) : '';
    // 行番号は _sheetRow / _row を優先。なければ year の一覧からインデックス+2 を推測（ヘッダー1行想定）
    let row = (item && (item._sheetRow || item._row)) ? (item._sheetRow || item._row) : 0;
    if (!row && typeof year === 'number' && events && events[year]) {
      try {
        const idx = (events[year] || []).findIndex(it => itemsEqualForRowGuess(it, item, year));
        if (idx >= 0) row = idx + 2;
      } catch(_e){}
    }
    if (!row) row = 1;
    const col = (typeof colLetter === 'string' && /^[A-Z]+$/.test(colLetter)) ? colLetter : 'A';
    // URLのハッシュを作成（gidがあればシート指定を確実に、なければエンコードしたタブ名＋A1表記）
    const encodedTab = encodeURIComponent(tabName);
    const hash = gid ? `gid=${gid}&range=${col}${row}` : `range=${encodedTab}!${col}${row}`;
    const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/edit#${hash}`;
    // 同一ターゲット名で開いて既存タブを再利用
    try{
      sheetWindowRef = window.open(url, 'xnative_sheet');
      if (sheetWindowRef && typeof sheetWindowRef.focus === 'function') {
        sheetWindowRef.focus();
      }
    }catch(e){
      // ブロック等の可能性。少なくとも別タブで開けるようフォールバック
      window.open(url, '_blank');
    }
  }
  function itemsEqualForRowGuess(a, b, fallbackYear){
    if (!a || !b) return false;
    const genreA = Array.isArray(a.genre) ? a.genre.slice().sort().join('・') : (a.genre || '');
    const genreB = Array.isArray(b.genre) ? b.genre.slice().sort().join('・') : (b.genre || '');
    const startA = getYearValue(a.startYear, fallbackYear);
    const startB = getYearValue(b.startYear, fallbackYear);
    return (a.label||'') === (b.label||'') &&
           (a.label_en||'') === (b.label_en||'') &&
           String(genreA) === String(genreB) &&
           Number(startA) === Number(startB);
  }
  // 年を基準にスプレッドシートの該当行付近へジャンプ
  function openGoogleSheetForYear(year){
    try{
      const yearNum = Number(year);
      if (!Number.isFinite(yearNum)) return;
      // 1) その年の行の最大+1（末尾に挿入）を優先
      const list = events[yearNum] || [];
      const rowsThis = Array.isArray(list) ? list.map(it => it && it._sheetRow).filter(v=>Number.isFinite(v)) : [];
      let targetRow = (rowsThis.length ? Math.max.apply(null, rowsThis) + 1 : 0);
      // 2) 前の年の末尾+1
      if (!targetRow) {
        const yearsDesc = Object.keys(events).map(Number).filter(n => Number.isFinite(n) && n < yearNum).sort((a,b)=>b-a);
        for (const y of yearsDesc) {
          const arr = events[y] || [];
          const rows = arr.map(it => it && it._sheetRow).filter(v=>Number.isFinite(v));
          if (rows.length) { targetRow = Math.max.apply(null, rows) + 1; break; }
        }
      }
      // 3) 次の年の先頭（その年に何もない場合）
      if (!targetRow) {
        const yearsAsc = Object.keys(events).map(Number).filter(n => Number.isFinite(n) && n > yearNum).sort((a,b)=>a-b);
        for (const y of yearsAsc) {
          const arr = events[y] || [];
          const rows = arr.map(it => it && it._sheetRow).filter(v=>Number.isFinite(v));
          if (rows.length) { targetRow = Math.min.apply(null, rows); break; }
        }
      }
      if (!targetRow || !Number.isFinite(targetRow)) targetRow = 2; // ヘッダー直下を既定
      // 可能なら gid を、なければタブ名で range 指定
      const cfg = sheetConfig || {};
      const tabName = (cfg.tabEvents || 'events');
      let anyItemWithGid = null;
      outer: for (const yKey of Object.keys(events)) {
        const arr = events[yKey] || [];

        openGoogleSheetForEvent({ _sheetTab: tabName, _sheetRow: targetRow }, yearNum);
      }
    } catch(_e){}
  }

  async function saveEditItem(year, index) {
    console.log('saveEditItem開始:', { year, index });
    const originalItemSnapshot = (index !== -1 && events[year] && events[year][index]) ? deepCloneJson(events[year][index], null) : null;
    const originalYearSnapshot = (index !== -1) ? year : null;
    const startYear = document.getElementById('editStartYear').value.trim();
    const endYearInput = document.getElementById('editEndYear').value.trim();
    const endYearOngoing = document.getElementById('editEndYearOngoing').checked;
    const endYear = endYearOngoing ? 'ongoing' : endYearInput;
    const label = document.getElementById('editLabel').value.trim();
    const labelEn = document.getElementById('editLabelEn').value.trim();
    const timeLabel = normalizeTimeLabelValue(document.getElementById('editTimeLabel')?.value);
    const genreCheckboxes = document.querySelectorAll('input[type="checkbox"][value]');
    const genres = Array.from(genreCheckboxes).filter(cb => cb.checked).map(cb => cb.value);
    const imp = document.getElementById('editImp').value.trim();
    const url = document.getElementById('editUrl').value.trim();
    const urlEn = document.getElementById('editUrlEn').value.trim();
    const note = document.getElementById('editNote').value.trim();
    const noteEn = document.getElementById('editNoteEn').value.trim();
    const xMarkChecked = !!(document.getElementById('editXMark') && document.getElementById('editXMark').checked);
    const totalLen = (url || '').length + (note || '').length;
    if(totalLen > 4096){
      showEditError('編集エラー', `URLと注釈の合計は最大 4096 文字までです。現在: ${totalLen} 文字`);
      return; // エラー時は編集画面を閉じない
    }
    
    // 年の範囲チェック（グローバル設定に準拠）
    const RANGE_MIN = YEAR_MIN;
    const RANGE_MAX = YEAR_MAX;
    const isYearInRange = (v) => {
      if (v === '' || String(v).toLowerCase() === 'ongoing') return true;
      const p = parseYearInput(v);
      return !!(p && Number.isInteger(p.year) && p.year >= RANGE_MIN && p.year <= RANGE_MAX);
    };
    if (!isYearInRange(startYear)) {
      showEditError('編集エラー', `開始年は${RANGE_MIN}～${RANGE_MAX}の範囲で入力してください（YYYY または YYYY/MM または YYYY/MM/DD）。`);
      const se = document.getElementById('editStartYear');
      if (se) se.value = '';
      return; // エラー時は編集画面を閉じない
    }
    if (!isYearInRange(endYear)) {
      showEditError('編集エラー', `終了年は${RANGE_MIN}～${RANGE_MAX}の範囲で入力してください（YYYY/MM/DD も可、または「ongoing」）。`);
      const ee = document.getElementById('editEndYear');
      if (ee) ee.value = '';
      return; // エラー時は編集画面を閉じない
    }

    // ラベルは日本語・英語のどちらか一方があればOK
    if (!label && !labelEn) {
      showEditError('編集エラー', 'ラベルは必須です（日本語または英語のいずれか）。');
      return; // エラー時は編集画面を閉じない
    }

    // ジャンル必須チェック
    if (!Array.isArray(genres) || genres.length === 0) {
      showEditError('編集エラー', 'ジャンルを1つ以上選択してください。');
      return; // エラー時は編集画面を閉じない
    }

    // 重要度必須・範囲チェック（1～5）
    const impNum = imp ? parseInt(imp, 10) : NaN;
    if (Number.isNaN(impNum) || impNum < 1 || impNum > 5) {
      showEditError('編集エラー', '重要度は1～5の範囲で選択してください。');
      return; // エラー時は編集画面を閉じない
    }
    
    // 重複チェック（ラベル・ジャンル・開始年組み合わせ）
    const genreKey = Array.isArray(genres) && genres.length > 0 ? genres.slice().sort().join('・') : '';
    const startYearKey = (startYear ? (getYearValue(startYear, year) ?? '') : '');
    const labelKey = label || '';
    const labelEnKey = labelEn || '';
    const key = `${labelKey}|${labelEnKey}|${startYearKey}|${genreKey}`;
    
    // 重複チェック（新規追加時のみ）
    if (index === -1) {
      const existingItems = buildLabelGenreSet();
      if (existingItems.has(key)) {
        const displayLabel = label || labelEn || 'ラベルなし';
        showEditError('重複エラー', `同じラベル・ジャンル・開始年組み合わせが既に存在します（${displayLabel}${genreKey ? ` [${genreKey}]` : ''}）`);
        return; // エラー時は編集画面を閉じない
      }
    }
    
    // 保存データ作成
    const newItem = { label };
    if (startYear) newItem.startYear = String(startYear);
    if (endYear) {
      if (endYear === 'ongoing') {
        newItem.endYear = 'ongoing';
      } else {
        newItem.endYear = String(endYear);
      }
    }
    if (genres.length > 0) newItem.genre = genres;
    if (imp) newItem.imp = parseInt(imp, 10);
    if (url) newItem.url = url;
    if (note) newItem.note = note;
    if (labelEn) newItem.label_en = labelEn;
    if (timeLabel) newItem.timeLabel = timeLabel;
    if (urlEn) newItem.url_en = urlEn;
    if (noteEn) newItem.note_en = noteEn;
    if (xMarkChecked) newItem.xMark = true;
    newItem._rev = createRevisionStamp();
    
    // 変更検知（imp, url, url_en, note, note_en）
    let changedSensitiveFields = false;
    if (index === -1) {
      // 新規追加は変更ありとして扱う（少なくとも1項目が入力されている）
      changedSensitiveFields = !!(imp || url || urlEn || note || noteEn);
      // 新しい項目を追加
      const targetYear = (startYear ? getYearValue(startYear, year) : year);
      if (!events[targetYear]) {
        events[targetYear] = [];
      }
      events[targetYear].push(newItem);
    } else {
      // 既存の項目を更新
      const currentItem = events[year][index];
      const originalStartYear = getYearValue(currentItem.startYear, year);
      const newStartYear = startYear ? getYearValue(startYear, year) : year;
      const originalLabel = currentItem.label || '';
      const originalLabelEn = currentItem.label_en || '';
      const originalGenreKey = Array.isArray(currentItem.genre) ? currentItem.genre.slice().sort().join('・') : (currentItem.genre || '');
      const changedLabel = (originalLabel || '') !== (label || '');
      const changedLabelEn = (originalLabelEn || '') !== (labelEn || '');
      const changedGenre = originalGenreKey !== genreKey;
      
      // 対象フィールドの変更有無
      const prevImp = currentItem.imp == null ? '' : String(currentItem.imp);
      const prevUrl = currentItem.url || '';
      const prevUrlEn = currentItem.url_en || '';
      const prevNote = currentItem.note || '';
      const prevNoteEn = currentItem.note_en || '';
      const nextImp = imp ? String(parseInt(imp,10)) : '';
      const nextUrl = url || '';
      const nextUrlEn = urlEn || '';
      const nextNote = note || '';
      const nextNoteEn = noteEn || '';
      changedSensitiveFields = (prevImp !== nextImp) || (prevUrl !== nextUrl) || (prevUrlEn !== nextUrlEn) || (prevNote !== nextNote) || (prevNoteEn !== nextNoteEn);

      // 開始年・ラベル・ジャンルのいずれかが変更された場合は、元データを物理削除し、新規レコードを追加
      if (originalStartYear !== newStartYear || changedLabel || changedLabelEn || changedGenre) {
        // 削除記録システムは削除（シンプルな同期ロジックに変更）
        
        // 全データから同一の古い項目を検索して削除（すべての年をチェック）
        const sameMatcher = (it) => {
          const gA = Array.isArray(it.genre) ? it.genre.slice().sort().join('・') : (it.genre || '');
          const labelA = (it.label||'') === originalLabel;
          const labelEnA = (it.label_en||'') === originalLabelEn;
          const startYearA = getYearValue(it.startYear, year) === originalStartYear;
          return labelA && labelEnA && startYearA && gA === originalGenreKey;
        };
        
        // すべての年から古い項目を削除
        for (const yearKey of Object.keys(events)) {
          if (Array.isArray(events[yearKey])) {
            const originalLength = events[yearKey].length;
            events[yearKey] = events[yearKey].filter(it => !sameMatcher(it));
            if (events[yearKey].length === 0) {
              delete events[yearKey];
            } else if (events[yearKey].length !== originalLength) {
              console.log(`年${yearKey}から古い項目を削除: ${originalLength - events[yearKey].length}件`);
            }
          }
        }
        
        console.log('識別子変更に伴い旧項目を全データから物理削除:', { year, index, originalLabel, originalGenreKey, originalStartYear });

        // 新しい年に項目を追加
        const targetYearForNew = newStartYear;
        if (!events[targetYearForNew]) {
          events[targetYearForNew] = [];
        }
        events[targetYearForNew].push(newItem);
        
      } else {
        // 識別子に変更がなければ通常の上書き更新
        events[year][index] = newItem;
      }
    }
    
    saveEvents();
    renderEvents();
    autoSave();

    const updatedYearForSave = startYear ? getYearValue(startYear, year) : year;
    const editSaved = await saveEditedItemToGitHubAndReload({
      originalItem: originalItemSnapshot,
      originalYear: originalYearSnapshot,
      updatedItem: newItem,
      updatedYear: updatedYearForSave,
      reason: 'edit'
    });
    if (!editSaved) return;
    
    // 保存成功時にエラーメッセージをクリア
    clearEditError();
    
    // 保存成功時のみ編集画面を閉じる
    if (typeof window.closeActiveEditModal === 'function') {
      window.closeActiveEditModal();
    } else {
      editor.style.display = 'none';
    }
    
    // Sheetsモード: 保存内容をTSVに整形してクリップボードへコピー
    try{
      if (dataSource === 'sheet') {
        const finalYearForTsv = (index === -1)
          ? (startYear ? getYearValue(startYear, year) : year)
          : (startYear ? getYearValue(startYear, year) : year);
        const finalItemForTsv = newItem;
        const sanitize = (s)=> String(s==null?'':s).replace(/\t/g,' ').replace(/\r?\n/g,' ');
        const genrePipe = Array.isArray(finalItemForTsv.genre) ? finalItemForTsv.genre.join('|') : sanitize(finalItemForTsv.genre||'');
        const tsv = [
          sanitize(finalItemForTsv.label),
          sanitize(finalItemForTsv.label_en),
          finalItemForTsv.startYear != null ? String(finalItemForTsv.startYear) : '',
          finalItemForTsv.endYear === 'ongoing' ? 'ongoing' : (finalItemForTsv.endYear != null ? String(finalItemForTsv.endYear) : ''),
          genrePipe,
          finalItemForTsv.imp != null ? String(finalItemForTsv.imp) : '',
          sanitize(finalItemForTsv.url),
          sanitize(finalItemForTsv.url_en),
          sanitize(finalItemForTsv.note),
          sanitize(finalItemForTsv.note_en),
          '' // image
        ].join('\t');
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {

  // 個別の項目から時代区分を登録する機能
  function addEraFromItem(year, index) {
    const items = events[year] || [];
    const item = items[index];
    if (!item) {
      showError('エラー', '項目が見つかりません。');
      return;
    }
    
    const startYear = getYearValue(item.startYear, year);
    // 項目の終了年が「ongoing」の場合は時代区分も「ongoing」に設定
    const endYear = item.endYear === 'ongoing' ? 'ongoing' : (getYearValue(item.endYear, year));
    const eraName = item.label + (item.genre ? ` [${Array.isArray(item.genre) ? item.genre.join('・') : item.genre}]` : '');
    
    console.log('addEraFromItem: 項目情報', {
      itemLabel: item.label,
      itemStartYear: item.startYear,
      itemEndYear: item.endYear,
      eraStartYear: startYear,
      eraEndYear: endYear
    });
    
    // 既存の時代区分があるかチェック
    const existingEraIndex = eraSettings.findIndex(era => 
      era.name === eraName && 
      era.startYear === startYear && 
      era.endYear === endYear
    );
    
    if (existingEraIndex !== -1) {
      // 既存の時代区分を削除
      eraSettings.splice(existingEraIndex, 1);
      saveEvents();
      renderEraBackgrounds();
      return;
    }
    
    // 利用可能な色のリスト
    const availableColors = [
      '#4169E1', '#32CD32', '#DC143C', '#FF8C00', 
      '#8A2BE2', '#00CED1', '#FFD700', '#696969',
      '#FF69B4', '#00FF7F', '#FF4500', '#9370DB',
      '#20B2AA', '#FFA500', '#FF1493', '#32CD32'
    ];
    
    // 既に使用されている色を取得
    const usedColors = eraSettings.map(era => era.color);
    
    // 未使用の色を選択
    let selectedColor = availableColors.find(color => !usedColors.includes(color));
    if (!selectedColor) {
      // 全ての色が使用されている場合は最初の色を使用
      selectedColor = availableColors[0];
    }
    
    const newEra = {
      name: eraName,
      startYear: startYear,
      endYear: endYear,
      color: selectedColor,
      opacity: '0.3',
      enabled: true
    };
    
    console.log('addEraFromItem: 作成する時代区分', newEra);
    
    // 新しい時代区分を先頭に追加（常に新しいものから並ぶように）
    eraSettings.unshift(newEra);
    
    // 保存
    saveEvents();
    renderEraBackgrounds();
    
    showInfo('時代区分登録完了', `「${item.label}」の時代区分を登録しました。`);
  }

  // ===== 編集UI（テキスト） =====
  function serializeLine(it){ const startYear=String(it.startYear||'').trim(); const endYear=String(it.endYear||'').trim(); const label=String(it.label||'').trim(); const labelEn=String(it.label_en||'').trim(); const g = Array.isArray(it.genre) ? it.genre.join('・') : String(it.genre||'').trim(); const imp=(it.imp===undefined||it.imp===null||String(it.imp)==='')? '' : String(it.imp); const url=String(it.url||'').trim(); const urlEn=String(it.url_en||'').trim(); const note=String(it.note||'').trim(); const noteEn=String(it.note_en||'').trim(); const timeLabel=normalizeTimeLabelValue(it.timeLabel); if(!startYear && !endYear && !g && !imp && !url && !note && !labelEn && !urlEn && !noteEn && !timeLabel) return label; return [startYear,endYear,label,labelEn,g,imp,url,urlEn,note,noteEn,timeLabel].join(';'); }
  function parseLine(line){ const raw=line.trim(); if(!raw) return null; const parts=raw.split(';'); const startYear=(parts[0]||'').trim(); const endYear=(parts[1]||'').trim(); const label=(parts[2]||'').trim(); const labelEn=(parts[3]||'').trim(); if(!label && !labelEn) return null; const genreStr=(parts[4]||'').trim(); let imp=(parts[5]||'').trim(); imp = imp? String(Math.min(5, Math.max(1, parseInt(imp,10)))): ''; const url=(parts[6]||'').trim(); const urlEn=(parts[7]||'').trim(); const note=(parts[8]||'').trim(); const noteEn=(parts[9]||'').trim(); const timeLabel=normalizeTimeLabelValue(parts[10]); const o={label}; if(labelEn) o.label_en=labelEn; if(startYear) o.startYear=startYear; if(endYear) { if(endYear.toLowerCase() === 'ongoing') { o.endYear = 'ongoing'; } else { o.endYear = endYear; } } if(genreStr) { const genres = genreStr.split('・').map(g => g.trim().toUpperCase()); o.genre = genres.length > 0 ? genres : [genreStr.toUpperCase()]; } if(imp) o.imp=imp; if(url) o.url=url; if(urlEn) o.url_en=urlEn; if(note) o.note=note; if(noteEn) o.note_en=noteEn; if(timeLabel) o.timeLabel=timeLabel; return o; }
  function validateItem(year, it){ const errs=[]; if(it.genre) { const genres = Array.isArray(it.genre) ? it.genre : [it.genre]; for(const genre of genres) { const code=String(genre).toUpperCase(); if(!code){ errs.push(`不正なジャンル: ${genre}`); } } } if(it.imp!==undefined && it.imp!=='' && !(parseInt(it.imp,10)>=1 && parseInt(it.imp,10)<=5)) errs.push(`不正な重要度: ${it.imp}`); const yVal = getYearValue(year, year); if(!(Number.isInteger(yVal) && yVal>=YEAR_MIN && yVal<=YEAR_MAX)) errs.push(`年の範囲外: ${year}`); return errs; }
  function linesFromItems(items){ return items.map(serializeLine).join('\n'); }

  // ===== レンダリング（フィルタ適用・単純クリップ） =====
  // 項目をソートする関数（メイン年表を優先、その後参照年表を指定順で）
  function sortItems(items) {
    if (!items || items.length === 0) return items;
    
    // 参照年表の順序を取得（githubConfig.refTimelinesのインデックス）
    const refTimelines = (githubConfig && githubConfig.refTimelines && Array.isArray(githubConfig.refTimelines)) 
      ? githubConfig.refTimelines 
      : [];
    const refOrderMap = new Map();
    refTimelines.forEach((ref, index) => {
      // groupIdを生成（GitHubの場合はfilePath、Sheetsの場合は`${sheetId}/${ev}`）
      let groupId = '';
      if (ref && ref.filePath) {
        groupId = ref.filePath;
      } else if (ref && ref.sheetId) {
        const ev = (ref && (ref.ev || ref.events)) ? String(ref.ev || ref.events).trim() : 'events';
        groupId = `${ref.sheetId}/${ev}`;
      }
      if (groupId) {
        refOrderMap.set(groupId, index);
      }
    });
    
    return [...items].sort((a, b) => {
      const aIsRef = a && a._source === 'ref';
      const bIsRef = b && b._source === 'ref';
      
      // メイン年表を優先
      if (!aIsRef && bIsRef) return -1;
      if (aIsRef && !bIsRef) return 1;
      
      // 両方ともメイン年表の場合は元の順序を保持
      if (!aIsRef && !bIsRef) return 0;
      
      // 両方とも参照年表の場合は、_refGroupIdの順序でソート
      const aGroupId = a._refGroupId || '';
      const bGroupId = b._refGroupId || '';
      const aOrder = refOrderMap.get(aGroupId) ?? 9999;
      const bOrder = refOrderMap.get(bGroupId) ?? 9999;
      
      return aOrder - bOrder;
    });
  }

  function renderMobileEventLabelsForYear(bucketYear, visibleItems) {
    const MOBILE_LABEL_X = DECADE_GUTTER + 4;
    const maxWidth = getMobileLabelMaxWidth();
    const fontSize = getMobileEventLabelFontSize();
    const SEP = '／';

    const tokens = visibleItems.map(function(item, index) {
      const text = getDisplayItemLabel(item);
      return {
        text: text,
        index: index,
        isRef: !!(item && item._source === 'ref')
      };
    }).filter(function(t) { return t.text && String(t.text).length > 0; });
    if (tokens.length === 0) return;

    const yearPart = String(bucketYear % 100).padStart(2, '0');
    const prefix = yearPart + ' ';
    const segments = [];
    let usedWidth = measureEventLabelTextWidth(prefix, fontSize);

    for (let i = 0; i < tokens.length; i++) {
      const labelText = String(tokens[i].text);
      const sepPart = i > 0 ? SEP : '';
      const candidate = sepPart + labelText;
      const candidateWidth = measureEventLabelTextWidth(candidate, fontSize);
      if (usedWidth + candidateWidth <= maxWidth) {
        if (i > 0) segments.push({ sep: true });
        segments.push({ text: labelText, isRef: tokens[i].isRef });
        usedWidth += candidateWidth;
        continue;
      }
      if (i > 0) {
        const sepWidth = measureEventLabelTextWidth(SEP, fontSize);
        if (usedWidth + sepWidth > maxWidth) break;
        usedWidth += sepWidth;
        segments.push({ sep: true });
      }
      const remain = maxWidth - usedWidth;
      if (remain <= 0) break;
      let lo = 0;
      let hi = labelText.length;
      while (lo < hi) {
        const mid = Math.ceil((lo + hi) / 2);
        const w = measureEventLabelTextWidth(labelText.substring(0, mid), fontSize);
        if (w <= remain) lo = mid;
        else hi = mid - 1;
      }
      if (lo > 0) segments.push({ text: labelText.substring(0, lo), isRef: tokens[i].isRef });
      break;
    }

    const ypx = yFromBirthYear(bucketYear);
    const tx = textEl('', MOBILE_LABEL_X, ypx, 'eventLabel');
    tx.setAttribute('text-anchor', 'start');
    tx.setAttribute('dominant-baseline', 'central');
    tx.setAttribute('data-year', bucketYear);
    if (tokens.length > 1) tx.classList.add('eventMulti');
    tx.style.cursor = 'pointer';
    tx.style.fontSize = fontSize + 'px';

    const yearSpan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    yearSpan.textContent = prefix;
    yearSpan.setAttribute('class', 'eventLabel-year');
    yearSpan.setAttribute('fill', '#333');
    tx.appendChild(yearSpan);

    segments.forEach(function(seg) {
      if (seg.sep) {
        const sepSpan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
        sepSpan.textContent = SEP;
        sepSpan.setAttribute('fill', '#999');
        tx.appendChild(sepSpan);
        return;
      }
      const labelSpan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      labelSpan.textContent = seg.text;
      labelSpan.setAttribute('fill', seg.isRef ? '#5c6bc0' : '#c00');
      tx.appendChild(labelSpan);
    });

    eventsG.appendChild(tx);
    wireMobileEventLabelInteractions(tx, bucketYear, visibleItems);
  }

  function renderEvents(){
    eventsG.innerHTML=''; clearHighlight(true);
    // すべてのハイライトクラスを確実にクリア
    document.querySelectorAll('.hlText').forEach(el => el.classList.remove('hlText'));
    const years = Object.keys(events).map(Number).sort((a,b)=>a-b);
    const mobileView = isMobileExperience();
    if (mobileView) updateEventsClipForViewport(true);
    for(const y of years){
      const visibleItems = sortItems((events[y]||[]).filter(passesFilter));
      if (visibleItems.length === 0) continue;

      if (mobileView) {
        renderMobileEventLabelsForYear(y, visibleItems);
        continue;
      }

      const ypx=yFromBirthYear(y);
      // ラベル文字列と参照フラグのタプル配列を生成
      const labelTokens = visibleItems.map(it=>{
        const text = (currentLang === 'en' && it.label_en) ? it.label_en : it.label;
        return { text, isRef: !!(it && it._source === 'ref') };
      }).filter(t => t.text && String(t.text).length>0);
      if(labelTokens.length===0){ continue; }
      const yearPart = String(y % 100).padStart(2, '0');
      
      // 表示範囲を計算（左端から右端まで）
      const maxWidth = LABEL_RIGHT_X - LABEL_LEFT_X;
      const charWidth = 10; // 文字幅をより大きく見積もり（安全側に）
      const maxChars = Math.floor(maxWidth / charWidth);
      
      // 年部分は必ず表示し、ラベル部分のみ切り取り（すべて右詰め）
      const textX = LABEL_RIGHT_X; // 常に右端
      const textAnchor = 'end'; // 常に右詰め
      
      // より厳密な判定：年部分 + スペース + バッファを考慮
      const yearSpaceLength = yearPart.length + 1; // 年 + スペース
      const buffer = 8; // 余裕を持たせる文字数
      const minRequiredChars = yearSpaceLength + buffer;
      
      // tspan を用いて年＋各ラベルを個別着色で描画
      const tx=textEl('', textX, ypx, 'eventLabel');
      tx.setAttribute('text-anchor', textAnchor);
      tx.setAttribute('dominant-baseline','middle');
      tx.setAttribute('data-year', y);
      if(labelTokens.length>1) tx.classList.add('eventMulti');
      tx.style.cursor='pointer';
      
      // まず年（4桁/可変）を追加（年は共通色）
      const yearSpan = document.createElementNS('http://www.w3.org/2000/svg','tspan');
      yearSpan.textContent = yearPart;
      yearSpan.setAttribute('fill', '#333');
      tx.appendChild(yearSpan);
      // スペース
      const spaceSpan = document.createElementNS('http://www.w3.org/2000/svg','tspan');
      spaceSpan.textContent = ' ';
      spaceSpan.setAttribute('fill', '#333');
      tx.appendChild(spaceSpan);

      // 文字数制限に合わせてラベルを順次追加（区切りは '／'）
      const maxPayloadChars = Math.max(0, maxChars - yearSpaceLength - buffer);
      let usedChars = 0;
      for (let i=0; i<labelTokens.length; i++){
        const token = labelTokens[i];
        const sepLen = (i===0?0:1); // 区切り文字分
        const allowed = maxPayloadChars - usedChars - sepLen;
        if (minRequiredChars > maxChars || allowed <= 0) break;

        // 区切り
        if(i>0){
          const sep = document.createElementNS('http://www.w3.org/2000/svg','tspan');
          sep.textContent='／';
          sep.setAttribute('fill', '#999');
          tx.appendChild(sep);
        }

        // ラベル本体（必要なら切り詰め）
        const labelText = String(token.text);
        const take = Math.max(0, Math.min(labelText.length, allowed));
        if (take<=0) break;
        const shown = (labelText.length>take) ? labelText.substring(0,take) : labelText;
        const span = document.createElementNS('http://www.w3.org/2000/svg','tspan');
        span.textContent = shown;
        span.setAttribute('fill', token.isRef ? '#5c6bc0' : '#c00');
        tx.appendChild(span);
        usedChars += (sepLen + shown.length);
        // これ以上入らない場合はループ終了
        if (usedChars >= maxPayloadChars) break;
      }
      eventsG.appendChild(tx);
      
      // ツールチップ／クリック
      tx.addEventListener('mouseenter',e=>{ 
        clearHighlight(); 
        tooltip.style.display='block'; 
        const items = sortItems((events[y]||[]).filter(passesFilter));
        const tooltipContent = items.map(item => {
          const displayLabel = getDisplayItemLabelHtml(item);
          const color = (item && item._source === 'ref') ? '#5c6bc0' : 'inherit';
          let content = `<li style=\"color:${color}; font-size:${hoverFontSizes.label};\"><strong>${displayLabel}</strong>`;
          if (item.imp) content += ` <span style=\"color:#666; font-size:${hoverFontSizes.importance};\">★${item.imp}</span>`;
          // 注釈（言語に応じて note / note_en）
          const noteText = (currentLang === 'en' && item.note_en) ? item.note_en : item.note;
          if (noteText) content += ` <span style=\"color:#333; font-size:${hoverFontSizes.note};\"> — ${noteText}</span>`;
          content += '</li>';
          return content;
        }).join('');
        const yearText = currentLang === 'en' ? `${y}` : `${y}年`;
        tooltip.innerHTML=`<strong style="font-size:${hoverFontSizes.year};">${yearText}</strong><ul style="margin:4px 0 0 16px;">${tooltipContent}</ul>`; 
        positionTooltip(e); 
      });
      tx.addEventListener('mousemove',positionTooltip);
      tx.addEventListener('mouseleave',()=>{tooltip.style.display='none'});
      tx.addEventListener('click',(e)=>{ 
        e.stopPropagation(); // イベント伝播を防ぐ
        tooltip.style.display='none'; 
        showDetailList(y, e.target); 
      });
    }

    if (typeof searchBox !== 'undefined' && searchBox.value.trim()) {
      // 検索ボックスに値がある場合は、フィルタ変更に合わせて検索結果を更新（スクロール位置は維持）
      doSearch(true);
    } else {
      // 検索ボックスが空の場合は、検索ポップアップをクリア
      clearSearchPopups();
    }
    if (typeof applyMobileSimpleViewerMode === 'function') applyMobileSimpleViewerMode();
    if (typeof syncMobileSvgTypography === 'function') syncMobileSvgTypography();
  }
  

  // ===== 検索 =====
  function updateSearchPlaceholder() {
    const isDetailSearch = detailSearchCheckbox.checked;
    if (currentLang === 'en') {
      searchBox.placeholder = isDetailSearch ? 
        "Detail search (selected genres only)" : 
        "Search labels (selected genres only)";
    } else {
      searchBox.placeholder = isDetailSearch ? 
        "詳細検索（選択中ジャンルのみ）" : 
        "ラベルを検索（選択中ジャンルのみ）";
    }
  }
  
  function doSearch(opt_preserveScroll){ 
    clearHighlight(true); 
    clearSearchPopups(true);
    // 検索結果ツールチップをクリア
    if (searchResultTooltip) searchResultTooltip.style.display = 'none';
    const q=searchBox.value.trim(); 
    if(!q){ 
      matches=[]; 
      matchIndex=-1; 
      currentSearchQuery = '';
      allSearchResults = [];
      currentSearchIndex = -1;
      lastSearchDetailMode = detailSearchCheckbox.checked;
      // 検索ボックスが空の場合はすべてのハイライトをクリア
      document.querySelectorAll('.hlText').forEach(el => el.classList.remove('hlText'));
      return; 
    } 
    
    console.log('検索クエリ:', q);
    console.log('詳細検索モード:', detailSearchCheckbox.checked);
    console.log('現在の言語:', currentLang);
    console.log('検索対象フィールド:', {
      ja: detailSearchCheckbox.checked ? 'label + note' : 'label only',
      en: detailSearchCheckbox.checked ? 'label_en + note_en' : 'label_en only'
    });
    
    // フィルタ（メイン/参照ジャンル・詳細ON/OFF・言語）に依らず毎回再構築
    currentSearchQuery = q;
    allSearchResults = [];
    currentSearchIndex = -1;
    
    // 検索対象は「選択中ジャンルのみ」（参照は所属グループの選択セットに従う）
    const isDetailSearch = detailSearchCheckbox.checked;
    lastSearchDetailMode = isDetailSearch;
    const qLower = q.toLowerCase();
    
    // 「*」が指定された場合は、選択されている分野のすべての項目を結果として表示
    const isWildcardSearch = (q === '*');
    // 一覧表示にするかの判定（ワイルドカード、listボタン指定、前回一覧＋再描画）
    const shouldShowAll = isWildcardSearch || forceShowAllSearchResults || (opt_preserveScroll === true && lastSearchShowAll === true);
    
      // 年を昇順にソートして検索（若い年からヒット）
      const yearsOrderedForSearch = Object.keys(events).map(Number).sort((a,b)=>a-b);
      for (const year of yearsOrderedForSearch) {
        const items = events[year] || [];
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          if (mainTimelineOnlyCheckbox && mainTimelineOnlyCheckbox.checked && item && item._source === 'ref') continue;
          // ジャンルフィルタ
          if (!itemHasSelectedGenre(item)) continue; // 参照含めてジャンル条件で早期スキップ
          
          // 重要度フィルタ
          if(filterImp){ 
            const thr = parseInt(filterImp,10); 
            const imp = parseInt(item.imp,10); 
            if(isNaN(imp) || imp<thr) continue; 
          }
          
          // 「*」の場合は、すべての項目を結果に追加
          if (isWildcardSearch) {
            const yearInt = parseInt(year);
            allSearchResults.push({ 
              year: yearInt, 
              index: i,
              item,
              label: currentLang === 'en' ? item.label_en : item.label,
              labelJa: item.label,
              labelEn: item.label_en
            });
            continue;
          }
          
          // 言語モードに応じた検索対象フィールドの選択
          let labelMatch = false;
          let noteMatch = false;
          
          if (currentLang === 'en') {
            // 英語モード: label_en を対象（詳細検索時は note_en も）
            labelMatch = item.label_en && item.label_en.toLowerCase().includes(qLower);
            if (isDetailSearch) {
              noteMatch = item.note_en && item.note_en.toLowerCase().includes(qLower);
            }
          } else {
            // 日本語モード: label を対象（詳細検索時は note も）
            labelMatch = item.label && item.label.toLowerCase().includes(qLower);
            if (isDetailSearch) {
              noteMatch = item.note && item.note.toLowerCase().includes(qLower);
            }
          }
          
          // デバッグ情報（最初の数件のみ）
          if (allSearchResults.length < 3) {
            console.log('検索対象フィールド確認:', {
              year,
              currentLang,
              isDetailSearch,
              labelMatch,
              noteMatch,
              label: item.label,
              label_en: item.label_en,
              note: item.note,
              note_en: item.note_en,
              query: qLower
            });
          }
          
          if (labelMatch || noteMatch) {
            const yearInt = parseInt(year);
            const displayLabel = getDisplayItemLabel(item);
            allSearchResults.push({ 
              year: yearInt, 
              index: i,
              item,
              label: displayLabel,
              labelJa: item.label,
              labelEn: item.label_en,
              timeLabel: normalizeTimeLabelValue(item.timeLabel)
            });
            
            console.log('マッチした項目:', { year, item, labelMatch, noteMatch });
          }
        }
      }
      
    console.log('全検索結果(ソート前):', allSearchResults);
    // 年（昇順）→ ラベル（日本語優先、jaロケール）で安定ソート
    allSearchResults.sort((a,b)=>{
      const y = (a.year||0) - (b.year||0);
      if (y !== 0) return y;
      const la = (a.labelJa || a.label || '') || '';
      const lb = (b.labelJa || b.label || '') || '';
      return la.localeCompare(lb, 'ja');
    });
    console.log('全検索結果(ソート後):', allSearchResults);
    
    // 検索結果に基づいてマッチするラベル要素を取得
    // 画面表示に関係なく、events内の全項目を検索対象とする
    matches = [];
    
    // allSearchResultsの各結果について、対応する画面要素を探す
    for (const result of allSearchResults) {
      const yearElements = eventsG.querySelectorAll(`text[data-year="${result.year}"]`);
      let picked = null;
      // 「*」検索の場合は、年の一致だけでマッチする
      if (isWildcardSearch) {
        // ワイルドカード検索の場合は、年の最初の要素を使用
        if (yearElements.length > 0) {
          picked = yearElements[0];
        }
      } else {
        // 該当年の要素の中から、検索語 or ラベルのいずれかが含まれる要素を探す
        for (const element of yearElements) {
          const elementText = (element.textContent || '').toLowerCase();
          const targetLabel = (result.label || '').toLowerCase();
          const targetLabelJa = (result.labelJa || '').toLowerCase();
          const targetLabelEn = (result.labelEn || '').toLowerCase();
          if (elementText.includes(qLower) ||
              (targetLabel && elementText.includes(targetLabel)) ||
              (targetLabelJa && elementText.includes(targetLabelJa)) ||
              (targetLabelEn && elementText.includes(targetLabelEn))) {
            picked = element;
            break;
          }
        }
        // フォールバック：該当が見つからない場合は年の最初の要素を使用
        if (!picked && yearElements.length > 0) {
          picked = yearElements[0];
        }
      }
      if (picked) {
        matches.push(picked);
        console.log('マッチ（またはフォールバック）した画面要素:', { year: result.year, picked });
      }
    }
    
    console.log('最終的なマッチ数:', matches.length);
    console.log('検索結果総数:', allSearchResults.length);
    
    matchIndex = matches.length? 0 : -1; 
    // 検索実行時は最初の結果を表示し、currentSearchIndexも0に設定
    currentSearchIndex = allSearchResults.length > 0 ? 0 : -1;
    // 一覧表示フラグの最終決定（この検索サイクル用）
    lastSearchShowAll = shouldShowAll;
    forceShowAllSearchResults = false;
    
    if(matchIndex!==-1){ 
      highlight(matches[matchIndex], { noScroll: opt_preserveScroll === true }); 
      // 最初の検索結果にスクロール
      if (opt_preserveScroll !== true) scrollToMatch(matches[matchIndex]);
      
      if (shouldShowAll && allSearchResults.length > 0) {
        // requestAnimationFrameを使って、DOM要素が確実に存在するタイミングで表示
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            showAllSearchResultPopups();
          });
        });
      } else {
        // 通常の検索の場合は、最初の結果だけ表示
        const firstResult = allSearchResults[0];
        if (firstResult) { showSearchResultSVG(firstResult); }
      }
    } else if (allSearchResults.length > 0) {
      // 画面に表示されていない項目も検索結果に含まれている場合
      console.log('検索結果はあるが画面に表示されていない項目があります');
      // 最初の検索結果の年までスクロールし、その年のラベル全体をハイライト
      const firstResult = allSearchResults[0];
      const targetY = yFromBirthYear(firstResult.year);
      const viewportHeight = vp.clientHeight;
      const scrollTop = Math.max(0, targetY * getMobileViewerScale() - viewportHeight / 2);
      if (opt_preserveScroll !== true) vp.scrollTop = scrollTop;
      
      // スクロール後にその年のラベル要素をハイライト
      setTimeout(() => {
        const yearElements = eventsG.querySelectorAll(`text[data-year="${firstResult.year}"]`);
        if (yearElements.length > 0) {
          // その年の最初のラベル要素をハイライト
          highlight(yearElements[0], { noScroll: opt_preserveScroll === true });
        }
        
        if (shouldShowAll && allSearchResults.length > 0) {
          showAllSearchResultPopups();
        } else {
          // 通常の検索の場合は、最初の結果だけ表示
          showSearchResultSVG(firstResult);
        }
      }, 100); // スクロール完了を待つ
    } 
  }
  function nextMatch(dir){ 
    if(!matches.length && !allSearchResults.length) return; 
    
    // 前のツールチップをクリア
    if (searchResultTooltip) searchResultTooltip.style.display = 'none';
    
    // 画面に表示されている要素がある場合は従来通り
    if (matches.length > 0) {
      matchIndex=(matchIndex+ (dir>0?1:-1) + matches.length)%matches.length; 
      highlight(matches[matchIndex]); 
      scrollToMatch(matches[matchIndex]);
      
      // 現在のマッチ要素に対応する検索結果を特定（年とラベルで突き合わせ）
      const currentMatch = matches[matchIndex];
      const currentYear = parseInt(currentMatch.getAttribute('data-year'));
      const elementText = currentMatch.textContent || '';
      const idx = allSearchResults.findIndex(result => {
        if (result.year !== currentYear) return false;
        const ja = result.labelJa || '';
        const en = result.labelEn || '';
        const disp = result.label || '';
        return (ja && elementText.includes(ja)) ||
               (en && elementText.includes(en)) ||
               (disp && elementText.includes(disp));
      });
      if (idx !== -1) {
        currentSearchIndex = idx;
        showSearchResultSVG(allSearchResults[idx]);
      }
    } else {
      // 画面に表示されていない項目のみの場合は、allSearchResultsを使用
      findNextSearchResult(dir);
    }
  }
  
  // マッチした要素にスクロールする関数
  function scrollToMatch(element) {
    if (!element) return;
    
    const rect = element.getBoundingClientRect();
    const viewportHeight = vp.clientHeight;
    const elementTop = rect.top + vp.scrollTop;
    const elementBottom = elementTop + rect.height;
    const viewportTop = vp.scrollTop;
    const viewportBottom = viewportTop + viewportHeight;
    
    // 要素がビューポート外にある場合はスクロール
    if (elementTop < viewportTop || elementBottom > viewportBottom) {
      const scrollTop = Math.max(0, elementTop - viewportHeight / 2);
      vp.scrollTop = scrollTop;
    }
  }

  // 起動時に最も早い登録年を先頭に表示する関数
  function scrollToEarliestEvent() {
    if (!events || Object.keys(events).length === 0) {
      console.log('イベントデータがありません');
      return;
    }
    
    // フィルタを適用したイベントの年を取得
    const yearsWithEvents = Object.keys(events)
      .map(Number)
      .filter(year => {
        const yearEvents = events[year] || [];
        return yearEvents.some(event => passesFilter(event));
      })
      .sort((a, b) => a - b);
    
    if (yearsWithEvents.length === 0) {
      console.log('フィルタ条件に合うイベントがありません');
      return;
    }
    
    const earliestYear = yearsWithEvents[0];
    console.log('最も早い登録年:', earliestYear);
    
    // 該当する年のY座標を計算
    const targetY = yFromBirthYear(earliestYear);
    const scrollTop = getScaledScrollTopForSvgY(targetY, 50);
    
    // スクロール実行
    vp.scrollTop = scrollTop;
    
    console.log('初期スクロール完了:', { earliestYear, targetY, scrollTop });
  }

  // URLパラメータから初期表示年を取得（?year=YYYY または ?startYear=YYYY）
  function getInitialYearFromUrl() {
    try {
      const params = new URLSearchParams(window.location.search);
      const rawYear = (params.get('year') || params.get('startYear') || params.get('y') || params.get('xYear') || '').trim();
      if (!rawYear) return null;
      if (!/^-?\d+$/.test(rawYear)) return null;
      const year = Number(rawYear);
      if (!Number.isInteger(year)) return null;
      if (year < YEAR_MIN || year > YEAR_MAX) return null;
      return year;
    } catch (_e) {
      return null;
    }
  }

  // 指定年が表示領域上部に来るようにスクロール
  function scrollToYearAtStartup(targetYear) {
    if (!Number.isInteger(targetYear)) return;
    if (targetYear < YEAR_MIN || targetYear > YEAR_MAX) return;
    const targetY = yFromBirthYear(targetYear);
    const scrollTop = getScaledScrollTopForSvgY(targetY, 50);
    vp.scrollTop = scrollTop;
    console.log('URL指定年へ初期スクロール完了:', { targetYear, targetY, scrollTop });
  }

  // 連続検索機能（最適化版）
  function findNextSearchResult(direction) {
    if (!currentSearchQuery || allSearchResults.length === 0) {
      console.log('検索結果がありません');
      return;
    }
    clearSearchPopups();
    
    // 前のツールチップをクリア
    if (searchResultTooltip) searchResultTooltip.style.display = 'none';
    
    // 現在の検索結果のインデックスを更新
    if (direction > 0) {
      // 次へ
      currentSearchIndex = (currentSearchIndex + 1) % allSearchResults.length;
    } else {
      // 前へ
      currentSearchIndex = (currentSearchIndex - 1 + allSearchResults.length) % allSearchResults.length;
    }
    
    const targetResult = allSearchResults[currentSearchIndex];
    console.log('連続検索:', { direction, currentSearchIndex, targetResult });
    
    // 該当するラベル要素をハイライト（現在のDOMから検索）
    const targetYear = targetResult.year;
    const yearElements = eventsG.querySelectorAll(`text[data-year="${targetYear}"]`);
    let targetElement = null;
    
    // 同じ年の要素の中から、検索語 or ラベルのいずれかが含まれる要素を探す（部分一致・省略対策）
    for (const element of yearElements) {
      const elementText = (element.textContent || '').toLowerCase();
      const qLowerLocal = (currentSearchQuery || '').toLowerCase();
      const targetLabel = (targetResult.label || '').toLowerCase();
      const targetLabelJa = (targetResult.labelJa || '').toLowerCase();
      const targetLabelEn = (targetResult.labelEn || '').toLowerCase();
      if ((qLowerLocal && elementText.includes(qLowerLocal)) ||
          (targetLabel && elementText.includes(targetLabel)) ||
          (targetLabelJa && elementText.includes(targetLabelJa)) ||
          (targetLabelEn && elementText.includes(targetLabelEn))) {
        targetElement = element;
        break;
      }
    }
    if (!targetElement && yearElements.length > 0) {
      // フォールバック：年の最初の要素
      targetElement = yearElements[0];
    }
    
    if (targetElement) {
      // 同じ要素でもポップアップは更新する（複数ラベルが同一年に存在するため）
      clearHighlight(true);
      highlight(targetElement);
      scrollToMatch(targetElement);
      showSearchResultSVG(targetResult);
    } else {
      // 画面に表示されていない項目の場合、その年までスクロールしてハイライト
      console.log('画面に表示されていない項目を検索:', { targetYear, targetResult });
      const targetY = yFromBirthYear(targetYear) * getMobileViewerScale();
      const viewportHeight = vp.clientHeight;
      const scrollTop = Math.max(0, targetY - viewportHeight / 2);
      vp.scrollTop = scrollTop;
      
      // スクロール後にその年のラベル要素をハイライト
      setTimeout(() => {
        const yearElements = eventsG.querySelectorAll(`text[data-year="${targetYear}"]`);
        if (yearElements.length > 0) {
          // その年の最初のラベル要素をハイライト
          clearHighlight(true);
          highlight(yearElements[0]);
        }
        
        // 検索結果ツールチップを表示（年のラベルの右側）
        const tooltipYearElements2 = eventsG.querySelectorAll(`text[data-year="${targetYear}"]`);
        if (tooltipYearElements2.length > 0) {
          const rect = tooltipYearElements2[0].getBoundingClientRect();
          const r = vp.getBoundingClientRect();
          showSearchResultSVG(targetResult);
        }
      }, 100); // スクロール完了を待つ
    }
  }


  searchBtn.addEventListener('click', doSearch);
  searchBox.addEventListener('keydown', e=>{ if(e.key==='Enter'){ doSearch(); }});
  
  // 検索ボックスの内容が変更された時に検索結果をクリア
  searchBox.addEventListener('input', ()=> { /* 入力中は検索結果・ポップアップを維持 */ });
  nextBtn.addEventListener('click', ()=> {
    clearSearchPopups();
    const currentValue = searchBox.value.trim();
    if (currentSearchQuery && allSearchResults.length > 0 && currentValue === currentSearchQuery) {
      // 検索結果があり、現在の検索ワードが一致する場合は、画面表示に関係なく全検索結果を対象とする
      findNextSearchResult(1);
    } else if (matches.length > 0 && currentValue === currentSearchQuery) {
      nextMatch(1);

    // 検索ワードが変更されている場合は何もしない
  });
  
  prevBtn.addEventListener('click', ()=> {

    if (currentSearchQuery && allSearchResults.length > 0 && currentValue === currentSearchQuery) {
      // 検索結果があり、現在の検索ワードが一致する場合は、画面表示に関係なく全検索結果を対象とする
      findNextSearchResult(-1);
    } else if (matches.length > 0 && currentValue === currentSearchQuery) {
      nextMatch(-1);
    }
    // 検索ワードが変更されている場合は何もしない
  });
  const listBtn = document.getElementById('listBtn');
  if (listBtn) {
    listBtn.addEventListener('click', ()=> {
      // 検索未実行 / ワード変更 / 詳細モード変更 / 既存結果なし の場合は先に検索を実行
      const currentValue = searchBox.value.trim();
      const detailChanged = (lastSearchDetailMode !== detailSearchCheckbox.checked);
      if (!currentSearchQuery || currentValue !== currentSearchQuery || detailChanged || !Array.isArray(allSearchResults) || allSearchResults.length === 0) {
        forceShowAllSearchResults = true; // 次の検索結果を一覧表示させる
        doSearch();

  detailSearchCheckbox.addEventListener('change', ()=> {
    updateSearchPlaceholder();
    // 検索結果の保持（自動クリアしない）
  });
  vp.addEventListener('click', (e)=>{ 
    const t = e.target;
    const isBg = (t === vp) || (t && (t.id === 'stageScaler' || t.id === 'eventColBg' || t.id === 'eventColBorder' || t.id === 'stage' || (t.classList && t.classList.contains('era-background'))));
    if (isBg) {

      try {

        const stageX = coords.x;
        const stageY = coords.y;
        const leftMinX = DECADE_GUTTER;
        const leftMaxX = LEFT_COL_W - HANDLE_LANE_W - 4;
        if (stageX >= leftMinX && stageX <= leftMaxX) {
          let yFloat = (stageY - ORIGIN_Y) / PX_PER_YEAR + YEAR_MIN;
          let year = Math.round(yFloat);
          if (!Number.isFinite(year)) return;
          if (year < YEAR_MIN) year = YEAR_MIN;
          if (year > YEAR_MAX) year = YEAR_MAX;
          if (!isEditMode) {
            if (isMobileExperience()) showDetailList(year, null, false);
            return;
          }
          // 左カラムの空白クリック時は、常に編集モーダルを開く（保存時のみシートへ移動）
          showEditModal(year, -1, { label: '', startYear: year, endYear: '' });
        }
      } catch(_e){}
    }
  });

  // ===== 既存ラベル・ジャンル組み合わせ集合 =====
  function buildLabelGenreSet(excludeYear = null, excludeIndex = null){ 
    const s=new Set(); 
    for(const y of Object.keys(events)){ 
      for(let i = 0; i < (events[y]||[]).length; i++){ 
        const it = events[y][i];
        if(!it) continue;
        // 削除フラグの項目は重複判定から除外
        if (it.deleted === true) continue;
        // 編集対象の項目は重複判定から除外
        if (excludeYear !== null && excludeIndex !== null && String(y) === String(excludeYear) && i === excludeIndex) {
          continue;
        }
        
        const genreKey = Array.isArray(it.genre) ? it.genre.slice().sort().join('・') : (it.genre || '');
        const startYear = getYearValue(it.startYear, y) ?? '';
        const label = (it.label && typeof it.label==='string') ? it.label.trim() : '';
        const labelEn = (it.label_en && typeof it.label_en==='string') ? it.label_en.trim() : '';
        // ラベル（日本語・英語）とジャンル、開始年の組み合わせで重複チェック
        const key = `${label}|${labelEn}|${startYear}|${genreKey}`;
        s.add(key);
      } 
    } 
    return s; 
  }

  // ===== 共通のキー生成関数 =====
  function createItemKey(item, year) {
    const labelPrimary = (item && item.label_en && String(item.label_en).trim()) ? String(item.label_en).trim() : String((item && item.label) || '');
    const genreKey = Array.isArray(item.genre) ? item.genre.slice().map(g=>String(g).toUpperCase()).sort().join('・') : String(item.genre || '').toUpperCase();
    const startYear = getYearValue(item && item.startYear, year);
    return `${labelPrimary}|${startYear}|${genreKey}`;
  }

  // ===== コアデータの比較関数 =====
  function isSameCoreData(item1, item2) {
    if (!item1 || !item2) return false;
    
    const genre1 = Array.isArray(item1.genre) ? item1.genre.slice().sort().join('・') : (item1.genre || '');
    const genre2 = Array.isArray(item2.genre) ? item2.genre.slice().sort().join('・') : (item2.genre || '');
    
    return (item1.label || '') === (item2.label || '') &&
           (item1.label_en || '') === (item2.label_en || '') &&
           (item1.startYear || '') === (item2.startYear || '') &&
           genre1 === genre2;

  // ===== 同期用の補助関数 =====
  function buildMainEventsOnly(src, { includeDeleted = false } = {}) {
    const out = {};
    if (!src || typeof src !== 'object') return out;
    for (const [year, arr] of Object.entries(src)) {
      const items = Array.isArray(arr)
        ? arr.filter(it => it && it._source !== 'ref' && (includeDeleted || it.deleted !== true))
        : [];
      if (items.length > 0) {
        out[year] = items.map(it => ({ ...it }));
      }
    }
    return out;
  }

  function normalizeForCompare(val) {
    if (Array.isArray(val)) {
      return val.map(normalizeForCompare);
    }
    if (val && typeof val === 'object') {
      const obj = {};
      Object.keys(val).sort().forEach(k => {
        obj[k] = normalizeForCompare(val[k]);
      });
      return obj;
    }
    return val === undefined ? null : val;
  }

  function areEventsEqual(a, b) {
    return JSON.stringify(normalizeForCompare(a)) === JSON.stringify(normalizeForCompare(b));
  }

  function deepEqualNormalized(a, b) {
    return JSON.stringify(normalizeForCompare(a)) === JSON.stringify(normalizeForCompare(b));
  }

  function mapEventsByKey(eventsObj) {
    const m = new Map();
    if (!eventsObj || typeof eventsObj !== 'object') return m;
    for (const [year, arr] of Object.entries(eventsObj)) {
      const list = Array.isArray(arr) ? arr : [];
      for (const it of list) {
        const key = createItemKey(it, year);
        m.set(key, { year, item: it });
      }
    }
    return m;
  }

  function parseBaselineMainEvents() {
    if (!lastSyncedEventsData) return {};
    try {
      return JSON.parse(lastSyncedEventsData);
    } catch (e) {
      console.warn('lastSyncedEventsData の解析に失敗。空のベースラインとして扱います:', e);
      return {};
    }
  }

  // リモートが新しい場合の再読込・競合チェック・編集分上書き
  function reconcileRemoteNewerEvents(remoteEvents) {
    const baseline = parseBaselineMainEvents(); // 前回同期時のメインデータ
    const localActive = buildMainEventsOnly(events, { includeDeleted: false });
    const localAll = buildMainEventsOnly(events, { includeDeleted: true });
    const remoteMain = buildMainEventsOnly(remoteEvents, { includeDeleted: false });

    const baselineMap = mapEventsByKey(baseline);
    const localActiveMap = mapEventsByKey(localActive);
    const localAllMap = mapEventsByKey(localAll);
    const remoteMap = mapEventsByKey(remoteMain);

    const editedKeys = new Set();
    const deletedKeys = new Set();

    // 変更・削除の検出（ベースラインとの差分）
    for (const [key, { item: baseItem }] of baselineMap.entries()) {
      const localEntry = localAllMap.get(key);
      if (!localEntry || (localEntry.item && localEntry.item.deleted === true)) {
        deletedKeys.add(key);
        continue;
      }
      if (!areEventsEqual(baseItem, localEntry.item)) {
        editedKeys.add(key);
      }
    }
    // 新規追加
    for (const [key] of localActiveMap.entries()) {
      if (!baselineMap.has(key)) {
        editedKeys.add(key);
      }
    }

    // 競合検出
    const conflicts = [];
    for (const key of editedKeys) {
      const baseItem = baselineMap.get(key)?.item;
      const remoteItem = remoteMap.get(key)?.item;
      if (!baseItem) {
        if (remoteItem) {
          conflicts.push({ key, reason: '他のユーザーが同じイベントを追加', label: remoteItem.label || '' });
        }
        continue;
      }
      if (remoteItem && !areEventsEqual(baseItem, remoteItem)) {
        conflicts.push({ key, reason: '他のユーザーが同じイベントを編集', label: remoteItem.label || baseItem.label || '' });
      }
    }
    for (const key of deletedKeys) {
      const baseItem = baselineMap.get(key)?.item;
      const remoteItem = remoteMap.get(key)?.item;
      if (remoteItem && !areEventsEqual(baseItem, remoteItem)) {
        conflicts.push({ key, reason: '削除予定のイベントが他ユーザーにより編集', label: remoteItem.label || baseItem?.label || '' });
      }
    }

    if (conflicts.length > 0) {
      throw new ConflictError('他のユーザーによる編集と競合しました。最新データを確認してください。', conflicts);
    }

    // 競合なし: リモートをベースに、ローカル編集のみ適用・削除反映
    const merged = JSON.parse(JSON.stringify(remoteMain));

    // 削除適用
    for (const [year, arr] of Object.entries(merged)) {
      merged[year] = arr.filter(it => !deletedKeys.has(createItemKey(it, year)));
      if (merged[year].length === 0) {
        delete merged[year];
      }
    }

    // 編集・追加適用（リモート順を維持、存在しなければ追加）
    for (const key of editedKeys) {
      const localEntry = localActiveMap.get(key);
      if (!localEntry) continue;
      const { year, item } = localEntry;
      if (!merged[year]) merged[year] = [];
      const idx = merged[year].findIndex(it => createItemKey(it, year) === key);
      if (idx >= 0) {
        merged[year][idx] = item;
      } else {
        merged[year].push(item);
      }
    }

    return merged;
  }

  // CSVエクスポート機能（変更・追加・削除のみ）
  function exportToCSV() {
    const csvData = [];
    // 11列目 deleted、12列目 timeLabel を定義
    csvData.push('開始年;終了年;ラベル;label_en;ジャンル;重要度;URL;url_en;注釈;note_en;deleted;timeLabel');

    // ベースライン（最後に同期完了時のメインデータ）
    let baseline = {};
    try {
      baseline = lastSyncedEventsData ? JSON.parse(lastSyncedEventsData) : {};
    } catch (e) {
      console.warn('lastSyncedEventsData の解析に失敗。空のベースラインとして扱います:', e);
      baseline = {};
    }

    // 現在のメインデータを構築（参照データ/_source==='ref' と tombstone を除外）
    const buildMainFrom = (src) => {
      const out = {};
      for (const [y, arr] of Object.entries(src)) {
        const mainItems = (arr || []).filter(it => it && it._source !== 'ref' && it.deleted !== true);
        if (mainItems.length > 0) out[y] = mainItems;
      }
      return out;
    };
    const currentMain = buildMainFrom(events);

    // マップ化（キーは createItemKey）
    const mapify = (obj) => {
      const m = new Map();
      for (const [y, arr] of Object.entries(obj)) {
        for (const it of arr) {
          const key = createItemKey(it, y);
          m.set(key, { year: y, item: it });
        }
      }
      return m;
    };
    const baseMap = mapify(baseline);
    const currMap = mapify(currentMain);

    // バックアップ（編集前）データ集合（旧データ判定用）
    const backups = Object.values(labelBackups || {});

    const row10 = (obj) => {
      const startYear = obj.startYear || '';
      const endYear = obj.endYear || '';
      const label = obj.label || '';
      const labelEn = obj.label_en || '';
      const genre = Array.isArray(obj.genre) ? obj.genre.join('・') : (obj.genre || '');
      const imp = obj.imp || '';
      const url = obj.url || '';
      const urlEn = obj.url_en || '';
      const note = obj.note || '';
      const noteEn = obj.note_en || '';
      const timeLabel = normalizeTimeLabelValue(obj.timeLabel);
      // 11列目 deleted は row11DeletedTrue で付与する。12列目 timeLabel は常に末尾に出力する
      return `${startYear};${endYear};${label};${labelEn};${genre};${imp};${url};${urlEn};${note};${noteEn};;${timeLabel}`;
    };
    const row11DeletedTrue = (obj) => {
      const base = row10(obj);
      const parts = base.split(';');
      parts[10] = 'true';
      return parts.join(';');
    };

    let outCount = 0;

    // 1) 削除 or 編集前（旧）を出力：ベースラインにあるが現行に無い
    for (const [key, baseRec] of baseMap.entries()) {
      if (!currMap.has(key)) {
        const baseObj = baseRec.item;
        // 仕様上、削除も編集前（旧）も deleted=true の一行のみ
        csvData.push(row11DeletedTrue(baseObj));
        outCount++;
      }
    }

    // 2) 追加 or 編集後（新）を出力
    for (const [key, curRec] of currMap.entries()) {
      const curObj = curRec.item;
      if (!baseMap.has(key)) {
        // 追加（または識別子が変わった編集の新データ）
        csvData.push(row10(curObj));
        outCount++;
      } else {
        // キーは同じだが内容が変わっている（編集：imp/url/note 等）
        const baseObj = baseMap.get(key).item;
        const sameCore = isSameCoreData(baseObj, curObj);
        const sameNonCore = (
          String(baseObj.imp ?? '') === String(curObj.imp ?? '') &&
          String(baseObj.url ?? '') === String(curObj.url ?? '') &&
          String(baseObj.url_en ?? '') === String(curObj.url_en ?? '') &&
          String(baseObj.note ?? '') === String(curObj.note ?? '') &&
          String(baseObj.note_en ?? '') === String(curObj.note_en ?? '') &&
          String(baseObj.timeLabel ?? '') === String(curObj.timeLabel ?? '')
        );
        if (!sameNonCore) {
          // 編集後データを通常出力
          csvData.push(row10(curObj));
          outCount++;
        }
      }
    }

    if (outCount === 0) {
      showInfo('エクスポート結果', '変更・追加・削除された項目がありません。');
      return;
    }

    const csvContent = csvData.join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    const now = new Date();
    const pad2 = (n) => String(n).padStart(2, '0');
    const timestamp = `${now.getFullYear()}${pad2(now.getMonth() + 1)}${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}${pad2(now.getSeconds())}`;
    const safeToken = (v, fallback) => {
      const s = String(v || '').trim().replace(/[^A-Za-z0-9._-]/g, '_');
      return s || fallback;
    };
    const ownerToken = safeToken(githubConfig && githubConfig.owner, 'owner');
    const repoToken = safeToken(githubConfig && githubConfig.repo, 'repo');
    const filePathRaw = String((githubConfig && githubConfig.filePath) || '').trim();
    const fileNameOnly = filePathRaw.split('/').pop().split('\\').pop();
    const timelineToken = safeToken((fileNameOnly || 'timeline').replace(/\.[^.]+$/, ''), 'timeline');
    const filename = `xnative_changes_${ownerToken}_${repoToken}_${timelineToken}_${timestamp}_${outCount}items.csv`;
    link.setAttribute('download', filename);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    showInfo('エクスポート完了', `${outCount}件の変更・追加・削除をCSVで出力しました。リモートのDBには反映されていません。`);
    // トークンなしエクスポート後は、現在状態を基準として保存
    try {
      const mainEvents = {};
      for (const [year, items] of Object.entries(events)) {
        if (!Array.isArray(items)) continue;
        const mainItems = items.filter(item => !item || item._source !== 'ref');
        if (mainItems.length > 0) { mainEvents[year] = mainItems; }
      }
      lastSyncedEventsData = JSON.stringify(mainEvents);
      lsSetScoped(STORAGE_KEYS.lastSyncedEventsData, lastSyncedEventsData);
    } catch(_e){}
  }
